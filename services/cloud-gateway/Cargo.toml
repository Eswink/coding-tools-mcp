[package]
name = "coding-tools-cloud-gateway"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
axum = { version = "=0.8.4", features = ["form"] }
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
ring = "=0.17.14"
base64 = "=0.22.1"
url = "=2.5.4"
zeroize = "=1.8.1"
argon2 = "=0.5.3"
[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
