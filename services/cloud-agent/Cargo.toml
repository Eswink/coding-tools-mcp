[package]
name = "coding-tools-cloud-agent"
version = "0.1.0"
edition = "2021"
description = "Outbound authenticated Agent with locally supplied authority and durable no-replay state"
[workspace]
[dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16", features = ["v4", "serde"] }
ring = "=0.17.14"
base64 = "0.22.1"
url = "2.5.4"
zeroize = "1.8.1"
tokio-tungstenite = { version = "=0.26.2", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
