[package]
name = "coding-tools-native-link"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
ring = "=0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
