[package]
name = "windows-lpac-runtime-diagnostic"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "windows_sandbox_fixture"
path = "baseline/windows_sandbox_fixture.rs"

[[bin]]
name = "windows_runtime_fixture"
path = "runtime_fixture.rs"

[dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
