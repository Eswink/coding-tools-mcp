[package]
name = "snapshot-fixture-check"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = { version = "1", features=["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features=["v4"] }
libc = "0.2"
fs2 = "0.4"
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
