name: Issue 73 GitNexus symbol resolution (never merge)

on:
  push:
    branches: ['ci/issue73-symbol-resolution-20260926']
    paths:
      - '.github/workflows/continuation-issue73-symbol-resolution.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve exact local-agent spawn symbols then assess upstream impact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          "$graph" --help > evidence/help.txt 2>&1 || true
          "$graph" query "ProcessManager start services local-agent process execution" > evidence/query-process.txt 2>&1 || true
          "$graph" query "PtyManager start services local-agent PTY execution" > evidence/query-pty.txt 2>&1 || true
          "$graph" query "pty_unix spawn PlatformPty services local-agent" > evidence/query-pty-unix.txt 2>&1 || true
          for name in ProcessManager PtyManager spawn start; do
            echo "=== context $name ===" >> evidence/context.txt
            "$graph" context "$name" >> evidence/context.txt 2>&1 || true
          done
          cat evidence/query-process.txt evidence/query-pty.txt evidence/query-pty-unix.txt evidence/context.txt
          python - <<'PY' > evidence/candidates.txt
          import re, pathlib
          text="\n".join(
              pathlib.Path(p).read_text(encoding="utf-8",errors="replace")
              for p in [
                  "evidence/query-process.txt",
                  "evidence/query-pty.txt",
                  "evidence/query-pty-unix.txt",
                  "evidence/context.txt",
              ]
          )
          uids=sorted(set(re.findall(r'(?:Method|Function):services/local-agent/src/(?:process|pty|pty_unix|process_tree)\.rs:[^"\s,}]+', text)))
          for uid in uids:
              print(uid)
          PY
          cat evidence/candidates.txt
          : > evidence/impact-resolved.txt
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            echo "=== $target ===" | tee -a evidence/impact-resolved.txt
            "$graph" impact "$target" --direction upstream 2>&1 | tee -a evidence/impact-resolved.txt || true
          done < evidence/candidates.txt
          cat evidence/impact-resolved.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue73-symbol-resolution
          path: evidence/
          retention-days: 14
          if-no-files-found: error
