name: Safe patch candidate review (never merge)

on:
  push:
    branches: ['ci/safe-patch-candidate-review-20260924']
    paths:
      - 'src-tauri/src/tools/patch.rs'
      - 'src-tauri/src/tools/patch_transaction.rs'
      - 'src-tauri/src/tools/patch_transaction_tests.rs'
      - '.github/workflows/continuation-safe-patch-candidate-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify staged transaction impact and spec
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          git reset "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12 mcp-probe-kit@4.0.1
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/probe-install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"feature-issue-68-safe-patch-steady-fb01dcf53f\"}" > evidence/resume-plan.json 2>&1 || true
          cat evidence/resume-plan.json
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          git add src-tauri/src/tools/patch.rs src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          wc -l src-tauri/src/tools/patch.rs src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs | tee evidence/line-counts.txt
          test "$(wc -l < src-tauri/src/tools/patch_transaction.rs)" -lt 500
          test "$(wc -l < src-tauri/src/tools/patch_transaction_tests.rs)" -lt 500
          printf '%s\n' 'spec_gate_run=35907978737' 'spec_gate_result=success' > evidence/spec-gate-receipt.txt
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'src-tauri/src/tools/patch.rs',
              'src-tauri/src/tools/patch_transaction.rs',
              'src-tauri/src/tools/patch_transaction_tests.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$SOURCE_SHA^{tree}" > evidence/source-tree.txt
          echo NEVER_MERGE_HELPER_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-candidate-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Ubuntu native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify transactional patch candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          rustfmt --edition 2021 --check src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs
          git diff --check "$SOURCE_SHA"...HEAD
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format=json -- -D warnings \
            > evidence/clippy.jsonl 2> evidence/clippy.stderr
          clippy_code=$?
          set -e
          echo "clippy_exit=$clippy_code" | tee evidence/clippy-result.txt
          python - <<'PY' | tee -a evidence/clippy-result.txt
          import json, pathlib, sys
          candidates = {
              "src/tools/patch.rs",
              "src/tools/patch_transaction.rs",
              "src/tools/patch_transaction_tests.rs",
          }
          candidate_errors = []
          all_errors = 0
          for raw in pathlib.Path("evidence/clippy.jsonl").read_text(encoding="utf-8", errors="replace").splitlines():
              try:
                  item = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if item.get("reason") != "compiler-message":
                  continue
              message = item.get("message", {})
              if message.get("level") != "error":
                  continue
              all_errors += 1
              files = {
                  str(span.get("file_name", "")).replace("\\", "/")
                  for span in message.get("spans", [])
              }
              if any(any(name.endswith(candidate) for candidate in candidates) for name in files):
                  candidate_errors.append({
                      "code": (message.get("code") or {}).get("code"),
                      "message": message.get("message"),
                      "files": sorted(files),
                  })
          print(f"clippy_all_errors={all_errors}")
          print(f"clippy_candidate_errors={len(candidate_errors)}")
          for error in candidate_errors:
              print(json.dumps(error, ensure_ascii=False, sort_keys=True))
          if candidate_errors:
              sys.exit(1)
          PY
          cat evidence/clippy.stderr
          cargo test --locked --manifest-path src-tauri/Cargo.toml patch_transaction -- --nocapture 2>&1 | tee evidence/focused.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full.txt
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          git diff --check "$SOURCE_SHA"...HEAD
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'src-tauri/src/tools/patch.rs',
              'src-tauri/src/tools/patch_transaction.rs',
              'src-tauri/src/tools/patch_transaction_tests.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-candidate-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
