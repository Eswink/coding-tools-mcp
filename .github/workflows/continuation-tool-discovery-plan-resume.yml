name: Tool discovery resume delegated Plan (never merge)

on:
  push:
    branches: ['ci/tool-discovery-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-tool-discovery-plan-resume.yml'

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resume delegated Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json '{"project_root":"'"$PWD"'","plan_id":"feature-issue-72-deferred-steady-057f3854d4"}' > evidence/resume.json 2>&1
          cat evidence/resume.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-plan-resume
          path: evidence/
          retention-days: 14
          if-no-files-found: error
