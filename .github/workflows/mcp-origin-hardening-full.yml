name: MCP Origin hardening full validation

on:
  push:
    branches:
      - security/mcp-origin-validation
    paths:
      - 'src-tauri/src/mcp/**'
      - 'src-tauri/src/auth/公网身份v2.rs'
      - 'src-tauri/src/auth/**'
      - 'src-tauri/src/tools/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/mcp-origin-hardening-full.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-origin-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GitNexus detect changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx -y gitnexus@latest analyze > evidence/analyze.txt
          git reset --hard "$GITHUB_SHA"
          npx -y gitnexus@latest detect-changes --scope compare --base-ref origin/plan/offline-safe-connector-lifecycle | tee evidence/detect-changes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-origin-change-impact
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          node --test tests/offline-safe-ui.test.mjs
      - name: Rust checks
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings
