name: Pinned offline Rust tooling
on:
  push:
    branches: ['ci/pinned-rust-toolchain']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Cache only public locked dependencies and compiler components
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path services/local-agent/Cargo.toml
          root=$(rustc --print sysroot)
          mkdir -p "$RUNNER_TEMP/offline-rust/compiler" "$RUNNER_TEMP/offline-rust/cargo-home"
          cp -a "$root/bin" "$root/lib" "$RUNNER_TEMP/offline-rust/compiler/"
          cp -a "$HOME/.cargo/registry" "$RUNNER_TEMP/offline-rust/cargo-home/"
          find "$RUNNER_TEMP/offline-rust/cargo-home/registry" -type d -name .git -prune -exec rm -rf {} +
          rustc --version > "$RUNNER_TEMP/offline-rust/rustc-version.txt"
          rustfmt --version > "$RUNNER_TEMP/offline-rust/rustfmt-version.txt"
          cp services/local-agent/Cargo.lock "$RUNNER_TEMP/offline-rust/dependencies.lock"
          tar -czf "$RUNNER_TEMP/pinned-rust-1.98.1.tgz" -C "$RUNNER_TEMP/offline-rust" .
          sha256sum "$RUNNER_TEMP/pinned-rust-1.98.1.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-rust-1.98.1
          path: ${{ runner.temp }}/pinned-rust-1.98.1.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
