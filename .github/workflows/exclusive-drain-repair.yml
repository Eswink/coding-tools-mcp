name: Exclusive drain-startup repair
on:
  push:
    branches: ['fix/exclusive-drain-startup']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exclusive-drain-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/exclusive-conversation.yml
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Parallel full-suite diagnostic with uncaptured child lifecycle
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          python --version 2>&1 | tee evidence/python.txt
          set -euo pipefail
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 | tee evidence/parallel-drain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exclusive-drain-diagnostic
          path: evidence/
          if-no-files-found: error
          retention-days: 30
