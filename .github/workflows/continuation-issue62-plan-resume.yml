name: Issue 62 resume delegated plan (never merge)
on:
  push:
    branches: ['ci/issue62-plan-resume-20260924-r1']
    paths:
      - '.github/workflows/continuation-issue62-plan-resume.yml'
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resume exact Issue 62 Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          node - <<'NODE'
          const r=require('./evidence/resume.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-plan-resume
          path: evidence/
          retention-days: 14
          if-no-files-found: error
