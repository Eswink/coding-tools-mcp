name: Issue 74 Windows dynamic port range evidence (never merge)

on:
  push:
    branches: ['ci/issue74-windows-range-20260926']
    paths:
      - '.github/workflows/continuation-issue74-windows-range.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
          persist-credentials: false
          fetch-depth: 0
      - name: Record Windows TCP dynamic range and source identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          netsh int ipv4 show dynamicport tcp | Tee-Object -FilePath evidence/ipv4-dynamic-tcp.txt
          netsh int ipv6 show dynamicport tcp | Tee-Object -FilePath evidence/ipv6-dynamic-tcp.txt
          Get-NetTCPConnection -State Listen |
            Select-Object LocalAddress,LocalPort,OwningProcess |
            Sort-Object LocalPort |
            Format-Table -AutoSize |
            Out-String |
            Set-Content evidence/listeners.txt
          git rev-parse HEAD | Set-Content evidence/source-commit.txt
          if ((git rev-parse HEAD).Trim() -ne '6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd') { throw 'source mismatch' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-windows-range
          path: evidence/
          retention-days: 14
          if-no-files-found: error
