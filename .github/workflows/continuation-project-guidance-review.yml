name: Project guidance candidate review (never merge)

on:
  push:
    branches: ['ci/project-guidance-review-20260924']
    paths:
      - 'services/local-agent/src/guidance.rs'
      - 'services/local-agent/src/guidance_tests.rs'
      - 'services/local-agent/src/lib.rs'
      - '.github/workflows/continuation-project-guidance-review.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 4f925e44c54066b5cf7df57e1133404542d70aec

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify bounded staged impact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          git reset "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          git add services/local-agent/src/guidance.rs services/local-agent/src/guidance_tests.rs services/local-agent/src/lib.rs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          wc -l services/local-agent/src/guidance.rs services/local-agent/src/guidance_tests.rs | tee evidence/line-counts.txt
          test "$(wc -l < services/local-agent/src/guidance.rs)" -lt 500
          test "$(wc -l < services/local-agent/src/guidance_tests.rs)" -lt 500
          git diff --cached -- services/local-agent/src/lib.rs > evidence/lib.patch
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$SOURCE_SHA^{tree}" > evidence/source-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: project-guidance-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Verify local-agent guidance candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          cargo fmt --manifest-path services/local-agent/Cargo.toml --check
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/tests.txt
          cargo check --locked --manifest-path services/local-agent/Cargo.toml
          git diff --exit-code -- services/local-agent
          python - <<'PY' > evidence/source-hashes.txt
          import hashlib
          for p in [
              'services/local-agent/src/guidance.rs',
              'services/local-agent/src/guidance_tests.rs',
              'services/local-agent/src/lib.rs',
          ]:
              print(f"{p} {hashlib.sha256(open(p,'rb').read()).hexdigest()}")
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: project-guidance-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
