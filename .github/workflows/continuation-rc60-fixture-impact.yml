name: RC60 fixture impact review (never merge)

on:
  push:
    branches: ['ci/rc60-fixture-impact-20260924']
    paths:
      - '.github/workflows/continuation-rc60-fixture-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 2b9756d5ca20a078d69e530f94d62ee236355c87

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact test-fixture blast radius
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          target='Function:src-tauri/src/auth/exclusive_refresh_http_tests.rs:http_revoked_owner_drains_actual_background_process_before_successor'
          "$graph" context "$target" > evidence/context.txt 2>&1
          "$graph" impact "$target" --direction upstream > evidence/impact.txt 2>&1
          "$graph" query 'exclusive refresh HTTP drain startup python hold started readiness' > evidence/query.txt 2>&1 || true
          cat evidence/context.txt evidence/impact.txt evidence/query.txt
          git diff --exit-code
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-fixture-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
