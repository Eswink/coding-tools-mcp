name: Issue 69 protocol scope review (never merge)

on:
  push:
    branches: ['ci/issue69-scope-review-20260924']
    paths:
      - '.github/workflows/cloud-gateway-lab.yml'
      - 'tests/cloud-gateway/scope-guard.test.mjs'
      - '.github/workflows/continuation-issue69-scope-review.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: c177357aca6d7f428d558d4994682b183faef39e

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Review exact scope-guard impact and staged delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          candidate="$GITHUB_SHA"
          git checkout "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          target='Function:tests/cloud-gateway/scope-guard.test.mjs:run'
          "$graph" context "$target" > evidence/context.txt 2>&1 || true
          "$graph" impact "$target" --direction upstream > evidence/impact.txt 2>&1 || true
          cat evidence/context.txt evidence/impact.txt
          git checkout "$candidate" -- .github/workflows/cloud-gateway-lab.yml tests/cloud-gateway/scope-guard.test.mjs
          git add .github/workflows/cloud-gateway-lab.yml tests/cloud-gateway/scope-guard.test.mjs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 2
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          git diff --cached > evidence/candidate.patch
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              '.github/workflows/cloud-gateway-lab.yml',
              'tests/cloud-gateway/scope-guard.test.mjs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$candidate" > evidence/candidate-commit.txt
          echo NEVER_MERGE_HELPER_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue69-scope-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact two-file candidate and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          git diff --check "$SOURCE_SHA"...HEAD
          mapfile -t changed < <(git -c core.quotePath=false diff --name-only "$SOURCE_SHA"...HEAD | grep -v '^.github/workflows/continuation-issue69-scope-review.yml$')
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/cloud-gateway-lab.yml'
          test "${changed[1]}" = 'tests/cloud-gateway/scope-guard.test.mjs'
          mkdir -p evidence
          node --test --test-reporter=tap tests/cloud-gateway/scope-guard.test.mjs 2>&1 | tee evidence/scope-guard.tap
          node --test --test-reporter=tap tests/cloud-gateway/*.test.mjs 2>&1 | tee evidence/cloud-gateway.tap
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              '.github/workflows/cloud-gateway-lab.yml',
              'tests/cloud-gateway/scope-guard.test.mjs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue69-scope-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
