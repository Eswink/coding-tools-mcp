name: Worktrees Plan spec advance (never merge)

on:
  push:
    branches: ['ci/worktrees-plan-init-20260925']
    paths:
      - 'docs/specs/issue-70-isolated/**'
      - '.github/workflows/continuation-worktrees-plan-spec.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-70-isolated-steady-19007e247b
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-70-isolated-steady-19007e247b.json
  BASE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume, heartbeat spec, check spec, estimate, persist Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          if grep -R -n -E '\[填写\]|TODO|// \.\.\.' docs/specs/issue-70-isolated; then exit 1; fi
          for f in requirements.md design.md tasks.md; do test -s "docs/specs/issue-70-isolated/$f"; done
          python - <<'PY' > evidence/heartbeat-spec.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","write-spec"],
            "evidence":[{
              "kind":"requirements",
              "step_id":"write-spec",
              "summary":"Complete bounded requirements/design/tasks for Issue #70 worktree lifecycle with scope-lock, repository evidence, cross-platform tests and no snapshot/tool exposure expansion.",
              "reference":"docs/specs/issue-70-isolated/requirements.md;design.md;tasks.md",
              "revision":os.environ["GITHUB_SHA"]
            }],
            "last_verified_revision":os.environ["BASE_SHA"]
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-spec.json > evidence/heartbeat-spec-output.json 2>&1
          ./.mcp-probe-kit/bin/probe exec check_spec --json "{\"project_root\":\"$PWD\",\"feature_name\":\"issue-70-isolated\",\"docs_dir\":\"docs\"}" > evidence/check-spec.json 2>&1
          cat evidence/check-spec.json
          node -e "const r=require('./evidence/check-spec.json'); if(r.isError===true || r.structuredContent?.passed!==true) process.exit(1)"
          python - <<'PY' > evidence/heartbeat-check.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],"project_root":os.getcwd(),
            "completed_step_ids":["context","write-spec","check-spec"],
            "evidence":[{
              "kind":"spec","step_id":"check-spec",
              "summary":"mcp-probe check_spec passed the complete issue-70-isolated flat specification.",
              "reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "revision":os.environ["GITHUB_SHA"]
            }],
            "last_verified_revision":os.environ["BASE_SHA"]
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-check.json > evidence/heartbeat-check-output.json 2>&1
          ./.mcp-probe-kit/bin/probe exec estimate --json "{\"task_description\":\"Implement Issue #70 isolated worktree management from docs/specs/issue-70-isolated/tasks.md\",\"code_context\":\"Harness state root is separate from repository; first increment is internal WorktreeManager only; implementation and tests each stay below 500 lines.\"}" > evidence/estimate.json 2>&1
          cat evidence/estimate.json
          python - <<'PY' > evidence/heartbeat-estimate.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],"project_root":os.getcwd(),
            "completed_step_ids":["context","write-spec","check-spec","estimate"],
            "evidence":[{
              "kind":"spec","step_id":"estimate",
              "summary":"mcp-probe estimate completed after spec validation; production implementation remains blocked until this checkpoint is persisted.",
              "reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "revision":os.environ["GITHUB_SHA"]
            }],
            "last_verified_revision":os.environ["BASE_SHA"]
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-estimate.json > evidence/heartbeat-estimate-output.json 2>&1
          cat evidence/heartbeat-spec-output.json evidence/heartbeat-check-output.json evidence/heartbeat-estimate-output.json
          cp "$PLAN_PATH" evidence/plan-after.json
          node - <<'NODE'
          const p=require('./.mcp-probe-kit/plans/feature-issue-70-isolated-steady-19007e247b.json');
          for(const id of ['context','write-spec','check-spec','estimate']) if(!p.completedStepIds.includes(id)) process.exit(1);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint worktree specification"
          git fetch origin "ci/worktrees-plan-init-20260925"
          test "$(git rev-parse origin/ci/worktrees-plan-init-20260925)" = "$GITHUB_SHA"
          git push origin "HEAD:ci/worktrees-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-plan-spec
          path: evidence/
          retention-days: 14
          if-no-files-found: error
