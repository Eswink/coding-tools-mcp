name: Full RC standalone cloud binaries
on:
  push:
    branches: ['release/full-rc-candidate-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Owner-selected committed product RC version'
        type: string
        required: true
      integration_run:
        description: 'Successful exact-source seven-job integration run'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: full-rc-cloud-binaries-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: final-artifacts-${{ runner.os }}-source-only-v1
          cache-targets: false
          workspaces: services/cloud-gateway
      - name: Resolve exact reviewed candidate integration
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          INTEGRATION_RUN: ${{ inputs.integration_run }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/final_rc_evidence.py integration --version "$VERSION" --integration-run "$INTEGRATION_RUN" --github-output --output evidence/integration.json
      - name: Product authority and artifact regression
        run: |
          set -euo pipefail
          python scripts/cloud_release_bundle_tests.py
          python scripts/cloud_release_bundle.py versions --version "$VERSION" > evidence/versions.json
      - name: Build actual locked release binaries and audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev binutils
          cargo build --release --locked --manifest-path services/cloud-gateway/Cargo.toml --bins --example agent_fixture
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --json --file services/cloud-gateway/Cargo.lock > evidence/rust-audit-cloud-gateway.json
          python scripts/cloud_release_bundle.py build --version "$VERSION" --directory services/cloud-gateway/target/release --output "$RUNNER_TEMP/cloud-release"
          cp evidence/*.json "$RUNNER_TEMP/cloud-release/"
          mkdir -p "$RUNNER_TEMP/cloud-test-fixture"
          cp services/cloud-gateway/target/release/examples/agent_fixture "$RUNNER_TEMP/cloud-test-fixture/agent_fixture"
          python - <<'PY_FIXTURE'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'cloud-test-fixture','agent_fixture')
          report={'source_sha':os.environ['GITHUB_SHA'],'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'product_version':os.environ['VERSION'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size,'scope':'CI disposable enrollment fixture only, never customer bundle or production image'}
          p.with_name('fixture-receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          PY_FIXTURE
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-cloud-test-fixture
          path: ${{ runner.temp }}/cloud-test-fixture/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-cloud-built
          path: ${{ runner.temp }}/cloud-release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc-cloud-build-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  process:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rc-cloud-built
          path: ${{ runner.temp }}/cloud-release
      - uses: actions/download-artifact@v4
        with:
          name: rc-cloud-test-fixture
          path: ${{ runner.temp }}/cloud-test-fixture
      - name: Verify exact downloaded archive before extraction
        run: |
          set -euo pipefail
          python scripts/cloud_release_bundle.py unpack --version "$VERSION" --directory "$RUNNER_TEMP/cloud-release" --output "$RUNNER_TEMP/cloud-unpacked"
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl binutils
          python - <<'PY_FIXTURE'
          import hashlib,json,os,pathlib,shutil,subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'cloud-test-fixture','agent_fixture')
          report=json.loads(p.with_name('fixture-receipt.json').read_text())
          expected={'source_sha':os.environ['GITHUB_SHA'],'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'product_version':os.environ['VERSION'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size}
          assert p.is_file() and not p.is_symlink() and all(report.get(k)==v for k,v in expected.items())
          target=pathlib.Path(os.environ['RUNNER_TEMP'],'cloud-unpacked','bin','examples','agent_fixture')
          target.parent.mkdir(exist_ok=False);shutil.copyfile(p,target);target.chmod(0o755)
          PY_FIXTURE
      - name: Actual release process HTTP and authenticated WSS smoke
        run: |
          set -euo pipefail
          mkdir -p evidence
          binary="$RUNNER_TEMP/cloud-unpacked/bin"
          python services/cloud-gateway/tests/run_service_http.py --pg-bin /usr/lib/postgresql/16/bin --binary "$binary/coding-tools-gateway" | tee evidence/standalone_process_http.json
          python services/cloud-gateway/tests/run_agent_process.py --pg-bin /usr/lib/postgresql/16/bin --bin-dir "$binary" | tee evidence/agent_process_wss.json
          python scripts/cloud_release_bundle.py finish --version "$VERSION" --directory "$RUNNER_TEMP/cloud-unpacked" --evidence evidence --output "$RUNNER_TEMP/cloud-release/process-receipt.json"
          cp evidence/*.json "$RUNNER_TEMP/cloud-release/"
          cd "$RUNNER_TEMP/cloud-release"
          sha256sum ./*.json ./*.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-cloud-linux-amd64
          path: ${{ runner.temp }}/cloud-release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc-cloud-process-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  image:
    name: Non-root image build and protected-file fixture (no deployment)
    needs: [build, process]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rc-cloud-linux-amd64
          path: ${{ runner.temp }}/cloud-release
      - name: Verify accepted release bytes and image fixture contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/cloud_image_gate_tests.py
          python scripts/cloud_release_bundle.py unpack --version "$VERSION" --directory "$RUNNER_TEMP/cloud-release" --output "$RUNNER_TEMP/image-context"
          cp deploy/cloud-gateway/Dockerfile.runtime "$RUNNER_TEMP/image-context/Dockerfile"
      - name: Resolve immutable official base and build local non-root image
        run: |
          set -euo pipefail
          docker pull ubuntu:22.04
          base=$(docker image inspect ubuntu:22.04 --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$base" | grep -Eq '^ubuntu@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$base" > evidence/runtime-base.txt
          docker build --build-arg "BASE_IMAGE=$base" --build-arg "SOURCE_SHA=$GITHUB_SHA" --build-arg "PRODUCT_VERSION=$VERSION" --iidfile evidence/image-id.txt "$RUNNER_TEMP/image-context"
          image=$(cat evidence/image-id.txt)
          python scripts/cloud_image_gate.py --image "$image" --version "$VERSION" --context "$RUNNER_TEMP/image-context" --output evidence/image-fixture.json
          docker image inspect "$image" > evidence/image-inspect.json
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 65532:65532 --entrypoint /usr/bin/dpkg-query "$image" -W > evidence/runtime-packages.txt
          docker save "$image" -o "$RUNNER_TEMP/cloud-image.tar"
          (cd "$RUNNER_TEMP" && sha256sum cloud-image.tar) > evidence/image-archive.sha256
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-cloud-image-build
          path: |
            ${{ runner.temp }}/cloud-image.tar
            evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc-cloud-image-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
