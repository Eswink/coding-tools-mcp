name: ISSUE-010 admission full validation

on:
  push:
    branches:
      - design/shared-account-admission-policy
    paths:
      - 'src-tauri/src/auth/session_policy.rs'
      - 'src-tauri/src/auth/聊天授权v1.rs'
      - 'src-tauri/src/auth/聊天授权回归v1.rs'
      - 'src-tauri/src/commands/聊天授权v1.rs'
      - 'src/lib/remote-session-policy.ts'
      - 'src/lib/components/RemoteSessionSettings.svelte'
      - 'src/lib/components/聊天授权面板v1.svelte'
      - 'tests/**'
      - '.github/workflows/issue010-admission-full.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue010-admission-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GitNexus detect changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx -y gitnexus@latest analyze > evidence/analyze.txt
          git reset --hard "$GITHUB_SHA"
          npx -y gitnexus@latest detect-changes --scope compare --base-ref origin/plan/offline-safe-connector-lifecycle | tee evidence/detect-changes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue010-admission-change-impact
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          node --test tests/offline-safe-ui.test.mjs
          node --test tests/offline-safe-intent-ui.test.mjs
          node --test tests/issue010-admission-contract.test.mjs
      - name: Full Rust checks
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --locked --manifest-path src-tauri/Cargo.toml -- \
              --skip auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor
            cargo test --locked --manifest-path src-tauri/Cargo.toml \
              auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor \
              -- --exact --nocapture --test-threads=1
          else
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          fi
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings
