name: Issue 62 Ubuntu ephemeral range diagnostic (never merge)

on:
  push:
    branches: ['ci/issue62-ephemeral-range-20260924']
    paths:
      - '.github/workflows/continuation-issue62-ephemeral-range.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
          persist-credentials: false
      - name: Record kernel dynamic range and sampled port-zero allocations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat /proc/sys/net/ipv4/ip_local_port_range | tee evidence/ip-local-port-range.txt
          python - <<'PY' | tee evidence/port-zero-sample.txt
          import socket
          ports=[]
          for _ in range(512):
              s=socket.socket()
              s.bind(("127.0.0.1",0))
              ports.append(s.getsockname()[1])
              s.close()
          print("sample_count",len(ports))
          print("min",min(ports))
          print("max",max(ports))
          print("in_12000_19999",sum(12000 <= p <= 19999 for p in ports))
          print("first_64"," ".join(map(str,ports[:64])))
          PY
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-ephemeral-range
          path: evidence/
          retention-days: 14
          if-no-files-found: error
