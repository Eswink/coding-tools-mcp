name: Ubuntu桌面准备v1
on:
  push:
    branches: ['feat/Ubuntu桌面v1']
    paths: ['.github/workflows/Ubuntu桌面准备v1.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 精确版本规则工具离线归档
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Ubuntu工具v1" "$RUNNER_TEMP/Ubuntu准备证据v1"
          npm install --prefix "$RUNNER_TEMP/Ubuntu工具v1" --no-audit --no-fund mcp-probe-kit@4.0.1
          node -p "JSON.stringify(require(process.env.RUNNER_TEMP+'/Ubuntu工具v1/node_modules/mcp-probe-kit/package.json').bin)" > "$RUNNER_TEMP/Ubuntu准备证据v1/工具入口v1.json"
          tar -czf "$RUNNER_TEMP/Ubuntu准备证据v1/规则工具v1.tar.gz" -C "$RUNNER_TEMP/Ubuntu工具v1" node_modules
          sha256sum "$RUNNER_TEMP/Ubuntu准备证据v1/规则工具v1.tar.gz" > "$RUNNER_TEMP/Ubuntu准备证据v1/工具摘要v1.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ubuntu规则工具v1
          path: ${{ runner.temp }}/Ubuntu准备证据v1/
          if-no-files-found: error
          retention-days: 7
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 仅候选分支递增五文件六字段并归档
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/Ubuntu桌面v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/版本递增v7.py --from-version 0.2.4 --version 0.2.5 --apply
          python - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json'}
          assert actual == allowed or not actual, actual
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            git commit -m 'chore: Ubuntu桌面交付版本统一为0.2.5，不变更依赖'
            git push origin HEAD:refs/heads/feat/Ubuntu桌面v1
          fi
          mkdir -p "$RUNNER_TEMP/Ubuntu源码v1"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/Ubuntu源码v1/源码v1.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/Ubuntu源码v1/源码提交v1.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/Ubuntu源码v1/源码树v1.txt"
          sha256sum "$RUNNER_TEMP/Ubuntu源码v1/源码v1.zip" > "$RUNNER_TEMP/Ubuntu源码v1/源码摘要v1.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Ubuntu候选源码v1
          path: ${{ runner.temp }}/Ubuntu源码v1/
          if-no-files-found: error
          retention-days: 7
