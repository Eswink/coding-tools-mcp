name: Issue 62 architecture input schema probe (never merge)
on:
  push:
    branches: ['ci/issue62-architecture-schema-20260924']
    paths: ['.github/workflows/continuation-issue62-architecture-schema.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect architecture tool contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/probe-src" --no-audit --no-fund mcp-probe-kit@4.0.1 > evidence/install.txt 2>&1
          pkg="$RUNNER_TEMP/probe-src/node_modules/mcp-probe-kit/build/index.js"
          python - "$pkg" <<'PY' > evidence/architecture-schema.txt
          import pathlib, sys
          lines=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          hits=[i for i,l in enumerate(lines) if 'name: "architecture"' in l]
          for i in hits:
              for j in range(max(0,i-15),min(len(lines),i+130)):
                  print(f'{j+1}: {lines[j]}')
          PY
          cat evidence/architecture-schema.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-architecture-schema
          path: evidence/
          retention-days: 14
          if-no-files-found: error
