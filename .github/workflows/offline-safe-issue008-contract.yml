name: Offline-safe ISSUE-008 UX contract

on:
  push:
    branches:
      - ux/offline-safe-intent-controls
    paths:
      - 'tests/offline-safe-intent-ui.test.mjs'
      - 'src/lib/components/ServicePanel.svelte'
      - 'src/lib/components/workspace/ExecutionAvailabilityPanel.svelte'
      - 'src/lib/components/workspace/WorkspaceServiceView.svelte'
      - 'src/routes/workspace/**'
      - '.github/workflows/offline-safe-issue008-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-safe-issue008-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run lifecycle intent contract
        run: node --test tests/offline-safe-intent-ui.test.mjs
