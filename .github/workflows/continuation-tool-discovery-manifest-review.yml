name: Tool discovery manifest evidence review (never merge)

on:
  push:
    branches: ['ci/tool-discovery-manifest-review-20260925']
    paths:
      - 'tools/delivery/manifest.json'
      - '.github/workflows/continuation-tool-discovery-manifest-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 4a6360e624ce82cebb04423d531034c717721ff3

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify tool discovery receipt against exact published source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA"...HEAD)
          printf '%s
' "${changed[@]}" | tee evidence/changed-paths.txt
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/continuation-tool-discovery-manifest-review.yml'
          test "${changed[1]}" = 'tools/delivery/manifest.json'
          git diff --check "$SOURCE_SHA"...HEAD
          python -m unittest discover -s tests/delivery -v 2>&1 | tee evidence/delivery-tests.txt
          node --test tests/delivery/metadata_contract.test.mjs 2>&1 | tee evidence/metadata-tests.txt
          python tools/delivery/dispatch.py --manifest tools/delivery/manifest.json --repo-root . --output evidence/report.json
          python - <<'PY' | tee evidence/assertions.txt
          import hashlib, json, os
          source=os.environ['SOURCE_SHA']
          m=json.load(open('tools/delivery/manifest.json',encoding='utf-8'))
          root=next(t for t in m['tasks'] if t['id']=='tool-runtime')
          t=next(t for t in m['tasks'] if t['id']=='tool-discovery')
          assert root['state']=='verified'
          assert root['evidence']['revision']==source
          assert root['evidence']['run_id']==36144614243
          assert t['state']=='verified'
          assert t['issue']==72
          assert t['evidence']['revision']==source
          assert t['evidence']['run_id']==36144614243
          root_expected={
            "services/local-agent/Cargo.toml":"5f91a913256b8a7263e23d343ac8f762c8bf56a02586c94e7c4401a3d60a8b13",
            "services/local-agent/Cargo.lock":"eb408e883d4026568782eff1ccb6ca24771d31a7a9476b60e4bb6a3c28930348",
            "services/local-agent/src/executor.rs":"2ebb486fefd08e3cc9997a7aaa87dbb64c1dd80482c9faf097ec21d67c14f092",
            "services/local-agent/src/lib.rs":"134c917e692ee4dc4bb11ec0f5ffdd638f843fab7d062a0d51c4fd8bf7169a70",
            "services/local-agent/src/model.rs":"01aab422c7e778fc0b4a29e4f512155029ae5652fbbe90964d1c26ddb1385e03",
            "services/local-agent/src/registry.rs":"861c9df82b06bde1f067ce12e06309d10b98210eb6f48659d3896b7dc51486b4",
            "services/local-agent/src/registry_tests.rs":"8dd3903a5b9d0a328e6814e73ded7e66d46c29be82f4e3844fc7364e87c8ad7a",
          }
          expected={
            "services/local-agent/src/registry.rs":"861c9df82b06bde1f067ce12e06309d10b98210eb6f48659d3896b7dc51486b4",
            "services/local-agent/src/registry_tests.rs":"8dd3903a5b9d0a328e6814e73ded7e66d46c29be82f4e3844fc7364e87c8ad7a",
            "services/local-agent/src/lib.rs":"134c917e692ee4dc4bb11ec0f5ffdd638f843fab7d062a0d51c4fd8bf7169a70",
          }
          assert root['evidence']['files']==root_expected
          assert t['evidence']['files']==expected
          for label,items in [('root',root_expected),('tool-discovery',expected)]:
              for path,digest in items.items():
                  actual=hashlib.sha256(open(path,'rb').read()).hexdigest()
                  print(f'{label}-hash {path} actual={actual} expected={digest} match={actual==digest}')
                  assert actual==digest,(path,actual,digest)
          report=json.load(open('evidence/report.json',encoding='utf-8'))
          print('report-tool-discovery='+json.dumps(report.get('states',{}).get('tool-discovery'),sort_keys=True))
          print('release_allowed='+repr(report.get('release_allowed')))
          print('packets='+','.join(p.get('id','') for p in report.get('packets',[])))
          assert report['states']['tool-discovery']=='verified'
          assert report.get('release_allowed',False) is False
          PY
          python - <<'PY' | tee evidence/manifest-hash.txt
          import hashlib
          p='tools/delivery/manifest.json'
          print(hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse HEAD > evidence/helper-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-manifest-review
          path: evidence/
          retention-days: 14
          if-no-files-found: error
