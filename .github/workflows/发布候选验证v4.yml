name: 发布候选验证v4

on:
  push:
    branches: ['feat/固定公网入口v1']
    paths:
      - 'src-tauri/**'
      - '.github/workflows/发布候选验证v4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/发布候选验证v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-baseline:
    name: Rust完整基线 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 记录被检源码及运行身份
        run: |
          mkdir -p "$RUNNER_TEMP/基线证据v4"
          git rev-parse HEAD > "$RUNNER_TEMP/基线证据v4/源码版本.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/基线证据v4/事件版本.txt"
      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust 全目标类型检查
        id: check
        run: |
          set -o pipefail
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/基线证据v4/类型检查.txt"
      - name: Rust 全量回归
        id: tests
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/基线证据v4/回归测试.txt"
      - name: Rust 生产库零编译警告
        id: warnings
        run: |
          set -o pipefail
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee "$RUNNER_TEMP/基线证据v4/严格编译.txt"
      - name: 保存检查结果（不改变失败状态）
        if: always()
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          WARN_RESULT: ${{ steps.warnings.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / '基线证据v4'
          root.mkdir(parents=True, exist_ok=True)
          results = {name: os.environ.get(key, 'not-run') for name, key in [
              ('check', 'CHECK_RESULT'), ('tests', 'TEST_RESULT'), ('warnings', 'WARN_RESULT')]}
          report = {'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'event': os.environ['GITHUB_EVENT_NAME'], 'event_sha': os.environ['GITHUB_SHA'],
                    'runner_os': os.environ['RUNNER_OS'], 'results': results,
                    'passed': all(value == 'success' for value in results.values()),
                    'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.txt')}}
          (root / '基线结果v4.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rust基线证据v4-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/基线证据v4/
          retention-days: 7
          if-no-files-found: error
