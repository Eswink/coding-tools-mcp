name: Issue 62 port observer impact (never merge)

on:
  push:
    branches: ['ci/issue62-port-observer-impact-20260924']
    paths:
      - '.github/workflows/continuation-issue62-port-observer-impact.yml'

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4dc9f9d872c134d381cb1eba76999d34231d3ba6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect runtime port and Linux listener observation boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          for target in             'Function:src-tauri/src/runtime/port.rs:wait_for_port_free'             'Function:src-tauri/src/runtime/port.rs:wait_for_port_free_blocking'             'Function:src-tauri/src/runtime/port.rs:await_listener_shutdown'             'Function:src-tauri/src/platform/linux/net.rs:find_pid_listening_on_port'; do
            slug="$(printf '%s' "$target" | tr '/:.' '_')"
            "$graph" context "$target" > "evidence/context-$slug.txt" 2>&1 || true
            "$graph" impact "$target" --direction upstream > "evidence/impact-$slug.txt" 2>&1 || true
            echo "=== $target ==="
            cat "evidence/context-$slug.txt" "evidence/impact-$slug.txt"
          done
          {
            echo '=== wait/reclaim callsites ==='
            git grep -n -E 'wait_for_port_free\(|wait_for_port_free_blocking\(|await_listener_shutdown\(|await_listener_shutdown_blocking\(' -- 'src-tauri/src/**/*.rs' 'src-tauri/src/*.rs' || true
            echo '=== Linux listener detector ==='
            git grep -n -E 'find_pid_listening_on_port|/proc/net/tcp|pid_for_socket_inode' -- 'src-tauri/src/**/*.rs' 'src-tauri/src/*.rs' || true
          } | tee evidence/callsites.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-port-observer-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
