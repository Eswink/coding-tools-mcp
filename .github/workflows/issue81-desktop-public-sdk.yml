name: Issue81 public desktop development libraries
on:
  push:
    branches: ['ci/issue81-desktop-public-sdk']
    paths: ['.github/workflows/issue81-desktop-public-sdk.yml']
permissions:
  contents: read
jobs:
  public-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install distribution development packages only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: Collect public development metadata and linked libraries
        run: |
          set -euo pipefail
          mkdir -p public-sdk
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil,subprocess
          root=pathlib.Path('public-sdk').resolve()
          directories=['/usr/include','/usr/lib/x86_64-linux-gnu/pkgconfig','/usr/share/pkgconfig','/usr/lib/x86_64-linux-gnu/glib-2.0/include','/usr/lib/x86_64-linux-gnu/dbus-1.0/include']
          for name in directories:
              source=pathlib.Path(name)
              target=root/str(source).lstrip('/')
              shutil.copytree(source,target,symlinks=True,dirs_exist_ok=True)
          packages=['glib-2.0','gio-2.0','gobject-2.0','gtk+-3.0','gdk-3.0','cairo','pango','pangocairo','gdk-pixbuf-2.0','libsoup-3.0','javascriptcoregtk-4.1','webkit2gtk-4.1','ayatana-appindicator3-0.1','dbus-1','librsvg-2.0','openssl','x11']
          flags=subprocess.check_output(['pkg-config','--libs-only-l',*packages],text=True).split()
          names={flag[2:] for flag in flags if flag.startswith('-l')}|{'xdo'}
          libdir=pathlib.Path('/usr/lib/x86_64-linux-gnu')
          queue=[libdir/('lib'+name+'.so') for name in sorted(names)]
          seen=set();copied={}
          excluded=re.compile(r'^(?:ld-linux|libc[.-]|libpthread[.-]|libdl[.-]|librt[.-]|libm[.-]|libresolv[.-]|libnss_|libstdc\+\+|libgcc_s)')
          while queue:
              path=queue.pop()
              if not path.exists():raise RuntimeError('missing declared public library: '+path.name)
              real=path.resolve()
              # Some excluded libc paths are linker scripts, not ELF objects.
              if excluded.match(real.name) or real in seen:continue
              seen.add(real)
              output=subprocess.check_output(['ldd',str(real)],text=True,stderr=subprocess.STDOUT)
              for match in re.findall(r'=>\s+(/\S+)',output):
                  dep=pathlib.Path(match)
                  if not excluded.match(dep.name):queue.append(dep)
              target=root/'usr/lib/x86_64-linux-gnu'/real.name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(real,target)
              copied[real.name]=hashlib.sha256(target.read_bytes()).hexdigest()
              for link in libdir.glob('*.so*'):
                  if link.is_symlink() and link.resolve()==real:
                      dest=target.parent/link.name
                      if not dest.exists():dest.symlink_to(real.name)
          # Public distro headers only; no home, credentials, configuration or font files.
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.ttf','.otf','.woff','.woff2'}:raise RuntimeError('font files are not exported')
          links={str(p.relative_to(root)):str(p.readlink()) for p in root.rglob('*') if p.is_symlink()}
          # Convert distribution absolute header symlinks to relative contained links.
          for name,target in list(links.items()):
              if target.startswith('/'):
                  p=root/name;destination=root/target.lstrip('/')
                  if not destination.exists():p.unlink();links.pop(name);continue
                  import os
                  p.unlink();p.symlink_to(os.path.relpath(destination,p.parent));links[name]=str(p.readlink())
          proof={'packages':subprocess.check_output(['dpkg-query','-W'],text=True).splitlines(),'libraries':copied,'symlinks':links}
          (root/'PROVENANCE.json').write_text(json.dumps(proof,indent=2))
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          (root/'MANIFEST.sha256.json').write_text(json.dumps(manifest,indent=2))
          PY
          tar -cJf public-desktop-sdk.tar.xz public-sdk
          sha256sum public-desktop-sdk.tar.xz > public-desktop-sdk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue81-public-desktop-sdk
          path: |
            public-desktop-sdk.tar.xz
            public-desktop-sdk.sha256
          retention-days: 7
          if-no-files-found: error
