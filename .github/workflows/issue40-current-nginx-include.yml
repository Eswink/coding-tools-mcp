name: Issue40 current Nginx include review proof
on:
  push:
    branches: ['ci/issue40-current-nginx-include-*']
permissions:
  contents: read
concurrency:
  group: issue40-current-nginx-include-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '3'
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_NO_REPLACE_OBJECTS: '1'
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.hooksPath
  GIT_CONFIG_VALUE_0: /dev/null
  GIT_CONFIG_KEY_1: core.autocrlf
  GIT_CONFIG_VALUE_1: 'false'
jobs:
  native-config:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Acquire private distro Nginx and checksum-verified Compose 2.27.0
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/current-nginx-tools" "$RUNNER_TEMP/current-nginx-evidence"
          tools="$RUNNER_TEMP/current-nginx-tools"
          evidence="$RUNNER_TEMP/current-nginx-evidence"
          sudo apt-get update
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends libpcre3 libssl3 zlib1g libcrypt1
          mkdir "$tools/nginx-download"
          (cd "$tools/nginx-download" && apt-get download nginx-core)
          packages=("$tools"/nginx-download/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --extract "${packages[0]}" "$tools/nginx"
          dpkg-deb --field "${packages[0]}" Package Version Architecture > "$evidence/nginx-package.txt"
          "$tools/nginx/usr/sbin/nginx" -v 2> "$evidence/nginx-version.txt"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 --output "$tools/compose"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64.sha256 --output "$evidence/compose-release.sha256"
          test "$(sha256sum "$tools/compose" | awk '{print $1}')" = "$(awk '{print $1}' "$evidence/compose-release.sha256")"
          chmod 700 "$tools/compose"
          test "$("$tools/compose" version --short)" = '2.27.0'
          "$tools/compose" version > "$evidence/compose-version.txt"
          sha256sum "$tools/compose" "$tools/nginx/usr/sbin/nginx" "${packages[0]}" > "$evidence/tool-sha256.txt"
      - name: Baseline and current pure contracts, historical and current native checks
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/current-nginx-tools"
          evidence="$RUNNER_TEMP/current-nginx-evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m unittest discover -s tests/cloud-gateway-deployment -p 'test_*.py' -v 2>&1 | tee "$evidence/deployment-tests.txt"
          python tests/cloud-gateway-deployment/run_native_config_checks.py --compose "$tools/compose" --nginx "$tools/nginx/usr/sbin/nginx" > "$evidence/historical-native.json"
          python tests/cloud-gateway-deployment/run_current_nginx_checks.py --compose "$tools/compose" --nginx "$tools/nginx/usr/sbin/nginx" --output "$evidence/current-native.json"
          python deploy/cloud-gateway/current_nginx_include.py --domain gateway.example.invalid --connector-id 00000000-0000-0000-0000-000000000001 --port 28880 --output "$RUNNER_TEMP/current-nginx-review"
          mkdir "$evidence/rendered-review"
          cp "$RUNNER_TEMP/current-nginx-review/"{nginx-locations.current.review.conf,source-contract.json,REVIEW_ONLY.txt} "$evidence/rendered-review/"
      - name: Bind safe evidence to exact clean source and Actions attempt
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert not git('status','--porcelain','--untracked-files=all')
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'current-nginx-evidence');p.mkdir(exist_ok=True)
          files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and not f.is_symlink()}
          value={'source_sha':git('rev-parse','HEAD'),'source_tree':git('rev-parse','HEAD^{tree}'),'source_clean':True,'evidence_sha256':files,'ci':{k:os.environ[k] for k in ('GITHUB_REPOSITORY','GITHUB_WORKFLOW_REF','GITHUB_JOB','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')},'production_ready':False}
          (p/'source-binding.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue40-current-nginx-native-config
          path: ${{ runner.temp }}/current-nginx-evidence/
          if-no-files-found: error
          retention-days: 30
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Portable current-service contracts and fresh exact audited four-binary build
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/current-nginx-evidence" "$RUNNER_TEMP/current-nginx-tools"
          evidence="$RUNNER_TEMP/current-nginx-evidence"
          sudo apt-get update
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends pkg-config libssl-dev curl ca-certificates libpcre3 libssl3 zlib1g libcrypt1
          test -f services/cloud-gateway/tests/run_enrollment_process.py
          python -m unittest discover -s tests/cloud-gateway-deployment -p 'test_*.py' -v 2>&1 | tee "$evidence/deployment-tests.txt"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/current-nginx-portable-target"
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib \
            --test pure_contracts --test service_contracts --test enrollment_contracts --test channel_contracts \
            --test mcp_service_contracts --test projection_contracts --test agent_wire_parity 2>&1 | tee "$evidence/portable-contracts.txt"
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/audit-tools"
          python scripts/exact_build_audit_tests.py
          export CARGO_TARGET_DIR="$RUNNER_TEMP/current-nginx-audited-target"
          test ! -e "$CARGO_TARGET_DIR"
          VERSION=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          python scripts/exact_build_audit.py collect \
            --root "$GITHUB_WORKSPACE" --expected-sha "$GITHUB_SHA" --version "$VERSION" \
            --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/exact-cloud-audit" \
            --audit-bin "$RUNNER_TEMP/audit-tools/bin/cargo-audit" \
            --audit-db "$RUNNER_TEMP/advisory-db" --clone-advisory-db
      - name: Acquire private distro Nginx, exact Compose and immutable official image references
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/current-nginx-tools"
          evidence="$RUNNER_TEMP/current-nginx-evidence"
          mkdir "$tools/nginx-download"
          (cd "$tools/nginx-download" && apt-get download nginx-core)
          packages=("$tools"/nginx-download/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --extract "${packages[0]}" "$tools/nginx"
          dpkg-deb --field "${packages[0]}" Package Version Architecture > "$evidence/nginx-package.txt"
          "$tools/nginx/usr/sbin/nginx" -v 2> "$evidence/nginx-version.txt"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 --output "$tools/compose"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64.sha256 --output "$evidence/compose-release.sha256"
          test "$(sha256sum "$tools/compose" | awk '{print $1}')" = "$(awk '{print $1}' "$evidence/compose-release.sha256")"
          chmod 700 "$tools/compose"
          test "$("$tools/compose" version --short)" = '2.27.0'
          "$tools/compose" version > "$evidence/compose-version.txt"
          sha256sum "$tools/compose" "$tools/nginx/usr/sbin/nginx" "${packages[0]}" > "$evidence/tool-sha256.txt"
          docker pull --platform linux/amd64 ubuntu:22.04
          docker pull --platform linux/amd64 postgres:16-bookworm
          docker pull --platform linux/amd64 nginx:stable-alpine
          base=$(docker image inspect ubuntu:22.04 --format '{{index .RepoDigests 0}}')
          postgres=$(docker image inspect postgres:16-bookworm --format '{{index .RepoDigests 0}}')
          ingress=$(docker image inspect nginx:stable-alpine --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$base" | grep -Eq '^ubuntu@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$postgres" | grep -Eq '^postgres@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$ingress" | grep -Eq '^nginx@sha256:[0-9a-f]{64}$'
          printf 'BASE_IMAGE=%s\nPOSTGRES_IMAGE=%s\nINGRESS_IMAGE=%s\n' "$base" "$postgres" "$ingress" >> "$GITHUB_ENV"
          printf '%s\n%s\n%s\n' "$base" "$postgres" "$ingress" > "$evidence/runtime-image-digests.txt"
      - name: Build exact-source nonroot engineering image without restored targets
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/current-nginx-image-context"
          mkdir -m 700 "$context"; mkdir "$context/bin"
          for name in coding-tools-gateway coding-tools-agent coding-tools-control-gateway coding-tools-mcp-gateway; do
            cp "$RUNNER_TEMP/current-nginx-audited-target/x86_64-unknown-linux-gnu/release/$name" "$context/bin/$name"
          done
          cp deploy/cloud-gateway/Dockerfile.runtime "$context/Dockerfile"
          cp docs/deployment/current-nginx-include.md "$context/README.md"
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tomllib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'current-nginx-image-context')
          version=tomllib.loads(pathlib.Path('services/cloud-gateway/Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'[0-9A-Za-z.+-]+',version)
          value={'source_sha':os.environ['GITHUB_SHA'],'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'component_version':version,'engineering_only':True,'binaries':{b.name:hashlib.sha256(b.read_bytes()).hexdigest() for b in (p/'bin').iterdir()}}
          audit=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'exact-cloud-audit','summary.json').read_text())
          assert audit['sha']==value['source_sha'] and audit['tree']==value['source_tree']
          assert audit['exact_build_audit']=='passed' and audit['binary_sha256']==value['binaries']
          value['exact_build_audit_envelope_sha256']=audit['envelope_sha256']
          (p/'manifest.json').write_text(json.dumps(value,indent=2)+'\n')
          pathlib.Path(os.environ['RUNNER_TEMP'],'current-nginx-evidence','source-binaries.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
          version=$(python -c "import tomllib; print(tomllib.load(open('services/cloud-gateway/Cargo.toml','rb'))['package']['version'])")
          docker build --no-cache --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "SOURCE_SHA=$GITHUB_SHA" --build-arg "PRODUCT_VERSION=$version" --iidfile "$RUNNER_TEMP/current-nginx-evidence/gateway-image-id.txt" "$context"
          printf 'GATEWAY_IMAGE=%s\n' "$(cat "$RUNNER_TEMP/current-nginx-evidence/gateway-image-id.txt")" >> "$GITHUB_ENV"
      - name: Actual current include to Gateway and PostgreSQL in a private owned fixture
        run: |
          set -euo pipefail
          python tests/cloud-gateway-deployment/run_current_nginx_runtime.py \
            --compose "$RUNNER_TEMP/current-nginx-tools/compose" --gateway-image "$GATEWAY_IMAGE" \
            --ingress-image "$INGRESS_IMAGE" --postgres-image "$POSTGRES_IMAGE" \
            --output "$RUNNER_TEMP/current-nginx-evidence/current-runtime.json"
      - name: Outer private Nginx to repaired published ingress in a separate fresh fixture
        run: |
          set -euo pipefail
          python tests/cloud-gateway-deployment/run_current_nginx_runtime.py \
            --compose "$RUNNER_TEMP/current-nginx-tools/compose" --gateway-image "$GATEWAY_IMAGE" \
            --ingress-image "$INGRESS_IMAGE" --postgres-image "$POSTGRES_IMAGE" \
            --two-hop --nginx "$RUNNER_TEMP/current-nginx-tools/nginx/usr/sbin/nginx" \
            --output "$RUNNER_TEMP/current-nginx-evidence/current-two-hop-runtime.json"
      - name: Bind safe evidence to exact clean source and Actions attempt
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert not git('status','--porcelain','--untracked-files=all')
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'current-nginx-evidence');p.mkdir(exist_ok=True)
          files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and not f.is_symlink()}
          value={'source_sha':git('rev-parse','HEAD'),'source_tree':git('rev-parse','HEAD^{tree}'),'source_clean':True,'evidence_sha256':files,'ci':{k:os.environ[k] for k in ('GITHUB_REPOSITORY','GITHUB_WORKFLOW_REF','GITHUB_JOB','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')},'production_ready':False}
          (p/'source-binding.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue40-current-nginx-runtime
          path: |
            ${{ runner.temp }}/current-nginx-evidence/
            ${{ runner.temp }}/exact-cloud-audit/
          if-no-files-found: error
          retention-days: 30
