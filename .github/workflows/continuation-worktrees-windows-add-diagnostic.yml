name: Worktrees Windows add diagnostic (never merge)

on:
  push:
    branches: ['ci/worktrees-windows-add-diagnostic-20260925']
    paths:
      - '.github/workflows/continuation-worktrees-windows-add-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Reproduce exact temp-repo worktree add and classify stderr
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'ctm-worktree-diag'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          $repo = Join-Path $root 'repo'
          $harness = Join-Path $root 'harness'
          $managed = Join-Path $harness 'worktrees-v1\0123456789abcdef0123456789abcdef'
          New-Item -ItemType Directory -Force $repo,$managed | Out-Null
          git -C $repo init -q
          git -C $repo config user.email tests@example.invalid
          git -C $repo config user.name 'Worktree Tests'
          Set-Content -Path (Join-Path $repo 'README.md') -Value 'baseline'
          git -C $repo add README.md
          git -C $repo commit -q -m initial
          $target = Join-Path $managed '0123456789abcdef0123456789abcdef'
          $stdout = Join-Path $root 'stdout.txt'
          $stderr = Join-Path $root 'stderr.txt'
          $proc = Start-Process -FilePath git -ArgumentList @('-C',$repo,'worktree','add','--detach',$target,'HEAD') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "exit=$($proc.ExitCode)" | Tee-Object -FilePath evidence/result.txt
          $raw = Get-Content -Raw -ErrorAction SilentlyContinue $stderr
          if ($null -eq $raw) { $raw = '' }
          $redacted = $raw.Replace($root,'<temp>').Replace($repo,'<repo>').Replace($harness,'<harness>').Replace($target,'<target>')
          $redacted | Set-Content evidence/stderr-redacted.txt
          $redacted
          git -C $repo worktree list --porcelain | Set-Content evidence/list.txt
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-windows-add-diagnostic
          path: evidence/
          retention-days: 14
          if-no-files-found: error
