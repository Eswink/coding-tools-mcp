name: Issue 62 port observer architecture reassess (never merge)
on:
  push:
    branches: ['ci/issue62-port-observer-architecture-20260924']
    paths:
      - '.github/workflows/continuation-issue62-port-observer-architecture.yml'
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4dc9f9d872c134d381cb1eba76999d34231d3ba6
          persist-credentials: false
          fetch-depth: 0
      - name: Reassess lifecycle architecture with ownerless LISTEN evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/request.json
          import json, os
          payload={
            "mode":"design",
            "project_root":os.getcwd(),
            "description":"Reassess Issue #62 after new source evidence: Linux platform::find_pid_listening_on_port returns None when /proc/net/tcp still has LISTEN but the inode no longer maps to any /proc/<pid>/fd. runtime::port::wait_for_port_free and wait_for_port_free_blocking treat None as free, so the existing production restart-safe wait can return early during the measured 15-36 ms ownerless LISTEN tail. Select the smallest fix without touching CRITICAL mcp::listener::serve/bind_listener.",
            "scope":[
              "src-tauri/src/platform/linux/net.rs",
              "src-tauri/src/platform/linux/mod.rs",
              "src-tauri/src/platform/mod.rs",
              "src-tauri/src/runtime/port.rs",
              "src-tauri/src/runtime/supervisor.rs",
              "src-tauri/src/tools/任务恢复传输v2.rs"
            ],
            "constraints":[
              "Do not edit CRITICAL/exact mcp::listener::serve or bind_listener.",
              "Do not add fixed sleeps, bind retries, SO_REUSEPORT, auth/origin changes, or Windows semantic widening.",
              "Preserve immediate foreign-port conflict behavior: a listener owned by another PID must fail promptly, not wait for timeout.",
              "Ownerless Linux LISTEN state must be treated as transiently occupied until it disappears or the existing bounded shutdown timeout expires.",
              "Windows/macOS behavior should remain byte/semantic compatible unless an implementation abstraction requires a no-op/default path.",
              "Current GitNexus: wait_for_port_free LOW/exact impacted=1; wait_for_port_free_blocking LOW/exact impacted=9; Linux find_pid_listening_on_port LOW/lower-bound impacted=1 with dropped receiver callsites."
            ],
            "current_facts":[
              {
                "statement":"Exact loopback LISTEN can persist 15-36 ms after graceful server JoinHandle completion on Ubuntu with no owning fd resolvable from /proc/<pid>/fd.",
                "classification":"fact",
                "evidence":["#62 comment 5807317900","close-lag run 35951904056","owner diagnostics"]
              },
              {
                "statement":"Linux find_pid_listening_on_port scans /proc/net/tcp, but returns None when the listener inode cannot be mapped to a PID. wait_for_port_free interprets Ok(None) as free.",
                "classification":"fact",
                "evidence":["src-tauri/src/platform/linux/net.rs","src-tauri/src/runtime/port.rs","impact run 36003461930"]
              },
              {
                "statement":"Production RuntimeSupervisor::sync_stop_and_wait already uses await_listener_shutdown_blocking before restart, so the restart-safe boundary already belongs to runtime/port; its Linux observation is incomplete.",
                "classification":"fact",
                "evidence":["src-tauri/src/runtime/supervisor.rs:533-546","lifecycle caller run 35981142285"]
              },
              {
                "statement":"The earlier test-only idea to call await_listener_shutdown is insufficient because the same PID-based false-free condition exists inside that helper.",
                "classification":"false_root_cause",
                "evidence":["source review of platform/linux/net.rs and runtime/port.rs","never-merge test-lifecycle candidate"]
              }
            ],
            "alternatives":[
              {
                "id":"linux-listen-presence-plus-runtime-state",
                "summary":"Factor a Linux-only exact LISTEN-presence observer from /proc/net/tcp and let runtime/port classify ownerless LISTEN as transient occupied while preserving own/foreign PID behavior. Both async and blocking wait loops use the same classification.",
                "pros":["Repairs the existing production restart-safe boundary","Avoids CRITICAL listener code","No bind retry","No Windows change","Reuses current bounded timeout semantics"],
                "cons":["Adds Linux-specific kernel-state observation to platform/runtime boundary","Must avoid changing other callers that only need owner PID"]
              },
              {
                "id":"platform-trait-listening-state",
                "summary":"Extend the cross-platform Platform trait with an explicit listener-presence or listener-owner enum and migrate runtime callers.",
                "pros":["Stronger abstraction","Can distinguish free/owned/ownerless across platforms"],
                "cons":["Broader API migration","More callsites and Windows/macOS surface than required for #62"]
              },
              {
                "id":"listener-local-release-observer",
                "summary":"Keep the previously designed release observer inside mcp/listener.rs and expose a restart-safe lifecycle handle.",
                "pros":["Encapsulates MCP lifecycle"],
                "cons":["Touches CRITICAL listener symbols and duplicates an existing runtime/port restart-safe boundary"]
              }
            ],
            "decision":{
              "recommended":"linux-listen-presence-plus-runtime-state",
              "rationale":"New evidence shows the defect is in Linux port observation used by the existing runtime restart-safe boundary, not absence of such a boundary. Prefer repairing that lower-risk boundary.",
              "rejectedAlternatives":[
                {"id":"platform-trait-listening-state","reason":"Broader cross-platform migration than required unless architecture tool finds a hidden contract need."},
                {"id":"listener-local-release-observer","reason":"Duplicates existing runtime/port lifecycle semantics and re-enters CRITICAL listener code unnecessarily."}
              ]
            },
            "protected_invariants":[
              "Loopback-only listener behavior unchanged",
              "Immediate same-port restart after production shutdown boundary",
              "Foreign occupied port remains an immediate explicit conflict",
              "No Windows behavior change",
              "No fixed delay or bind retry",
              "Auth/origin/tool protocols unchanged"
            ],
            "runtime_evidence":[
              "close-lag run 35951904056",
              "caller review run 35981142285",
              "release-observer primitive run 35980510044",
              "port observer impact run 36003461930"
            ],
            "collect_evidence":False,
            "save_to_docs":False
          }
          print(json.dumps(payload,ensure_ascii=False,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec architecture --stdin < evidence/request.json > evidence/architecture.json 2>&1
          cat evidence/architecture.json
          node - <<'NODE'
          const r=require('./evidence/architecture.json');
          if(r.isError===true) process.exit(1);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-port-observer-architecture
          path: evidence/
          retention-days: 14
          if-no-files-found: error
