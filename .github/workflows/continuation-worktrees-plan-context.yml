name: Worktrees Plan context checkpoint (never merge)

on:
  push:
    branches: ['ci/worktrees-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-worktrees-plan-context.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-70-isolated-steady-19007e247b
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-70-isolated-steady-19007e247b.json
  BASE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume Plan and checkpoint existing context evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -f "$PLAN_PATH"
          test -f AGENTS.md
          test -f docs/graph-insights/latest.md
          test -f docs/graph-insights/latest.json
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          python - <<'PY' > evidence/heartbeat.json
          import json, os
          print(json.dumps({
            "plan_id": os.environ["PLAN_ID"],
            "project_root": os.getcwd(),
            "completed_step_ids": ["context"],
            "evidence": [{
              "kind": "requirements",
              "step_id": "context",
              "summary": "Existing project context is current and available; AGENTS plus both graph-insights latest files were verified before worktree specification.",
              "reference": "AGENTS.md sha 882ac55555ce2c810e225f69117da584492bc3ae; docs/graph-insights/latest.md sha 89ddb0ec3748c23e3f7188ebc663924babd20783; docs/graph-insights/latest.json sha 1e1dbf56521f81a6fc00817a79725633c5d72c6e",
              "revision": os.environ["BASE_SHA"]
            }],
            "last_verified_revision": os.environ["BASE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          node - <<'NODE'
          const p=require('./.mcp-probe-kit/plans/feature-issue-70-isolated-steady-19007e247b.json');
          if(!p.completedStepIds.includes('context')) process.exit(1);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint worktree context"
          git fetch origin "ci/worktrees-plan-init-20260925"
          test "$(git rev-parse origin/ci/worktrees-plan-init-20260925)" = "$GITHUB_SHA"
          git push origin "HEAD:ci/worktrees-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-plan-context
          path: evidence/
          retention-days: 14
          if-no-files-found: error
