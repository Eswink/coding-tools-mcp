name: Ubuntu sandbox spec and estimate (never merge)

on:
  push:
    branches: ['ci/ubuntu-sandbox-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-ubuntu-sandbox-spec.yml'
      - 'docs/specs/issue-73-ubuntu/**'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-73-ubuntu-steady-1c1e22e5cd
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-73-ubuntu-steady-1c1e22e5cd.json
  SOURCE_SHA: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install mcp-probe and resume Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node -e "const r=require('./evidence/resume-before.json'); if(r.isError===true||r.structuredContent?.nextStepId!=='context') process.exit(1)"
      - name: Context and spec heartbeat
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec init_project_context --json "{\"project_root\":\"$PWD\",\"docs_dir\":\"docs\"}" > evidence/context.json 2>&1
          python - <<'PY' > evidence/hb-spec.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","write-spec"],
            "evidence":[
              {"kind":"other","step_id":"context","summary":"Project context is available for the Ubuntu sandbox feature.","reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}","revision":os.environ["SOURCE_SHA"]},
              {"kind":"requirements","step_id":"write-spec","summary":"Issue #73 requirements/design/tasks lock a Linux-only Landlock write sandbox plus capability-gated seccomp network deny; Windows and unrelated features are out of scope.","reference":"docs/specs/issue-73-ubuntu/requirements.md + design.md + tasks.md","revision":os.environ["SOURCE_SHA"]}
            ],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/hb-spec.json > evidence/hb-spec-out.json 2>&1
          cat evidence/hb-spec-out.json
      - name: Check spec and estimate
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec check_spec --json "{\"project_root\":\"$PWD\",\"feature_name\":\"issue-73-ubuntu\",\"docs_dir\":\"docs\"}" > evidence/check-spec.json 2>&1
          cat evidence/check-spec.json
          node -e "const r=require('./evidence/check-spec.json'); if(r.isError===true||r.structuredContent?.passed!==true) process.exit(1)"
          python - <<'PY' > evidence/estimate-request.json
          import json, os
          print(json.dumps({
            "task_description":"Implement issue-73 Ubuntu sandbox from docs/specs/issue-73-ubuntu/tasks.md: parent-prepared Landlock workspace-write confinement plus default seccomp network deny, VerifiedInvocation-gated network allow, process and PTY wiring, fail-closed primitive errors, Ubuntu/Windows regression.",
            "code_context":"Use docs/specs/issue-73-ubuntu/design.md and tasks.md plus primitive/impact run 36160607897.",
            "project_root":os.getcwd()
          }))
          PY
          ./.mcp-probe-kit/bin/probe exec estimate --stdin < evidence/estimate-request.json > evidence/estimate.json 2>&1
          cat evidence/estimate.json
          python - <<'PY' > evidence/hb-check.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","write-spec","check-spec","estimate"],
            "evidence":[
              {"kind":"spec","step_id":"check-spec","summary":"check_spec passed for the concrete Ubuntu sandbox spec.","reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']} evidence/check-spec.json","revision":os.environ["SOURCE_SHA"]},
              {"kind":"other","step_id":"estimate","summary":"estimate executed after spec validation; implementation remains blocked on per-symbol fresh GitNexus impact.","reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']} evidence/estimate.json","revision":os.environ["SOURCE_SHA"]},
              {"kind":"review","step_id":"estimate","summary":"Primitive feasibility run 36160607897 observed Ubuntu kernel 6.17, Landlock ABI 7 and seccomp ERRNO support; process_tree::spawn impact LOW/lower-bound and PTY spawn lower-bound, so missing graph edges are not treated as safety proof.","reference":"GitHub Actions run 36160607897","revision":os.environ["SOURCE_SHA"]}
            ],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/hb-check.json > evidence/hb-check-out.json 2>&1
          cat evidence/hb-check-out.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          node -e "const r=require('./evidence/resume-after.json'); if(r.isError===true||r.structuredContent?.nextStepId!=='implement') process.exit(1)"
      - name: Persist Plan checkpoint only
        shell: bash
        run: |
          set -euo pipefail
          git restore -- AGENTS.md CLAUDE.md docs/graph-insights/latest.md docs/graph-insights/latest.json docs/project-context.md docs/project-context 2>/dev/null || true
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint Ubuntu sandbox spec"
          git fetch origin "ci/ubuntu-sandbox-plan-init-20260925"
          test "$(git rev-parse "origin/ci/ubuntu-sandbox-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/ubuntu-sandbox-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ubuntu-sandbox-spec
          path: evidence/
          retention-days: 14
          if-no-files-found: error
