name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已存在的源码标签，例如 v0.2.2；必须与六处项目版本一致'
        required: true
        type: string
      publish:
        description: '明确批准公开发布；未勾选仅保存 Actions 安装包'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-v4-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解析现有标签为不可变源码版本
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python scripts/发布版本校验v4.py --resolve-only --tag "$RELEASE_TAG" --github-output

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验六处版本、标签及干净源码
        run: python scripts/发布版本校验v4.py --tag "$RELEASE_TAG" --expect-sha "$SOURCE_SHA"
      - name: 发布来源负例回归
        run: python scripts/发布版本回归v4.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 检查前端
        run: npm run check
      - name: Rust 全目标检查、全量回归与严格编译
        run: |
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: 构建 Windows NSIS 安装程序
        run: npm run tauri -- build --bundles nsis
      - name: 校验产物版本并记录来源摘要
        run: |
          mkdir -p "$RUNNER_TEMP/发布产物v4"
          cp src-tauri/target/release/bundle/nsis/*.exe "$RUNNER_TEMP/发布产物v4/"
          python scripts/发布版本校验v4.py --tag "$RELEASE_TAG" --expect-sha "$SOURCE_SHA" --artifacts "$RUNNER_TEMP/发布产物v4" --suffix .exe --output "$RUNNER_TEMP/发布产物v4/发布来源Windowsv4.json"
      - name: 上传安装包及来源记录
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-v4
          path: ${{ runner.temp }}/发布产物v4/
          if-no-files-found: error

  # macOS is deliberately absent: it requires a separate explicit manual dispatch.
  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe-v4
          path: dist/windows
      - name: 创建 Release 并上传已验证的安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          name: Coding Tools MCP ${{ needs.prepare.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.exe
            dist/windows/发布来源Windowsv4.json
