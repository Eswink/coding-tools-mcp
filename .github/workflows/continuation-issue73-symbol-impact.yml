name: Issue 73 exact symbol impact (never merge)

on:
  push:
    branches: ['ci/issue73-symbol-impact-20260926']
    paths:
      - '.github/workflows/continuation-issue73-symbol-impact.yml'

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build pinned graph and inspect planned sandbox symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          targets=(
            'Struct:services/local-agent/src/process.rs:ExecSpec'
            'Function:services/local-agent/src/process.rs:ProcessManager.start#1'
            'Struct:services/local-agent/src/pty.rs:PtySpec'
            'Function:services/local-agent/src/pty.rs:PtyManager.start#1'
            'Struct:services/local-agent/src/registry.rs:VerifiedInvocation'
            'Function:services/local-agent/src/process_tree.rs:spawn'
            'Function:services/local-agent/src/pty_unix.rs:spawn'
          )
          : > evidence/impact.txt
          for target in "${targets[@]}"; do
            echo "=== $target ===" | tee -a evidence/impact.txt
            "$graph" context "$target" 2>&1 | tee -a evidence/impact.txt || true
            "$graph" impact "$target" --direction upstream 2>&1 | tee -a evidence/impact.txt || true
          done
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue73-symbol-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
