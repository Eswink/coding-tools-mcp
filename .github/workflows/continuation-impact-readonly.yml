name: Continuation assignment rebase review (never merge helper)
on:
  push:
    branches: ['ci/continuation-impact-20260923']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ff1907fc3bd3309f71d677193b2f0bf7073f8254
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve concurrent manifest work and reconstruct only reviewed assignment files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          changes={'.github/workflows/cloud-delivery.yml':'9d073b7b2dbc17d41847d06ad298aef2c30d902a',
                   'tests/delivery/metadata_contract.test.mjs':'2db50de6c790fe42e454f6c0eab5e65316f384a1'}
          before=Path('tools/delivery/manifest.json').read_bytes()
          for name,sha in changes.items():
              req=urllib.request.Request('https://api.github.com/repos/Eswink/coding-tools-mcp/git/blobs/'+sha,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  blob=json.load(response)
              assert blob['sha']==sha and blob['encoding']=='base64' and blob['size']<20000
              data=base64.b64decode(blob['content'])
              assert subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip()==sha
              Path(name).write_bytes(data)
          subprocess.run(['git','add','--',*changes],check=True)
          assert Path('tools/delivery/manifest.json').read_bytes()==before
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='7c0d9e1a3c203aa65e3cd6244b873f762207028a'
          Path('evidence/proposed-tree.txt').write_text(tree)
          paths=list(changes)+['tools/delivery/manifest.json','tools/delivery/dispatch.py','tests/delivery/test_dispatch.py']
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          Path('evidence/source-hashes.json').write_text(json.dumps(hashes,indent=2))
          print(json.dumps(hashes,indent=2))
          PY
      - name: Actual rebased impact and all dispatch contracts, without issue writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md .claude/skills/gitnexus
          "$graph" detect-changes --scope staged > evidence/impact.json
          cat evidence/impact.json
          node --test tests/delivery/metadata_contract.test.mjs | tee evidence/metadata.tap
          python -m unittest discover -s tests/delivery -v 2>&1 | tee evidence/scheduler.txt
          python tools/delivery/dispatch.py --manifest tools/delivery/manifest.json --repo-root . --output evidence/dispatch.json
          python - <<'PY'
          import json
          from collections import Counter
          p=json.load(open('evidence/dispatch.json'))
          assert p['release_allowed'] is False and p['release_eligible_for_review'] is False
          assert [x['id'] for x in p['packets']]==['native-pty']
          assert all(not x['execution_started'] for x in p['packets'])
          assert {k for k,v in p['states'].items() if v=='stale_evidence'}=={'issue-dispatch'}
          assert p['states']['local-trace']=='verified' and p['states']['origin-migration']=='verified'
          print(json.dumps({'counts':dict(Counter(p['states'].values())),'packets':p['packets'],'release_blockers':p['release_blockers']},indent=2))
          PY
          test "$(git write-tree)" = 7c0d9e1a3c203aa65e3cd6244b873f762207028a
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: continuation-assignment-rebase-review
          path: evidence/
          retention-days: 14
          if-no-files-found: error
