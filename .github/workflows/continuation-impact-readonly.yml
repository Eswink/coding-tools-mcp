name: Continuation impact read-only helper
on:
  push:
    branches: ['ci/continuation-impact-20260923']
permissions:
  contents: read
jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ee93427eb3da95b64fb4ca1d91601850429cb6dd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect existing metadata-test callers before changing assignment contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md
          "$graph" context 'Function:tests/delivery/metadata_contract.test.mjs:run' > evidence/metadata-context.txt 2>&1
          "$graph" impact 'Function:tests/delivery/metadata_contract.test.mjs:run' --direction upstream > evidence/metadata-impact.txt 2>&1
          cat evidence/metadata-context.txt evidence/metadata-impact.txt
          node --test tests/delivery/metadata_contract.test.mjs | tee evidence/metadata-tests.txt
          python -m unittest discover -s tests/delivery -v 2>&1 | tee evidence/scheduler-tests.txt
          python tools/delivery/dispatch.py --manifest tools/delivery/manifest.json --repo-root . --output evidence/dispatch.json
          cat evidence/dispatch.json
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
          echo 'READ_ONLY_HELPER_NEVER_MERGE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: continuation-metadata-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
