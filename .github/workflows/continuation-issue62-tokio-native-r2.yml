name: Isolated issue 62 Tokio native semantics r2 (never merge)

on:
  push:
    branches: ['ci/issue62-tokio-native-r2-20260923']

permissions:
  contents: read

env:
  BASE_SHA: 998abf5ff85aa13fad54797fb3a7ddfb981f8af6

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install official Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Construct exact reviewed candidate and compile all targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          listener = Path('src-tauri/src/mcp/listener.rs')
          text = listener.read_text(encoding='utf-8')
          old = '''fn bind_listener(port: u16) -> Result<tokio::net::TcpListener, String> {
              let addr = std::net::SocketAddr::from(([127, 0, 0, 1], port));
              let listener = std::net::TcpListener::bind(addr)
                  .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;
              listener
                  .set_nonblocking(true)
                  .map_err(|err| format!("MCP 本地端口 {port} 设置非阻塞失败: {err}"))?;
              tokio::net::TcpListener::from_std(listener)
                  .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))
          }
          '''.replace('          ', '')
          new = '''fn bind_listener(port: u16) -> Result<tokio::net::TcpListener, String> {
              let addr = std::net::SocketAddr::from(([127, 0, 0, 1], port));
              #[cfg(unix)]
              {
                  let socket = tokio::net::TcpSocket::new_v4()
                      .map_err(|err| format!("MCP 本地端口 {port} 套接字初始化失败: {err}"))?;
                  socket
                      .set_reuseaddr(true)
                      .map_err(|err| format!("MCP 本地端口 {port} 设置快速重绑定失败: {err}"))?;
                  socket
                      .bind(addr)
                      .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;
                  socket
                      .listen(1024)
                      .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))
              }
              #[cfg(not(unix))]
              {
                  let listener = std::net::TcpListener::bind(addr)
                      .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;
                  listener
                      .set_nonblocking(true)
                      .map_err(|err| format!("MCP 本地端口 {port} 设置非阻塞失败: {err}"))?;
                  tokio::net::TcpListener::from_std(listener)
                      .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))
              }
          }
          '''.replace('          ', '')
          assert old in text
          listener.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('src-tauri/src/mcp/listener.rs')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          print(digest)
          assert digest == 'eefdf91a15f2d2c671dca44be4f3087f93e112afdc0b09f8c01b94210e75e208'
          Path('evidence/candidate-sha256.txt').write_text(digest+'\n',encoding='utf-8')
          PY
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee evidence/cargo-check.txt
      - name: Record clippy baseline without misclassifying unrelated debt
        shell: bash
        run: |
          set -uo pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee evidence/clippy-lib.txt
          status=${PIPESTATUS[0]}
          echo "$status" > evidence/clippy-status.txt
          if grep -E 'src[/\\]mcp[/\\]listener\.rs' evidence/clippy-lib.txt | grep -Eiq 'warning|error'; then
            echo 'Candidate listener emitted clippy diagnostics.' >&2
            exit 2
          fi
          echo 'Repository-wide clippy diagnostics, if any, are recorded but are not attributed to the candidate.'
      - name: Exercise restart and occupied-port semantics 10x each
        shell: bash
        run: |
          set -euo pipefail
          restart='tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key'
          occupied='mcp::listener::tests::bind_listener_reports_port_conflict_synchronously'
          : > evidence/exact-repeats.txt
          for i in $(seq 1 10); do
            echo "=== restart $i ===" | tee -a evidence/exact-repeats.txt
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "$restart" -- --exact --nocapture 2>&1 | tee -a evidence/exact-repeats.txt
            echo "=== occupied $i ===" | tee -a evidence/exact-repeats.txt
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "$occupied" -- --exact --nocapture 2>&1 | tee -a evidence/exact-repeats.txt
          done
      - name: Full desktop Rust regression and exact evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full-tests.txt
          git diff --check
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=['src-tauri/src/mcp/listener.rs','src-tauri/src/tools/任务恢复传输v2.rs','src-tauri/Cargo.toml','src-tauri/Cargo.lock']
          data={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          Path('evidence/source-hashes.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          git rev-parse HEAD > evidence/base-commit.txt
          echo 'DISPOSABLE_REVIEW_ONLY_NEVER_MERGE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue62-tokio-r2-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
