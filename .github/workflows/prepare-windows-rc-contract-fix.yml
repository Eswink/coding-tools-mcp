name: Prepare deterministic Windows RC contract
on:
  push:
    branches: ['fix/linux-startup-platform']
    paths: ['.github/workflows/prepare-windows-rc-contract-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-startup-platform
          fetch-depth: 1
      - name: Apply exact deterministic test and warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/tests/call_tool_contract.rs')
          text = path.read_text(encoding='utf-8')
          old = '''json!({"cmd": format!("{TEST_PYTHON} --version"), "filesystem_scope": "workspace"}),'''
          new = '''json!({
              "cmd": format!("{TEST_PYTHON} --version"),
              "filesystem_scope": "workspace",
              "yield_time_ms": 30_000
          }),'''
          if text.count(old) != 1:
              raise SystemExit('unexpected direct-exec contract fixture shape')
          text = text.replace(old, new, 1)
          old = '''"cmd": format!("{TEST_PYTHON} -c \\"import sys; sys.exit(1)\\""),
              "filesystem_scope": "workspace"'''
          new = '''"cmd": format!("{TEST_PYTHON} -c \\"import sys; sys.exit(1)\\""),
              "filesystem_scope": "workspace",
              "yield_time_ms": 30_000'''
          if text.count(old) != 1:
              raise SystemExit('unexpected nonzero-exit contract fixture shape')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src-tauri/src/commands/mod.rs')
          text = path.read_text(encoding='utf-8')
          old = 'pub(crate) use app_info::{environment_diagnostics, environment_diagnostics_snapshot};'
          new = 'pub(crate) use app_info::environment_diagnostics_snapshot;'
          if text.count(old) != 1:
              raise SystemExit('unexpected diagnostics re-export shape')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src-tauri/src/tools/policy.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let mut configured = parse_allowed_commands(configured);
    #[cfg(target_os = "linux")]
    configured.retain(|value| !matches!(value.to_ascii_lowercase().as_str(),
        "cmd" | "cmd.exe" | "powershell" | "powershell.exe" | "pwsh"));
    commands.extend(configured);'''
          new = '''    let configured = parse_allowed_commands(configured);
    #[cfg(target_os = "linux")]
    let configured = {
        let mut configured = configured;
        configured.retain(|value| !matches!(value.to_ascii_lowercase().as_str(),
            "cmd" | "cmd.exe" | "powershell" | "powershell.exe" | "pwsh"));
        configured
    };
    commands.extend(configured);'''
          if text.count(old) != 1:
              raise SystemExit('unexpected platform allowlist merge shape')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/prepare-windows-rc-contract-fix.yml
          expected=$(printf '%s\n' .github/workflows/prepare-windows-rc-contract-fix.yml src-tauri/tests/call_tool_contract.rs src-tauri/src/commands/mod.rs src-tauri/src/tools/policy.rs | sort)
          actual=$(git -c core.quotepath=false diff HEAD --name-only | sort)
          printf 'expected files:\n%s\nactual files:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Commit deterministic contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eswlnk'
          git config user.email '1525566427@qq.com'
          git add src-tauri/tests/call_tool_contract.rs src-tauri/src/commands/mod.rs src-tauri/src/tools/policy.rs
          git commit -m 'test(exec): wait explicitly for synchronous contract results'
          git push origin HEAD:fix/linux-startup-platform
