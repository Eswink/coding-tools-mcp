name: Fixed default-worker artifact diagnostic

on:
  push:
    branches:
      - ci/rc-artifact-default-worker-proof-20261004

permissions:
  contents: read
  actions: read

jobs:
  proof:
    if: >-
      github.repository == 'Eswink/coding-tools-mcp' &&
      github.repository_id == '1360355522' &&
      github.event_name == 'push' && !github.event.deleted &&
      github.ref == 'refs/heads/ci/rc-artifact-default-worker-proof-20261004' &&
      github.workflow_ref == 'Eswink/coding-tools-mcp/.github/workflows/rc-artifact-default-worker-proof.yml@refs/heads/ci/rc-artifact-default-worker-proof-20261004' &&
      github.workflow_sha == github.sha && github.run_id > 0 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Offline diagnostic contracts
        shell: bash
        run: python -B scripts/rc_consumer_default_worker_proof_tests.py
      - name: One fixed default-worker transfer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # No --foreground: the unchanged worker shares the timeout process group.
        # A watchdog kill means failure and terminal-state-unknown, never success.
        run: timeout --signal=KILL 430s python -B -I -S scripts/rc_consumer_default_worker_proof.py
