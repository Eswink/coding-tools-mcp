name: Native PTY candidate review (never merge)
# explicit rerun after canonical rustfmt

on:
  push:
    branches: ['ci/native-pty-candidate-review-20260925']
    paths:
      - 'services/local-agent/src/lib.rs'
      - 'services/local-agent/src/process_tree.rs'
      - 'services/local-agent/src/process_tree_windows.rs'
      - 'services/local-agent/src/pty.rs'
      - 'services/local-agent/src/pty_io.rs'
      - 'services/local-agent/src/pty_unix.rs'
      - 'services/local-agent/src/pty_windows.rs'
      - 'services/local-agent/src/bin/pty_fixture.rs'
      - 'services/local-agent/tests/pty_runtime.rs'
      - 'services/local-agent/Cargo.toml'
      - 'services/local-agent/Cargo.lock'
      - '.github/workflows/continuation-native-pty-candidate-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 5f65d069343c0cdcb5455fa7cc76792a14bb5d2e

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Stage exact PTY candidate and detect impact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          candidate="$GITHUB_SHA"
          git checkout "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          mapfile -t files < <(git -c core.quotePath=false diff --name-only "$SOURCE_SHA"..."$candidate" | grep -v '^.github/workflows/continuation-native-pty-candidate-review.yml$')
          git checkout "$candidate" -- "${files[@]}"
          git add "${files[@]}"
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          wc -l             services/local-agent/src/lib.rs             services/local-agent/src/process_tree.rs             services/local-agent/src/process_tree_windows.rs             services/local-agent/src/pty.rs             services/local-agent/src/pty_io.rs             services/local-agent/src/pty_unix.rs             services/local-agent/src/pty_windows.rs             services/local-agent/src/bin/pty_fixture.rs             services/local-agent/tests/pty_runtime.rs             | tee evidence/line-counts.txt
          for path in             services/local-agent/src/lib.rs             services/local-agent/src/process_tree.rs             services/local-agent/src/process_tree_windows.rs             services/local-agent/src/pty.rs             services/local-agent/src/pty_io.rs             services/local-agent/src/pty_unix.rs             services/local-agent/src/pty_windows.rs             services/local-agent/src/bin/pty_fixture.rs; do
            test "$(wc -l < "$path")" -lt 500
          done
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib, pathlib
          for p in pathlib.Path('services/local-agent').rglob('*'):
              if p.is_file() and (
                  p.as_posix().endswith(('pty.rs','pty_io.rs','pty_unix.rs','pty_windows.rs','pty_fixture.rs','pty_runtime.rs','process_tree.rs','process_tree_windows.rs','lib.rs','Cargo.toml','Cargo.lock'))
              ):
                  print(p.as_posix(), hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git diff --cached > evidence/candidate.patch
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$candidate" > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-pty-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/local-agent
      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustfmt --edition 2021 --check             services/local-agent/src/lib.rs             services/local-agent/src/process_tree.rs             services/local-agent/src/process_tree_windows.rs             services/local-agent/src/pty.rs             services/local-agent/src/pty_io.rs             services/local-agent/src/pty_unix.rs             services/local-agent/src/pty_windows.rs             services/local-agent/src/bin/pty_fixture.rs             services/local-agent/tests/pty_runtime.rs
          git diff --check "$SOURCE_SHA"...HEAD
          cargo check --locked --manifest-path services/local-agent/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml --test pty_runtime -- --nocapture 2>&1 | tee evidence/pty-runtime.txt
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/full.txt
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'services/local-agent/src/lib.rs',
              'services/local-agent/src/process_tree.rs',
              'services/local-agent/src/process_tree_windows.rs',
              'services/local-agent/src/pty.rs',
              'services/local-agent/src/pty_io.rs',
              'services/local-agent/src/pty_unix.rs',
              'services/local-agent/src/pty_windows.rs',
              'services/local-agent/src/bin/pty_fixture.rs',
              'services/local-agent/tests/pty_runtime.rs',
              'services/local-agent/Cargo.toml',
              'services/local-agent/Cargo.lock',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-pty-candidate-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
