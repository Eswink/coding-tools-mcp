name: Issue 62 release observer primitive review (never merge)

on:
  push:
    branches: ['ci/issue62-release-observer-20260924']
    paths:
      - 'src-tauri/src/mcp/listener.rs'
      - '.github/workflows/continuation-issue62-release-observer.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconfirm CRITICAL serve impact and staged observer delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          target='Function:src-tauri/src/mcp/listener.rs:serve'
          "$graph" context "$target" > evidence/context.txt 2>&1 || true
          "$graph" impact "$target" --direction upstream > evidence/impact.txt 2>&1 || true
          cat evidence/context.txt evidence/impact.txt
          git checkout "$GITHUB_SHA" -- src-tauri/src/mcp/listener.rs
          git add src-tauri/src/mcp/listener.rs
          git diff --cached --check
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          git diff --cached > evidence/observer.patch
          python - <<'PY' | tee evidence/source-hash.txt
          import hashlib
          p='src-tauri/src/mcp/listener.rs'
          print(hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          echo NEVER_MERGE_CRITICAL_DIAGNOSTIC_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-release-observer-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate observer against same-port restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          for i in {1..20}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml               tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
          done
          for i in {1..3}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee "evidence/full-$i.txt"
          done
          grep -h '\[issue62-release-observer\]' evidence/exact-*.txt evidence/full-*.txt > evidence/observer-latency.txt || true
          echo "observer_lines=$(wc -l < evidence/observer-latency.txt)" | tee evidence/result.txt
          cat evidence/observer-latency.txt
          git diff --check "$SOURCE_SHA"...HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-release-observer-ubuntu
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prove Windows behavior remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          for i in {1..10}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml               tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
          done
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee evidence/full.txt
          git diff --check "$SOURCE_SHA"...HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-release-observer-windows
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
