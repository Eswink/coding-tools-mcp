name: RC60 thread-contention diagnostic (never merge)

on:
  push:
    branches: ['ci/rc60-thread-contention-20260923']
    paths:
      - '.github/workflows/continuation-rc60-thread-contention.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc60-thread-contention-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 4f925e44c54066b5cf7df57e1133404542d70aec

jobs:
  contention:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Bind immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Record environment and compile once
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "source_sha=$SOURCE_SHA"
            echo "number_of_processors=${NUMBER_OF_PROCESSORS:-}"
            if command -v nproc >/dev/null 2>&1; then echo "nproc=$(nproc)"; fi
            rustc -vV
          } | tee evidence/environment.txt
          git diff --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/cargo-check.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run 2>&1 | tee evidence/lib-prebuild.txt
      - name: Exact readiness sanity
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor \
            -- --exact --nocapture 2>&1 | tee evidence/exact-sanity.txt
      - name: Measure readiness under controlled libtest concurrency
        shell: bash
        run: |
          set -euo pipefail
          printf 'threads,trial,readiness_ms,exit_code\n' > evidence/readiness.csv
          failures=0
          run_case() {
            threads="$1"
            trial="$2"
            label="threads-${threads}-trial-${trial}"
            log="evidence/${label}.txt"
            set +e
            if [ "$threads" = default ]; then
              cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --show-output 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
            else
              cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads="$threads" --show-output 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
            fi
            set -e
            readiness="$(grep -oE 'drain-startup ready after [0-9]+ms' "$log" | tail -n 1 | grep -oE '[0-9]+' || true)"
            if [ -z "$readiness" ]; then readiness=NA; fi
            printf '%s,%s,%s,%s\n' "$threads" "$trial" "$readiness" "$rc" | tee -a evidence/readiness.csv
            if [ "$rc" -ne 0 ]; then failures=$((failures+1)); fi
          }
          for threads in 1 2 4 8 default; do
            for trial in 1 2; do
              run_case "$threads" "$trial"
            done
          done
          cat evidence/readiness.csv
          echo "suite_failures=$failures" | tee evidence/result.txt
          test "$failures" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-thread-contention-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
