name: Ubuntu sandbox delegated Plan init (never merge)
on:
  push:
    branches: ['ci/ubuntu-sandbox-plan-init-20260925']
    paths: ['.github/workflows/continuation-ubuntu-sandbox-plan-init.yml']
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Start feature and persist Plan
        shell: bash
        env:
          FEATURE_DESCRIPTION: "Issue #73 Ubuntu sandbox isolation. Add the smallest Ubuntu-only, fail-closed local execution sandbox after existing LocalAdmission and ExecPolicy approval but before child execution. Deny filesystem escape outside the approved workspace and deny network capability unless explicitly approved by the existing capability/policy contract; never silently run unsandboxed if the Linux isolation primitive is unavailable. Preserve process-tree cancellation, bounded I/O, existing PTY/non-PTY behavior and Windows semantics. Do not implement Windows sandbox, Hooks, worktrees, snapshots, cloud authority, UI or packaging here. Require pinned GitNexus pre-edit impact for exact process/policy symbols, staged detect, Ubuntu 24.04 workspace-escape/symlink/network/cancellation/process-tree tests, Windows no-change regression, exact hashes and minimal rollback."
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/start.json
          import json, os
          print(json.dumps({
            "project_root":os.getcwd(),
            "description":os.environ["FEATURE_DESCRIPTION"],
            "spec_layout":"auto"
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec start_feature --stdin < evidence/start.json > evidence/start-output.json 2>&1
          cat evidence/start-output.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence/start-output.json','utf8'));
          if(r.isError===true) process.exit(1);
          function findPlan(v){
            if(!v || typeof v!=='object') return null;
            if(typeof v.planId==='string' && Array.isArray(v.steps)) return v;
            for(const x of Object.values(v)){ const p=findPlan(x); if(p) return p; }
            return null;
          }
          const plan=findPlan(r.structuredContent);
          if(!plan) process.exit(2);
          fs.writeFileSync('evidence/plan.json',JSON.stringify(plan,null,2));
          fs.writeFileSync('evidence/plan-id.txt',plan.planId+'\n');
          fs.writeFileSync('evidence/heartbeat.json',JSON.stringify({plan_id:plan.planId,project_root:process.cwd(),plan}));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          plan_id="$(cat evidence/plan-id.txt)"
          plan_path=".mcp-probe-kit/plans/$plan_id.json"
          test -f "$plan_path"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$plan_path"
          git diff --cached --check
          git commit -m "chore(plan): initialize Ubuntu sandbox delivery"
          git fetch origin "ci/ubuntu-sandbox-plan-init-20260925"
          test "$(git rev-parse "origin/ci/ubuntu-sandbox-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/ubuntu-sandbox-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ubuntu-sandbox-plan-init
          path: evidence/
          retention-days: 14
          if-no-files-found: error
