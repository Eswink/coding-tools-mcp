name: Public OAuth routing repair
on:
  push:
    branches: ['fix/public-oauth-routing']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe reported origin without credentials or redirects
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          python scripts/probe-public-oauth.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-oauth-observation
          path: evidence/
          if-no-files-found: error
          retention-days: 14
