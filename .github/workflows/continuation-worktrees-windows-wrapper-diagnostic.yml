name: Worktrees Windows wrapper diagnostic (never merge)

on:
  push:
    branches: ['ci/worktrees-windows-wrapper-diagnostic-20260925']
    paths:
      - 'src-tauri/src/harness/worktree.rs'
      - 'src-tauri/src/harness/worktree_git.rs'
      - '.github/workflows/continuation-worktrees-windows-wrapper-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run only focused worktree tests with sanitized wrapper stderr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml harness::worktree -- --nocapture 2>&1 | tee evidence/focused.txt
          code=${PIPESTATUS[0]}
          set -e
          grep -F '[worktree-wrapper-diagnostic]' evidence/focused.txt | tee evidence/wrapper-errors.txt || true
          echo "test_exit=$code" | tee evidence/result.txt
          git rev-parse HEAD > evidence/candidate-commit.txt
          test "$code" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-windows-wrapper-diagnostic
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
