name: Issue 62 production lifecycle test review (never merge)

on:
  push:
    branches: ['ci/issue62-test-lifecycle-review-20260924']
    paths:
      - 'src-tauri/src/tools/任务恢复传输v2.rs'
      - '.github/workflows/continuation-issue62-test-lifecycle-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Stage exact test-only lifecycle correction and detect changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          git checkout "$GITHUB_SHA" -- src-tauri/src/tools/任务恢复传输v2.rs
          git add src-tauri/src/tools/任务恢复传输v2.rs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 1
          test "$(cat evidence/changed-paths.txt)" = 'src-tauri/src/tools/任务恢复传输v2.rs'
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          git diff --cached > evidence/candidate.patch
          test "$(grep -c 'await_listener_shutdown(Some(handle), port).await' src-tauri/src/tools/任务恢复传输v2.rs)" -eq 2
          ! git diff --cached --name-only | grep -q 'src-tauri/src/mcp/listener.rs'
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          p='src-tauri/src/tools/任务恢复传输v2.rs'
          print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$GITHUB_SHA" > evidence/candidate-commit.txt
          echo NEVER_MERGE_TEST_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-test-lifecycle-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify same-port restart through production lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          for i in {1..30}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml               tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
          done
          for i in {1..3}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee "evidence/full-$i.txt"
          done
          grep -q '1 passed; 0 failed' evidence/exact-30.txt
          grep -q 'test result: ok' evidence/full-3.txt
          git diff --check "$SOURCE_SHA"...HEAD
          python - <<'PY' | tee evidence/source-hash.txt
          import hashlib
          p='src-tauri/src/tools/任务恢复传输v2.rs'
          print(hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-test-lifecycle-ubuntu
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify Windows semantics remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          for i in {1..20}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml               tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
          done
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee evidence/full.txt
          grep -q '1 passed; 0 failed' evidence/exact-20.txt
          grep -q 'test result: ok' evidence/full.txt
          git diff --check "$SOURCE_SHA"...HEAD
          python - <<'PY' | tee evidence/source-hash.txt
          import hashlib
          p='src-tauri/src/tools/任务恢复传输v2.rs'
          print(hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-test-lifecycle-windows
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
