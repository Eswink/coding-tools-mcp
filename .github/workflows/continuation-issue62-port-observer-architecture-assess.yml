name: Issue 62 port observer ARC-8 assess (never merge)

on:
  push:
    branches: ['ci/issue62-port-observer-architecture-assess-20260924']
    paths:
      - '.github/workflows/continuation-issue62-port-observer-architecture-assess.yml'

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4dc9f9d872c134d381cb1eba76999d34231d3ba6
          persist-credentials: false
          fetch-depth: 0
      - name: Establish ARC-1 through ARC-3 with current source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/request.json
          import json, os
          print(json.dumps({
            "mode":"assess",
            "project_root":os.getcwd(),
            "description":"Issue #62: establish the architecture problem, current facts, structural root cause and protected invariants for Ubuntu same-port restart. New verified source evidence shows the existing production restart-safe boundary in runtime/port misclassifies a Linux ownerless LISTEN tail as free because find_pid_listening_on_port returns None when /proc/net/tcp still contains LISTEN but no /proc/<pid>/fd owns the inode.",
            "scope":[
              "src-tauri/src/platform/linux/net.rs",
              "src-tauri/src/runtime/port.rs",
              "src-tauri/src/runtime/supervisor.rs",
              "src-tauri/src/tools/任务恢复传输v2.rs"
            ],
            "non_goals":[
              "Editing CRITICAL mcp/listener.rs serve or bind_listener",
              "Changing Windows or macOS semantics",
              "Adding sleeps, same-port bind retries or SO_REUSEPORT",
              "Changing MCP auth/origin/wire behavior"
            ],
            "constraints":[
              "Foreign PID-owned listeners must remain an immediate explicit conflict.",
              "Ownerless Linux LISTEN after our graceful close is transiently occupied until it disappears or the existing bounded shutdown timeout expires.",
              "Production RuntimeSupervisor already calls await_listener_shutdown_blocking before restart.",
              "GitNexus: wait_for_port_free LOW/exact impacted=1; wait_for_port_free_blocking LOW/exact impacted=9; Linux find_pid_listening_on_port LOW/lower-bound impacted=1 with 19 unresolved receiver callsites.",
              "No edit is allowed until ARC-8 assess and design gates pass."
            ],
            "current_facts":[
              {
                "statement":"On sampled Ubuntu runners, exact loopback LISTEN remains visible for 15-36 ms after axum server JoinHandle completion and immediate same-port bind fails during that tail.",
                "classification":"fact",
                "evidence":["close-lag run 35951904056","listener owner/inode diagnostics"]
              },
              {
                "statement":"During the tail, /proc/net/tcp can still show LISTEN while no /proc/<pid>/fd resolves the socket inode.",
                "classification":"fact",
                "evidence":["owner diagnostics","/proc source review"]
              },
              {
                "statement":"Linux find_pid_listening_on_port returns Ok(None) in that ownerless-LISTEN state, and runtime wait_for_port_free treats Ok(None) as free.",
                "classification":"fact",
                "evidence":["src-tauri/src/platform/linux/net.rs","src-tauri/src/runtime/port.rs","impact run 36003461930"]
              },
              {
                "statement":"RuntimeSupervisor::sync_stop_and_wait already uses await_listener_shutdown_blocking before restart, so the intended restart-safe boundary already exists in runtime/port.",
                "classification":"fact",
                "evidence":["src-tauri/src/runtime/supervisor.rs:533-546","caller run 35981142285"]
              },
              {
                "statement":"The prior test-only idea to call await_listener_shutdown cannot repair the production false-free because the helper uses the same PID-only detector.",
                "classification":"inference",
                "evidence":["test-lifecycle failed approach","runtime/port source review"]
              }
            ],
            "structural_causes":[
              "The Linux port-observation API collapses two distinct kernel states—no LISTEN socket and a LISTEN socket whose inode no longer maps to a live userspace fd—into the same Ok(None) value. The restart-safe wait therefore cannot distinguish truly free from ownerless-but-still-listening.",
              "The runtime restart boundary is correctly centralized in runtime/port, but its Linux availability predicate is weaker than the bindability condition it claims to represent."
            ],
            "protected_invariants":[
              "Loopback-only MCP listener remains unchanged.",
              "Foreign PID-owned port conflict fails immediately.",
              "Same-port restart is attempted once after the restart-safe boundary; no bind retry is introduced.",
              "Existing bounded shutdown timeout remains the only wait bound.",
              "Windows/macOS semantics and MCP auth/origin/wire behavior remain unchanged."
            ],
            "runtime_evidence":[
              "run 35951904056 close-lag",
              "run 35981142285 lifecycle callers",
              "run 36003461930 port observer impact",
              "current source 4dc9f9d872c134d381cb1eba76999d34231d3ba6"
            ],
            "collect_evidence":false,
            "save_to_docs":false
          },ensure_ascii=False,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec architecture --stdin < evidence/request.json > evidence/architecture-assess.json 2>&1
          cat evidence/architecture-assess.json
          node - <<'NODE'
          const r=require('./evidence/architecture-assess.json');
          if(r.isError===true) process.exit(1);
          const s=r.structuredContent;
          if(!s?.validation?.passed) process.exit(2);
          for(const id of ['arc-1','arc-2','arc-3']) if(!s.arc8Status?.completedSteps?.includes(id)) process.exit(3);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-port-observer-architecture-assess
          path: evidence/
          retention-days: 14
          if-no-files-found: error
