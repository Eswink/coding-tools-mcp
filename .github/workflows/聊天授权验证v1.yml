name: 聊天授权验证v1
on:
  push:
    branches: ['feat/chat-authorization-v1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-authorization-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/feat/chat-authorization-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验精确源码（只读，不改写分支）
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test ! -e docs/specs/聊天授权v1/候选清单v1.json
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          git rev-parse HEAD > evidence/源码版本v4.txt
          git rev-parse HEAD^{tree} > evidence/源码树v4.txt
          git diff 22dbbecd3fbebef58b8b6bdca05e2f7080e0b128 HEAD --binary > evidence/聊天授权源码v4.patch
          git archive --format=zip -o evidence/聊天授权源码v4.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: 聊天授权精确源码v4
          path: evidence/
          if-no-files-found: error
  frontend:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: 授权面板与全部前端回归（真实源码临时编译）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/源码版本v4.txt
          node scripts/前端完整回归v4.mjs 2>&1 | tee evidence/前端回归v4.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 聊天授权前端-${{ matrix.os }}-v4
          path: evidence/
          if-no-files-found: error
  rust:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: 安装 Linux 桌面依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust完整基线与真实HTTP隔离回归
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/源码版本v4.txt
          rustc -Vv | tee evidence/编译器v4.txt
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/编译检查v4.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/完整回归v4.txt
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee evidence/生产零警告v5.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 聊天授权Rust-${{ matrix.os }}-v4
          path: evidence/
          if-no-files-found: error
