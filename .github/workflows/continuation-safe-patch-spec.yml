name: Safe patch spec gate (never merge)

on:
  push:
    branches: ['ci/safe-patch-spec-review-20260924']
    paths:
      - 'docs/specs/issue-68-safe-patch/**'
      - '.github/workflows/continuation-safe-patch-spec.yml'

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate embedded-plan specs with repository probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/probe-install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec check_spec --json "{\"project_root\":\"$PWD\",\"feature_name\":\"issue-68-safe-patch\",\"docs_dir\":\"docs\"}" > evidence/check-spec.json 2>&1
          cat evidence/check-spec.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence/check-spec.json','utf8'));
          if (r.structuredContent?.passed !== true) process.exit(1);
          NODE
          ./.mcp-probe-kit/bin/probe exec estimate --json "{\"task_description\":\"Implement issue-68-safe-patch from docs/specs/issue-68-safe-patch/tasks.md\",\"code_context\":\"Existing patch transaction is in src-tauri/src/tools/patch.rs; GitNexus pre-edit risk LOW.\"}" > evidence/estimate.json 2>&1 || true
          cat evidence/estimate.json
          git diff --check
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-spec
          path: evidence/
          retention-days: 14
          if-no-files-found: error
