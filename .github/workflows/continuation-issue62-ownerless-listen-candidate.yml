name: Issue 62 ownerless LISTEN candidate review (never merge)

on:
  push:
    branches: ['ci/issue62-ownerless-listen-candidate-20260925']
    paths:
      - 'src-tauri/src/platform/linux/net.rs'
      - 'src-tauri/src/platform/linux/mod.rs'
      - 'src-tauri/src/platform/mod.rs'
      - 'src-tauri/src/runtime/port.rs'
      - 'src-tauri/src/tools/任务恢复传输v2.rs'
      - '.github/workflows/continuation-issue62-ownerless-listen-candidate.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Stage exact candidate and run GitNexus detect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          candidate="$GITHUB_SHA"
          git checkout "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          files=(
            'src-tauri/src/platform/linux/net.rs'
            'src-tauri/src/platform/linux/mod.rs'
            'src-tauri/src/platform/mod.rs'
            'src-tauri/src/runtime/port.rs'
            'src-tauri/src/tools/任务恢复传输v2.rs'
          )
          git checkout "$candidate" -- "${files[@]}"
          git add "${files[@]}"
          git diff --cached --check
          git -c core.quotePath=false diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 5
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          git diff --cached > evidence/candidate.patch
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'src-tauri/src/platform/linux/net.rs',
              'src-tauri/src/platform/linux/mod.rs',
              'src-tauri/src/platform/mod.rs',
              'src-tauri/src/runtime/port.rs',
              'src-tauri/src/tools/任务恢复传输v2.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$candidate" > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-ownerless-listen-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Ubuntu native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify candidate diff and compile
        shell: bash
        run: |
          set -euo pipefail
          # Legacy modules have pre-existing rustfmt debt; platform/mod.rs also
          # causes rustfmt to traverse unchanged children. Validate only this diff.
          git diff --check "$SOURCE_SHA"...HEAD
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Repeat exact same-port recovery target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for i in {1..20}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml               tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
          done
      - name: Repeat complete desktop Rust suite
        shell: bash
        run: |
          set -euo pipefail
          repeats=2
          if [ "$RUNNER_OS" = "Linux" ]; then repeats=6; fi
          for i in $(seq 1 "$repeats"); do
            cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee "evidence/full-$i.txt"
          done
      - name: Record exact candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'src-tauri/src/platform/linux/net.rs',
              'src-tauri/src/platform/linux/mod.rs',
              'src-tauri/src/platform/mod.rs',
              'src-tauri/src/runtime/port.rs',
              'src-tauri/src/tools/任务恢复传输v2.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-ownerless-listen-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
