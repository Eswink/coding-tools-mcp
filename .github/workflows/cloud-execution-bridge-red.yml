name: Issue81 cloud execution failure-first witness
on:
  push:
    branches: ['test/issue-81-cloud-route-red']
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud-gateway
      - name: Compile then demonstrate the actual missing route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --exit-code 2c5d133eaa75d7fc084b8122350d7768ce5b2382 -- services/cloud-gateway/src
          git rev-parse HEAD > evidence/source.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/pg81"
          initdb -D "$RUNNER_TEMP/pg81/data" -A trust -U mcp_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pg81/data" -l "$RUNNER_TEMP/pg81/log" -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP/pg81" -w start >/dev/null
          trap 'pg_ctl -D "$RUNNER_TEMP/pg81/data" -m fast -w stop >/dev/null || true' EXIT
          createdb -h 127.0.0.1 -p 55432 -U mcp_test coding_tools_identity_test
          export TEST_DATABASE_URL=postgresql://mcp_test@127.0.0.1:55432/coding_tools_identity_test
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test execution_postgres --no-run 2>&1 | tee evidence/compile.txt
          set +e
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test execution_postgres -- --nocapture 2>&1 | tee evidence/red.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 101
          grep -q 'EXECUTION_BRIDGE_MISSING' evidence/red.txt
          grep -q '0 passed; 1 failed; 0 ignored' evidence/red.txt
          printf '%s\n' '{"failure_witness_verified":true,"acceptance_passed":false,"production_unchanged":true}' > evidence/result.json
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-red-witness
          path: evidence/
          retention-days: 30
          if-no-files-found: error
