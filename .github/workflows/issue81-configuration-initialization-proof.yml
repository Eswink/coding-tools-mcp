name: Issue81 configuration initialization failure proof
on:
  push:
    branches: ['feat/issue81-native-configuration']
permissions:
  contents: read
concurrency:
  group: issue81-configuration-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Native prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: issue81-native-configuration-v1
      - name: Prove nonrecursive initialization is the tested rejection boundary
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          source=pathlib.Path('src-tauri/src/cloud_connection/storage.rs')
          original=source.read_bytes()
          needle=b'exclusive.recursive(false);'
          assert original.count(needle)==1
          command=['cargo','test','--locked','--manifest-path','src-tauri/Cargo.toml','--lib','cloud_connection::tests::empty_existing_namespace_is_not_a_fresh_import','--','--exact','--nocapture']
          records=[]
          def run(name,expected):
              path=pathlib.Path('evidence')/(name+'.log')
              with path.open('wb') as stream:
                  result=subprocess.run(command,stdout=stream,stderr=subprocess.STDOUT,timeout=1200,check=False)
              text=path.read_text(encoding='utf-8',errors='replace')
              record={'name':name,'exit_code':result.returncode,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
              records.append(record)
              assert result.returncode==expected,(name,result.returncode)
              assert 'running 1 test' in text
              if expected==0:
                  assert '1 passed; 0 failed; 0 ignored;' in text
              else:
                  assert '0 passed; 1 failed; 0 ignored;' in text
                  assert 'assertion failed' in text and 'AlreadyInitialized' in text
              print(json.dumps(record))
          try:
              run('committed-positive',0)
              source.write_bytes(original.replace(needle,b'exclusive.recursive(true);'))
              run('recursive-mutant-rejected-by-test',101)
          finally:
              source.write_bytes(original)
          run('restored-positive',0)
          subprocess.run(['git','diff','--exit-code','HEAD','--'],check=True)
          report={'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'passed':True,'kind':'controlled-mutation-not-historical-product-failure','assertions_unchanged':True,'production_source_restored':True,'runs':records}
          pathlib.Path('evidence/proof.json').write_text(json.dumps(report,indent=2)+'\n')
          print('INITIALIZATION_PROOF='+json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-configuration-initialization-proof
          path: evidence/
          retention-days: 30
          if-no-files-found: error
