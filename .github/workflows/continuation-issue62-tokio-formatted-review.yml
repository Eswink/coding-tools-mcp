name: Isolated issue 62 formatted Tokio review (never merge)

on:
  push:
    branches: ['ci/issue62-tokio-formatted-review-20260923']

permissions:
  contents: read

env:
  BASE_SHA: 998abf5ff85aa13fad54797fb3a7ddfb981f8af6

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Confirm CRITICAL impact, stage formatted candidate, detect actual change
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12 > evidence/install.txt 2>&1
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md
          "$graph" context 'Function:src-tauri/src/mcp/listener.rs:bind_listener' > evidence/context.json 2>&1
          "$graph" impact 'Function:src-tauri/src/mcp/listener.rs:bind_listener' --direction upstream > evidence/impact.json 2>&1
          grep -q '"risk": "CRITICAL"' evidence/impact.json
          python - <<'PY'
          from pathlib import Path
          path=Path('src-tauri/src/mcp/listener.rs')
          text=path.read_text(encoding='utf-8')
          old='\n'.join([
          'fn bind_listener(port: u16) -> Result<tokio::net::TcpListener, String> {',
          '    let addr = std::net::SocketAddr::from(([127, 0, 0, 1], port));',
          '    let listener = std::net::TcpListener::bind(addr)',
          '        .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;',
          '    listener',
          '        .set_nonblocking(true)',
          '        .map_err(|err| format!("MCP 本地端口 {port} 设置非阻塞失败: {err}"))?;',
          '    tokio::net::TcpListener::from_std(listener)',
          '        .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))',
          '}', '' ])
          new='\n'.join([
          'fn bind_listener(port: u16) -> Result<tokio::net::TcpListener, String> {',
          '    let addr = std::net::SocketAddr::from(([127, 0, 0, 1], port));',
          '    #[cfg(unix)]',
          '    {',
          '        let socket = tokio::net::TcpSocket::new_v4()',
          '            .map_err(|err| format!("MCP 本地端口 {port} 套接字初始化失败: {err}"))?;',
          '        socket',
          '            .set_reuseaddr(true)',
          '            .map_err(|err| format!("MCP 本地端口 {port} 设置快速重绑定失败: {err}"))?;',
          '        socket',
          '            .bind(addr)',
          '            .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;',
          '        socket',
          '            .listen(1024)',
          '            .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))',
          '    }',
          '    #[cfg(not(unix))]',
          '    {',
          '        let listener = std::net::TcpListener::bind(addr)',
          '            .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;',
          '        listener',
          '            .set_nonblocking(true)',
          '            .map_err(|err| format!("MCP 本地端口 {port} 设置非阻塞失败: {err}"))?;',
          '        tokio::net::TcpListener::from_std(listener)',
          '            .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))',
          '    }',
          '}', '' ])
          assert old in text
          path.write_bytes(text.replace(old,new,1).encode('utf-8'))
          PY
          rustfmt --edition 2021 --check src-tauri/src/mcp/listener.rs
          git add -- src-tauri/src/mcp/listener.rs
          git diff --cached --check
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/impact.json evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=['src-tauri/src/mcp/listener.rs','src-tauri/src/tools/任务恢复传输v2.rs','src-tauri/Cargo.toml','src-tauri/Cargo.lock']
          data={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          Path('evidence/source-hashes.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          git diff --cached -- src-tauri/src/mcp/listener.rs > evidence/candidate.patch
          echo 'CRITICAL_ALREADY_REPORTED_DISPOSABLE_NEVER_MERGE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue62-formatted-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install official Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Construct identical formatted candidate and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          path=Path('src-tauri/src/mcp/listener.rs')
          text=path.read_text(encoding='utf-8')
          old='\n'.join(['fn bind_listener(port: u16) -> Result<tokio::net::TcpListener, String> {','    let addr = std::net::SocketAddr::from(([127, 0, 0, 1], port));','    let listener = std::net::TcpListener::bind(addr)','        .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;','    listener','        .set_nonblocking(true)','        .map_err(|err| format!("MCP 本地端口 {port} 设置非阻塞失败: {err}"))?;','    tokio::net::TcpListener::from_std(listener)','        .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))','}', '' ])
          new='\n'.join(['fn bind_listener(port: u16) -> Result<tokio::net::TcpListener, String> {','    let addr = std::net::SocketAddr::from(([127, 0, 0, 1], port));','    #[cfg(unix)]','    {','        let socket = tokio::net::TcpSocket::new_v4()','            .map_err(|err| format!("MCP 本地端口 {port} 套接字初始化失败: {err}"))?;','        socket','            .set_reuseaddr(true)','            .map_err(|err| format!("MCP 本地端口 {port} 设置快速重绑定失败: {err}"))?;','        socket','            .bind(addr)','            .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;','        socket','            .listen(1024)','            .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))','    }','    #[cfg(not(unix))]','    {','        let listener = std::net::TcpListener::bind(addr)','            .map_err(|err| format!("MCP 本地端口 {port} 绑定失败: {err}"))?;','        listener','            .set_nonblocking(true)','            .map_err(|err| format!("MCP 本地端口 {port} 设置非阻塞失败: {err}"))?;','        tokio::net::TcpListener::from_std(listener)','            .map_err(|err| format!("MCP 本地监听器初始化失败: {err}"))','    }','}', '' ])
          assert old in text
          path.write_bytes(text.replace(old,new,1).encode('utf-8'))
          PY
          rustfmt --edition 2021 --check src-tauri/src/mcp/listener.rs
          python - <<'PY'
          import hashlib
          from pathlib import Path
          digest=hashlib.sha256(Path('src-tauri/src/mcp/listener.rs').read_bytes()).hexdigest()
          Path('evidence/candidate-sha256.txt').write_text(digest+'\n',encoding='utf-8')
          print(digest)
          PY
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee evidence/cargo-check.txt
      - name: Repeat lifecycle contract 10x and run full suite
        shell: bash
        run: |
          set -euo pipefail
          restart='tools::exec_tasks::recovery_transport_tests::listener_restart_keeps_the_running_job_and_its_idempotency_key'
          occupied='mcp::listener::tests::bind_listener_reports_port_conflict_synchronously'
          : > evidence/exact.txt
          for i in $(seq 1 10); do
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "$restart" -- --exact --nocapture 2>&1 | tee -a evidence/exact.txt
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "$occupied" -- --exact --nocapture 2>&1 | tee -a evidence/exact.txt
          done
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full-tests.txt
          git diff --check
          git rev-parse HEAD > evidence/base-commit.txt
          echo 'DISPOSABLE_REVIEW_ONLY_NEVER_MERGE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue62-formatted-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
