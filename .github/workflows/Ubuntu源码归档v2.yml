name: Ubuntu源码归档v2
on:
  push:
    branches: ['chore/Ubuntu源码归档v2']
    paths: ['.github/workflows/Ubuntu源码归档v2.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d853813ff066906d770825ad251ab9b5b31bed77
          persist-credentials: false
      - name: 仅归档已提交公开源码和Git模式
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Ubuntu源码v2"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/Ubuntu源码v2/源码v2.zip"
          git ls-tree -rz HEAD > "$RUNNER_TEMP/Ubuntu源码v2/Git模式v2.bin"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/Ubuntu源码v2/来源v2.txt"
          cd "$RUNNER_TEMP/Ubuntu源码v2"
          sha256sum 源码v2.zip Git模式v2.bin > 摘要v2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ubuntu精确源码v2
          path: ${{ runner.temp }}/Ubuntu源码v2/
          retention-days: 7
          if-no-files-found: error
