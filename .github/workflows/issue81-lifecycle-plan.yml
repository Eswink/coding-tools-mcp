name: Issue81 lifecycle retained plan prerequisites
on:
  push:
    branches: ['ci/issue81-connection-lifecycle']
    paths: ['.github/workflows/issue81-lifecycle-plan.yml']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: issue81-lifecycle-preedit
          run-id: 36521752155
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - uses: actions/download-artifact@v4
        with:
          name: issue81-pinned-review-tools
          run-id: 36434991238
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tools
      - name: Resume and complete next prerequisite steps with retained requirements
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tools"; sha256sum -c SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/review-bin" "$RUNNER_TEMP/plan-output"
          tar -xJf pinned-review-tools.tar.xz -C "$RUNNER_TEMP/review-bin"
          cd "$GITHUB_WORKSPACE"
          export PATH="$RUNNER_TEMP/review-bin/node_modules/.bin:$PATH"
          export MCP_GITNEXUS_MODE=system
          python - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);out=pathlib.Path(os.environ['RUNNER_TEMP'])/'plan-output'
          plan=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'prior/retained-plan.json').read_text())
          def call(name,args,file):
              r=subprocess.run(['mcp-probe-kit','exec',name,'--stdin'],input=json.dumps(args),text=True,capture_output=True,timeout=300)
              (out/file).write_text(r.stdout+'\n'+r.stderr)
              if r.returncode: raise RuntimeError(name+' process failed')
              d=json.loads(r.stdout)
              if d.get('isError') or d.get('ok') is False: raise RuntimeError(name+' tool rejected')
              return d
          call('plan_heartbeat',{'plan_id':plan['planId'],'project_root':str(root),'plan':plan},'restore.json')
          call('resume_plan',{'plan_id':plan['planId'],'project_root':str(root)},'resume-before.json')
          call('init_project_context',{'docs_dir':'docs','project_root':str(root)},'context.json')
          # Source contract already exists; preserve it, do not overwrite with a template.
          for n in ['requirements.md','design.md','tasks.md','spec-manifest.json']:
              assert (root/'docs/specs/cloud-execution-bridge'/n).is_file()
          call('plan_heartbeat',{'plan_id':plan['planId'],'project_root':str(root),'completed_step_ids':['context','write-spec']},'context-spec.json')
          call('check_spec',{'feature_name':'cloud-execution-bridge','docs_dir':'docs','project_root':str(root)},'check-spec.json')
          call('estimate',{'task_description':'Continue the full Epic32 Issue81 requirements; implement single-run native connection ownership, bounded shutdown/drain, retain unknown outcomes and prevent restart overlap. No reduced release; keep native desktop wiring, Windows sandbox, Hooks, worktrees, snapshot, deployment and full package gates required.','code_context':(root/'docs/specs/cloud-execution-bridge/design.md').read_text()},'estimate.json')
          call('plan_heartbeat',{'plan_id':plan['planId'],'project_root':str(root),'completed_step_ids':['context','write-spec','check-spec','estimate']},'implementation-checkpoint.json')
          r=call('resume_plan',{'plan_id':plan['planId'],'project_root':str(root)},'resume-implement.json')
          assert r['structuredContent']['nextStepId']=='implement'
          print('IMPLEMENTATION_READY='+json.dumps(r,ensure_ascii=False))
          subprocess.run(['git','checkout','--','AGENTS.md','CLAUDE.md'],check=True)
          subprocess.run(['gitnexus','analyze','--workers','1'],check=True,stdout=(out/'graph.txt').open('w'),stderr=subprocess.STDOUT,timeout=300)
          for name in ['open_existing','complete','claim']:
              p=subprocess.run(['gitnexus','impact',name,'--direction','upstream','--file','services/native-link/src/journal.rs','--depth','3'],text=True,capture_output=True,check=True)
              (out/('impact-'+name+'.json')).write_text(p.stdout);print(name+'='+p.stdout)
          (out/'plan.json').write_text(json.dumps(plan,ensure_ascii=False,indent=2))
          PY
      - name: Retain full-plan checkpoint
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,os,hashlib,json,shutil
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);out=pathlib.Path(os.environ['RUNNER_TEMP'])/'plan-output';out.mkdir(exist_ok=True)
          for p in (root/'docs/.mcp-probe').rglob('*.json'):
              target=out/'checkpoint'/p.relative_to(root);target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
          (out/'hashes.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file() and p.name!='hashes.json'},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-lifecycle-implementation-plan
          path: ${{ runner.temp }}/plan-output/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
