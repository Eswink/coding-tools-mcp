name: Offline authorization suppression verification

on:
  push:
    branches: ['ci/offline-noise-r12']
    paths:
      - 'services/cloud-gateway/tests/mcp_postgres.rs'
      - '.github/workflows/offline-noise-r12.yml'

permissions:
  contents: read

concurrency:
  group: offline-noise-r12
  cancel-in-progress: true

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Portable MCP contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib 2>&1 | tee evidence/lib-tests.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_service_contracts 2>&1 | tee evidence/mcp-service.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bin coding-tools-mcp-gateway
          git diff --check 402fc5771453fcff1613fc7f13693a513a59d0d1 HEAD
          git diff --name-only 402fc5771453fcff1613fc7f13693a513a59d0d1 HEAD > evidence/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('evidence/changed-files.txt').read_text(encoding='utf-8').splitlines()
          assert set(paths) <= {
              'services/cloud-gateway/tests/mcp_postgres.rs',
              '.github/workflows/offline-noise-r12.yml',
          }, paths
          PY
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-noise-portable-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: PostgreSQL real-channel offline authorization contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p evidence "$RUNNER_TEMP/pg-offline-noise"
          port="$(python3 - <<'PY'
          import socket
          s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()
          PY
          )"
          initdb -D "$RUNNER_TEMP/pg-offline-noise/data" -A trust -U offline_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pg-offline-noise/data" -l "$RUNNER_TEMP/pg-offline-noise/postgres.log" -o "-h 127.0.0.1 -p $port -k $RUNNER_TEMP/pg-offline-noise" -w start >/dev/null
          trap 'pg_ctl -D "$RUNNER_TEMP/pg-offline-noise/data" -m fast -w stop >/dev/null || true' EXIT
          createdb -h 127.0.0.1 -p "$port" -U offline_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://offline_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_postgres -- --test-threads=1 2>&1 | tee evidence/mcp-postgres.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test projection_postgres -- --test-threads=1 2>&1 | tee evidence/projection-postgres.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test channel_postgres -- --test-threads=1 2>&1 | tee evidence/channel-postgres.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test admission_postgres -- --test-threads=1 2>&1 | tee evidence/admission-postgres.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-noise-postgres
          path: evidence/
          retention-days: 14
          if-no-files-found: error
