name: Desktop mandatory Linux sandbox acceptance
on:
  push:
    branches: ['feat/issue-73-desktop-sandbox-bridge', 'feat/cloud-gateway-agent-runtime']
    paths: ['src-tauri/**', 'services/local-agent/**', 'tests/cloud-gateway/**', '.github/workflows/cloud-gateway-desktop-sandbox.yml']
  pull_request:
    branches: [main, 'feat/cloud-gateway-agent-runtime']
    paths: ['src-tauri/**', 'services/local-agent/**', 'tests/cloud-gateway/**', '.github/workflows/cloud-gateway-desktop-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-sandbox-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            services/local-agent
      - name: Record source and verify canonical formatting
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          rustc --version > evidence/rustc.txt
          cargo fmt --check --manifest-path services/local-agent/Cargo.toml
          rustfmt --check --edition 2021 src-tauri/src/tools/linux_sandbox.rs src-tauri/src/tools/linux_sandbox_tests.rs src-tauri/src/auth/local_admission_expiry_tests.rs
      - name: Exact existing protocol assertions and evidence classifier
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test "$(git hash-object tests/cloud-gateway/ubuntu_sandbox_dispatch.rs)" = 5284c554f92064fc41d46af6b1e4c4b0fd135ff1
          test "$(git hash-object tests/cloud-gateway/sandbox-dispatch/run_probe.py)" = 1fdb18eae060c7a9c9903f86f5687e272f9ca1d0
          test "$(git hash-object tests/cloud-gateway/sandbox-dispatch/test_run_probe.py)" = 6d27b6475c86babc3a9b94abf8a416706d05cd88
          python -m unittest discover -s tests/cloud-gateway/sandbox-dispatch -p 'test_*.py' -v
          PATH="/usr/bin:/bin:$PATH" python tests/cloud-gateway/sandbox-dispatch/run_probe.py --evidence evidence/wire
          python -c "import json; assert json.load(open('evidence/wire/result.json'))['acceptance_passed'] is True"
      - name: Full native desktop regression and strict production build
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/check.txt
          if [ "$RUNNER_OS" = Linux ]; then
            PATH="/usr/bin:/bin:$PATH" cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/desktop-tests.txt
          else
            cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/desktop-tests.txt
          fi
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee evidence/strict.txt
      - name: Complete shared-runtime regression
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/local-agent-tests.txt
      - name: Existing protocol UI and proxy contracts
        run: |
          set -euo pipefail
          node --test tests/cloud-gateway/*.test.mjs 2>&1 | tee evidence/contracts.txt
          node --test tests/offline-safe-ui.test.mjs tests/offline-safe-intent-ui.test.mjs 2>&1 | tee evidence/ui.txt
          python scripts/connector_fault_proxy_tests.py 2>&1 | tee evidence/proxy.txt
      - name: Source restoration and evidence digests
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --exit-code HEAD --
          git bundle create evidence/source.bundle HEAD
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256.json').write_text(json.dumps(hashes,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-sandbox-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
