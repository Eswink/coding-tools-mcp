name: Issue81 verified cloud source import
on:
  push:
    branches: ['ci/issue81-resume-full-plan']
    paths: ['.github/workflows/issue81-canonical-import.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: issue81-resumed-native-*
          run-id: 36438176049
          github-token: ${{ github.token }}
          path: checked
      - uses: actions/download-artifact@v4
        with:
          name: issue81-pinned-review-tools
          run-id: 36434991238
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pinned-review
      - name: Reconstruct and verify exact tested bytes including the hidden workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          jobs=api('/actions/runs/36438176049/jobs?per_page=100')['jobs']
          for name in ('native (windows-2025)','native (ubuntu-24.04)'):
              rows=[j for j in jobs if j['name']==name]
              assert len(rows)==1 and rows[0]['conclusion']=='success'
          a=pathlib.Path('checked/issue81-resumed-native-ubuntu-24.04');b=pathlib.Path('checked/issue81-resumed-native-windows-2025')
          first=json.loads((a/'source.json').read_text());second=json.loads((b/'source.json').read_text())
          assert first==second and first['candidate_tree']=='c67f14926b670c16b224e041423b522a19b74823'
          assert first['ci_sha']=='b0c2ac19d6067ed3288a4b4a10e2f3290ab5b719'
          patch=lzma.decompress(base64.b64decode(''.join(pathlib.Path(f'.ci/issue81-resume-{i}.b64').read_text() for i in range(3)),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0d261b71434182bd6b7a791b2717faf5f3980dd3583e486171a2f1cc7c2f9189'
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/input.patch').write_bytes(patch)
          subprocess.run(['git','checkout','--detach',first['baseline']],check=True)
          subprocess.run(['git','apply','--index','evidence/input.patch'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==first['candidate_tree']
          missing=[]
          for path,proof in first['files'].items():
              data=pathlib.Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==proof['sha256']
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==proof['git_blob']
              for artifact in (a,b):
                  exported=artifact/'source'/path
                  if exported.is_file():assert exported.read_bytes()==data
                  else:
                      assert path=='.github/workflows/cloud-execution-bridge.yml'
                      missing.append(path)
          assert len(missing)==2
          pathlib.Path('evidence/source.json').write_text(json.dumps(first,indent=2))
          print('SOURCE_AGREEMENT='+json.dumps({'tree':first['candidate_tree'],'files':len(first['files']),'hidden_workflow_reconstructed_from_tested_hash':True}))
          PY
          cd "$RUNNER_TEMP/pinned-review"
          sha256sum -c SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/review-bin"
          tar -xJf pinned-review-tools.tar.xz -C "$RUNNER_TEMP/review-bin"
      - name: Record actual staged change impact before publication
        shell: bash
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/review-bin/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph.txt 2>&1
          git checkout -- AGENTS.md CLAUDE.md
          "$graph" detect-changes --scope staged > evidence/detect-changes.json
          python - <<'PY'
          import json,pathlib,subprocess
          data=json.loads(pathlib.Path('evidence/detect-changes.json').read_text())
          assert not data.get('error'),data
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='c67f14926b670c16b224e041423b522a19b74823'
          print('STAGED_REVIEW='+json.dumps(data)[:28000])
          PY
      - name: Establish continuation plan after prior resume found no checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/plan-input.json
          import json,os
          print(json.dumps({'feature_name':'cloud-execution-bridge','project_root':os.environ['GITHUB_WORKSPACE'],'spec_layout':'auto','description':'Continue Epic #32 and Issue #81 from exact verified cloud routing tree c67f14926b670c16b224e041423b522a19b74823. Preserve existing specifications; implement actual outbound Agent/native desktop approval, signed live projection, final local admission and real tool execution with durable no replay. Full Windows/Linux sandbox, Hooks, managed worktree, snapshot, deployment and complete-package requirements remain required. Never substitute the desktop-only prerelease. Physical workstation/VPS/real ChatGPT observations are deferred, not PASS. No main, production infrastructure or credential changes.'}))
          PY
          "$RUNNER_TEMP/review-bin/node_modules/.bin/mcp-probe-kit" exec start_feature --stdin < evidence/plan-input.json > evidence/continuation-plan.json
          python - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('evidence/continuation-plan.json').read_text())
          print('PLAN_RESULT='+json.dumps(data,ensure_ascii=False)[:50000])
          PY
      - name: Import exact source blobs only; do not update branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          first=json.loads(pathlib.Path('evidence/source.json').read_text());blobs={}
          for path,proof in first['files'].items():
              data=pathlib.Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==proof['sha256']
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:sha=json.load(r)['sha']
              assert sha==proof['git_blob'];blobs[path]=sha
          pathlib.Path('evidence/canonical-objects.json').write_text(json.dumps({'source':first,'blobs':blobs},indent=2))
          print('CANONICAL_OBJECTS='+json.dumps(blobs,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-verified-cloud-source-import
          path: evidence/
          retention-days: 30
          if-no-files-found: error
