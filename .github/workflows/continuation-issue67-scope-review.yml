name: Issue 67 exact scope review (never merge)

on:
  push:
    branches: ['ci/issue67-scope-review-20260924']
    paths:
      - '.github/workflows/continuation-issue67-scope-review.yml'
      - '.github/workflows/cloud-gateway-lab.yml'
      - 'tests/cloud-gateway/scope-guard.test.mjs'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7111c6658504cf93929e8260133e809466e841f0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Review exact candidate with pinned graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          "$graph" impact 'Function:tests/cloud-gateway/scope-guard.test.mjs:run' --direction upstream > evidence/pre-impact.json 2>&1 || true
          cat evidence/pre-impact.json
          git checkout "$GITHUB_SHA" -- .github/workflows/cloud-gateway-lab.yml tests/cloud-gateway/scope-guard.test.mjs
          git add -- .github/workflows/cloud-gateway-lab.yml tests/cloud-gateway/scope-guard.test.mjs
          git diff --cached --check
          git diff --cached | tee evidence/candidate.patch
          "$graph" detect-changes --scope staged > evidence/detect.json 2>&1 || true
          cat evidence/detect.json
          if grep -q 'No changes detected' evidence/detect.json; then
            echo 'GitNexus false-clean on staged candidate' >&2
            exit 1
          fi
          node --test tests/cloud-gateway/scope-guard.test.mjs 2>&1 | tee evidence/scope-guard.tap
          node --test tests/cloud-gateway/*.test.mjs 2>&1 | tee evidence/contracts.tap
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in ['.github/workflows/cloud-gateway-lab.yml','tests/cloud-gateway/scope-guard.test.mjs']:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse 7111c6658504cf93929e8260133e809466e841f0 > evidence/base-commit.txt
          echo NEVER_MERGE_HELPER_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue67-scope-review
          path: evidence/
          retention-days: 14
          if-no-files-found: error
