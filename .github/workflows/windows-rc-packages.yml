name: Windows RC package engineering (NOT FINAL)
on:
  push:
    branches: ['fix/linux-startup-platform', 'ci/preliminary-packages-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-rc-packages-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
  RC_VERSION: '0.6.0-rc.4'
jobs:
  windows:
    name: Build and install exact Windows RC
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - name: Preserve exact source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          shared-key: windows-rc-packages-v1
      - name: Required source and frontend prerequisites
        id: prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          python scripts/preliminary_package_contract_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Engineering failure-propagation contracts failed' }
          python scripts/rc_version_gate_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'RC version gate tests failed' }
          python scripts/rc_windows_install_contract_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'RC Windows isolation contract tests failed' }
          python scripts/exclusive_native_contract_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Native evidence contract tests failed' }
          python scripts/rc_version_gate.py --expect-version $env:RC_VERSION --expect-sha $env:GITHUB_SHA --output evidence/rc-source.json
          if ($LASTEXITCODE -ne 0) { throw 'RC source identity gate failed' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'frontend check failed' }
      - name: Required full Rust regression
        id: regression
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | Tee-Object -FilePath evidence/windows-rust-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows Rust regression failed' }
      - name: Unverified engineering NSIS build
        id: package_build
        if: always() && steps.prerequisites.outcome == 'success'
        shell: pwsh
        run: |
          npm run tauri -- build --ci --bundles nsis -- --locked 2>&1 | Tee-Object -FilePath evidence/windows-rc-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS RC build failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'tracked source changed during Windows build' }
      - name: Preserve unverified build bytes before installed acceptance
        id: build_receipt
        if: always() && steps.package_build.outcome == 'success'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/preliminary-windows-build"
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one built NSIS installer' }
          Copy-Item $installers[0].FullName $out
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source tree' }
          @{status='NOT_FINAL_NOT_PUBLISHABLE'; accepted=$false; publish_approved=$false;
            native_acceptance='NOT_EXECUTED'; source_sha=$env:GITHUB_SHA; source_tree=$tree;
            version=$env:RC_VERSION; run_id=$env:GITHUB_RUN_ID; filename=$installers[0].Name;
            sha256=(Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$out/engineering-build.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.build_receipt.outcome == 'success'
        with:
          name: NOT_FINAL-NOT_PUBLISHABLE-UNVERIFIED-windows-build-${{ github.sha }}
          path: ${{ runner.temp }}/preliminary-windows-build/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare exact native WebView2 driver
        id: driver
        if: always() && steps.package_build.outcome == 'success'
        shell: pwsh
        run: ./scripts/Windows原生驱动准备v8.ps1 -OutputDirectory "$env:RUNNER_TEMP/windows-rc-driver"
      - name: Standard-user installed OAuth, exclusive ownership, refresh and drain acceptance
        if: always() && steps.package_build.outcome == 'success' && steps.driver.outcome == 'success'
        shell: pwsh
        run: |
          ./scripts/rc_windows_install.ps1 -OutputDirectory "$env:RUNNER_TEMP/windows-rc-package" -Driver "$env:RUNNER_TEMP/windows-rc-driver/msedgedriver.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows RC installed acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NOT_FINAL-NOT_PUBLISHABLE-windows-rc-package-${{ github.sha }}
          path: ${{ runner.temp }}/windows-rc-package/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOT_FINAL-NOT_PUBLISHABLE-windows-rc-evidence-${{ github.sha }}
          path: |
            evidence/
            ${{ runner.temp }}/windows-rc-package/*.json
            ${{ runner.temp }}/windows-rc-package/*.png
            ${{ runner.temp }}/windows-rc-package/*.log
            ${{ runner.temp }}/windows-rc-driver/驱动来源v8.json
          if-no-files-found: error
          retention-days: 30
