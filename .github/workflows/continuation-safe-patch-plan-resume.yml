name: Safe patch plan resume (never merge)

on:
  push:
    branches: ['ci/safe-patch-plan-heartbeat-init-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-plan-resume.yml'

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/safe-patch-plan-heartbeat-init-20260924
          persist-credentials: false
          fetch-depth: 0
      - name: Resume delegated safe-patch plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -f .mcp-probe-kit/plans/feature-issue-68-safe-patch-steady-fb01dcf53f.json
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"feature-issue-68-safe-patch-steady-fb01dcf53f\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence/resume.json','utf8'));
          if(r.isError || r.structuredContent?.found !== true) process.exit(1);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-plan-resume
          path: evidence/
          retention-days: 14
          if-no-files-found: error
