name: Issue 62 listener port source scan (never merge)

on:
  push:
    branches: ['ci/issue62-port-scan-20260924']
    paths:
      - '.github/workflows/continuation-issue62-port-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
          persist-credentials: false
          fetch-depth: 0
      - name: Enumerate test listener and port allocation patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo '=== listener constructors ==='
            rg -n --glob '*.rs' 'spawn_listener_with_origin|spawn_listener_with_origin_and_execution_gate|bind_listener\(' src-tauri/src || true
            echo '=== port bind/allocation ==='
            rg -n --glob '*.rs' 'TcpListener::bind|TcpSocket|server_port|mcp_port|local_addr|process::id\(\)|12000|17001|17256' src-tauri/src || true
          } | tee evidence/port-scan.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-port-scan
          path: evidence/
          retention-days: 14
          if-no-files-found: error
