name: Cloud gateway authenticated agent channel
on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime']
    paths: ['services/cloud-gateway/**', '.github/workflows/cloud-gateway-channel.yml']
  pull_request:
    branches: [main]
    paths: ['services/cloud-gateway/**', '.github/workflows/cloud-gateway-channel.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-gateway-channel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Compile and verify portable proof contracts, not native deployment
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          rustc --version > evidence/toolchain.txt
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test channel_contracts 2>&1 | tee evidence/channel-pure.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-channel-portable-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Real isolated PostgreSQL and WebSocket contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p evidence
          cluster="$(mktemp -d "$RUNNER_TEMP/ctm-channel.XXXXXX")"
          port="$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          initdb -D "$cluster/data" -A trust -U channel_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$cluster/data" -l "$cluster/postgres.log" -o "-h 127.0.0.1 -p $port -k $cluster" -w start >/dev/null
          trap 'pg_ctl -D "$cluster/data" -m fast -w stop >/dev/null' EXIT
          createdb -h 127.0.0.1 -p "$port" -U channel_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://channel_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test channel_postgres --test channel_websocket 2>&1 | tee evidence/channel-transport.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          /usr/lib/postgresql/16/bin/postgres --version > evidence/postgres-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-channel-postgres-websocket
          path: evidence/
          retention-days: 14
          if-no-files-found: error
