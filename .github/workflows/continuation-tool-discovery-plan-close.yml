name: Tool discovery delegated Plan closure (never merge)

on:
  push:
    branches: ['ci/tool-discovery-plan-close-20260925']
    paths:
      - '.github/workflows/continuation-tool-discovery-plan-close.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: f4f93af9ee28aa209bb67643421725fcb22fb7e5
  CANDIDATE_SHA: 4a6360e624ce82cebb04423d531034c717721ff3
  PLAN_REF: 6d4ac051f686e1e61b65ba3951b1fe5b3ca26190
  PLAN_BRANCH: ci/tool-discovery-plan-init-20260925
  PLAN_ID: feature-issue-72-deferred-steady-057f3854d4
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-72-deferred-steady-057f3854d4.json

jobs:
  close-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify clean candidate bytes and materialize persisted Plan/spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .mcp-probe-kit/plans docs/specs/issue-72-deferred
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --check "$SOURCE_SHA" "$CANDIDATE_SHA"
          git diff --name-only "$SOURCE_SHA" "$CANDIDATE_SHA" | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          printf '%s  %s\n'             861c9df82b06bde1f067ce12e06309d10b98210eb6f48659d3896b7dc51486b4 services/local-agent/src/registry.rs             8dd3903a5b9d0a328e6814e73ded7e66d46c29be82f4e3844fc7364e87c8ad7a services/local-agent/src/registry_tests.rs             134c917e692ee4dc4bb11ec0f5ffdd638f843fab7d062a0d51c4fd8bf7169a70 services/local-agent/src/lib.rs             > evidence/expected-sha256.txt
          sha256sum -c evidence/expected-sha256.txt | tee evidence/hash-check.txt

          git fetch origin "$PLAN_REF"
          git show "$PLAN_REF:$PLAN_PATH" > "$PLAN_PATH"
          git ls-tree -r --name-only "$PLAN_REF" docs/specs/issue-72-deferred > evidence/spec-paths.txt
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            git show "$PLAN_REF:$path" > "$path"
          done < evidence/spec-paths.txt
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$CANDIDATE_SHA" > evidence/candidate-commit.txt

      - name: Install mcp-probe and resume at test step
        shell: bash
        run: |
          set -euo pipefail
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          {
            echo '/.mcp-probe-kit/'
            echo '/.cursor/rules/mcp-probe-kit.mdc'
            echo '/docs/specs/issue-72-deferred/'
            echo '/evidence/'
          } >> .git/info/exclude
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-test.json 2>&1
          cat evidence/resume-test.json
          node - <<'NODE'
          const r=require('./evidence/resume-test.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='test' || r.structuredContent?.mustContinue!==true) process.exit(2);
          NODE

      - name: Heartbeat exact tested candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/test-heartbeat-request.json
          import json, os
          candidate=os.environ["CANDIDATE_SHA"]
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["test"],
            "evidence":[
              {
                "kind":"implementation",
                "step_id":"implement",
                "summary":"Clean three-file production candidate is byte-identical to the successfully tested deferred-discovery source bytes.",
                "reference":"review/tool-discovery-production-candidate-20260925",
                "revision":candidate
              },
              {
                "kind":"test",
                "step_id":"test",
                "summary":"Run 36143732990 passed staged GitNexus LOW/non-false-clean, fmt, Clippy -D warnings, focused registry tests, full local-agent tests and cargo check on Windows 2025 and Ubuntu 24.04.",
                "reference":"GitHub Actions run 36143732990",
                "revision":candidate
              }
            ],
            "artifacts":[
              {
                "kind":"test",
                "summary":"Ubuntu 24.04 deferred discovery evidence",
                "reference":"artifact 10868701265 sha256:616801242d5dca5515e4ba90e1eac9272b3fc98fa629292600e0b16850a5c71a",
                "revision":candidate
              },
              {
                "kind":"test",
                "summary":"Windows 2025 deferred discovery evidence",
                "reference":"artifact 10868242361 sha256:e588525a73eca1ec809450028cbf06ae4666f5e4e24b4e69679d63117c931c98",
                "revision":candidate
              },
              {
                "kind":"impact",
                "summary":"Staged GitNexus LOW and exact source hashes",
                "reference":"artifact 10868546620 sha256:66e0f76b7e09b8294ce32a150327cd610c55b16d1e8123ec821be65ee6047fa5",
                "revision":candidate
              }
            ],
            "last_verified_revision":candidate
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/test-heartbeat-request.json > evidence/test-heartbeat.json 2>&1
          cat evidence/test-heartbeat.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-review.json 2>&1
          cat evidence/resume-review.json
          node - <<'NODE'
          const r=require('./evidence/resume-review.json');
          if(r.isError===true || r.structuredContent?.nextStepId!=='review' || r.structuredContent?.mustContinue!==true) process.exit(1);
          NODE

      - name: Run Plan-aware code review
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec code_review --json "{\"project_root\":\"$PWD\",\"focus\":\"all\",\"plan_id\":\"$PLAN_ID\",\"diff_mode\":\"range\",\"base_ref\":\"$SOURCE_SHA\",\"head_ref\":\"$CANDIDATE_SHA\"}" > evidence/code-review.json 2>&1
          cat evidence/code-review.json
          node - <<'NODE'
          const r=require('./evidence/code-review.json');
          if(r.isError===true) process.exit(1);
          const findings=[];
          function walk(v){
            if(!v) return;
            if(Array.isArray(v)){ for(const x of v) walk(x); return; }
            if(typeof v==='object'){
              if(typeof v.severity==='string' && typeof v.message==='string') findings.push(v);
              for(const x of Object.values(v)) walk(x);
            }
          }
          walk(r.structuredContent);
          const high=findings.filter(f=>['high','critical'].includes(String(f.severity).toLowerCase()));
          console.log(JSON.stringify({findingCount:findings.length,high},null,2));
          if(high.length) process.exit(2);
          NODE

      - name: Heartbeat review and converge Plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/review-heartbeat-request.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["review"],
            "evidence":[{
              "kind":"review",
              "step_id":"review",
              "summary":"Plan-aware code_review completed on the clean candidate with no HIGH/CRITICAL findings.",
              "reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "revision":os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision":os.environ["CANDIDATE_SHA"]
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/review-heartbeat-request.json > evidence/review-heartbeat.json 2>&1
          cat evidence/review-heartbeat.json
          ./.mcp-probe-kit/bin/probe exec converge --json "{\"plan_id\":\"$PLAN_ID\",\"project_root\":\"$PWD\",\"feature_name\":\"issue-72-deferred\",\"docs_dir\":\"docs\"}" > evidence/converge.json 2>&1
          cat evidence/converge.json
          node - <<'NODE'
          const r=require('./evidence/converge.json');
          if(r.isError===true || r.structuredContent?.passed!==true) process.exit(1);
          NODE
          cat "$PLAN_PATH" > evidence/final-plan.json

      - name: Persist converged Plan without overwriting another executor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PLAN_BRANCH"
          test "$(git rev-parse "origin/$PLAN_BRANCH")" = "$PLAN_REF"
          state="$RUNNER_TEMP/plan-state"
          git worktree add --detach "$state" "$PLAN_REF"
          mkdir -p "$state/$(dirname "$PLAN_PATH")"
          cp "$PLAN_PATH" "$state/$PLAN_PATH"
          git -C "$state" config user.name github-actions
          git -C "$state" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$state" add -f "$PLAN_PATH"
          git -C "$state" diff --cached --check
          git -C "$state" commit -m "chore(plan): converge deferred tool discovery"
          git -C "$state" push origin "HEAD:$PLAN_BRANCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-plan-closure
          path: evidence/
          retention-days: 14
          if-no-files-found: error
