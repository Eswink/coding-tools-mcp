name: Cloud gateway identity contracts
on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime']
    paths: ['services/cloud-gateway/**', 'deploy/cloud-gateway/**', 'tests/cloud-gateway-deployment/**', '.github/workflows/cloud-gateway-identity.yml']
  pull_request:
    branches: [main]
    paths: ['services/cloud-gateway/**', 'deploy/cloud-gateway/**', 'tests/cloud-gateway-deployment/**', '.github/workflows/cloud-gateway-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-gateway-identity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify portable boundaries (not installed desktop acceptance)
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          rustc --version > evidence/toolchain.txt
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test pure_contracts 2>&1 | tee evidence/pure-contracts.txt
          python -m unittest discover -s tests/cloud-gateway-deployment -v 2>&1 | tee evidence/deployment-contracts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-gateway-identity-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable test tools only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 nginx
          mkdir -p evidence
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 --output "$RUNNER_TEMP/compose"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64.sha256 --output "$RUNNER_TEMP/compose.sha256"
          test "$(awk '{print $1}' "$RUNNER_TEMP/compose.sha256")" = "$(sha256sum "$RUNNER_TEMP/compose" | awk '{print $1}')"
          chmod +x "$RUNNER_TEMP/compose"
          "$RUNNER_TEMP/compose" version > evidence/compose-version.txt
          /usr/lib/postgresql/16/bin/postgres --version > evidence/postgres-version.txt
          nginx -v 2> evidence/nginx-version.txt
      - name: Transactions, HTTP and independent process/database restart
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cluster="$(mktemp -d "$RUNNER_TEMP/ctm-identity.XXXXXX")"
          port="$(python -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          initdb -D "$cluster/data" -A trust -U gateway_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$cluster/data" -l "$cluster/postgres.log" -o "-h 127.0.0.1 -p $port -k $cluster" -w start >/dev/null
          trap 'pg_ctl -D "$cluster/data" -m fast -w stop >/dev/null' EXIT
          createdb -h 127.0.0.1 -p "$port" -U gateway_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://gateway_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee evidence/database-http-tests.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --example restart_probe
          python services/cloud-gateway/tests/run_restart_test.py --pg-bin /usr/lib/postgresql/16/bin --probe services/cloud-gateway/target/debug/examples/restart_probe | tee evidence/restart-test.json
          python tests/cloud-gateway-deployment/run_native_config_checks.py --compose "$RUNNER_TEMP/compose" --nginx /usr/sbin/nginx | tee evidence/native-config-test.json
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-gateway-identity-postgres
          path: evidence/
          retention-days: 14
          if-no-files-found: error
