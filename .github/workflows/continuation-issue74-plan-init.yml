name: Issue 74 delegated bugfix plan init (never merge)

on:
  push:
    branches: ['ci/issue74-plan-init-20260926']
    paths:
      - '.github/workflows/continuation-issue74-plan-init.yml'

permissions:
  contents: write

jobs:
  init-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Start bugfix and persist first heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/start-request.json
          import json, os
          print(json.dumps({
            "error_message": "Issue #74: current feature 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd fails Windows release-candidate run 36154924658, job 108137017396. The only failing test is auth::chat_http_tests::offline_new_authorization_is_a_non_oauth_tool_error_and_resumes_cleanly. It reserves a dynamic port with TcpListener::bind(127.0.0.1:0), reads the port, drops the reservation, then starts MCP listener on that port; Windows bind failed with WSAEADDRINUSE 10048 on port 64506. Ubuntu passed. Prove the reserve-drop-rebind TOCTOU and implement the smallest deterministic test/listener fixture correction without weakening auth/origin semantics or production port-conflict behavior.",
            "code_context": "Current source 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd. Failure source src-tauri/src/auth/聊天HTTP回归v1.rs around line 74. Exact Windows job 108137017396. Do not edit production listener until fresh GitNexus impact and root-cause worksheet close. Preserve semantic assertions and listener shutdown. Candidate must pass repeated exact Windows test plus full Windows/Ubuntu suites and official RC.",
            "project_root": os.getcwd(),
            "docs_dir": "docs",
            "analysis_mode": "src8",
            "template_profile": "strict",
            "requirements_mode": "steady"
          }, ensure_ascii=False))
          PY
          ./.mcp-probe-kit/bin/probe exec start_bugfix --stdin < evidence/start-request.json > evidence/start-bugfix.json 2>&1
          cat evidence/start-bugfix.json
          node - <<'NODE'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('evidence/start-bugfix.json','utf8'));
          if(root.isError===true) process.exit(1);
          let plan=null;
          function walk(v){
            if(plan || !v) return;
            if(Array.isArray(v)){ for(const x of v) walk(x); return; }
            if(typeof v==='object'){
              if(typeof v.planId==='string' && Array.isArray(v.steps)){ plan=v; return; }
              for(const x of Object.values(v)) walk(x);
            }
          }
          walk(root.structuredContent);
          if(!plan) throw new Error('delegated plan not found');
          fs.writeFileSync('evidence/plan.json',JSON.stringify(plan,null,2));
          const req={
            plan_id: plan.planId,
            project_root: process.cwd(),
            plan,
            completed_step_ids: [],
            unresolved_items: [],
            evidence: [],
            last_verified_revision: process.env.GITHUB_SHA
          };
          fs.writeFileSync('evidence/heartbeat-request.json',JSON.stringify(req));
          fs.writeFileSync('evidence/plan-id.txt',plan.planId+'\n');
          NODE
          plan_id="$(cat evidence/plan-id.txt)"
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$plan_id\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          plan_path=".mcp-probe-kit/plans/$plan_id.json"
          test -f "$plan_path"
          cp "$plan_path" evidence/persisted-plan.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$plan_path"
          git diff --cached --check
          git commit -m "chore(plan): initialize issue74 bugfix"
          git fetch origin "ci/issue74-plan-init-20260926"
          test "$(git rev-parse "origin/ci/issue74-plan-init-20260926")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue74-plan-init-20260926"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-plan-init
          path: evidence/
          retention-days: 14
          if-no-files-found: error
