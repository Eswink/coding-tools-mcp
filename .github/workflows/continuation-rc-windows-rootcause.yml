name: Isolated RC Windows root-cause review (never merge)

on:
  push:
    branches: ['ci/rc-windows-rootcause-20260923']
    paths: ['.github/workflows/continuation-rc-windows-rootcause.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuation-rc-windows-rootcause-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resume repository plan before source impact analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [[ ! -x ./.mcp-probe-kit/bin/probe ]]; then
            npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/probe-install.txt 2>&1
          fi
          printf '{"project_root":"%s"}\n' "$GITHUB_WORKSPACE" | ./.mcp-probe-kit/bin/probe exec resume_plan --stdin > evidence/resume-plan.json 2>&1 || true
          git reset --hard HEAD
          git clean -fd -- .mcp-probe-kit 2>/dev/null || true
          git status --short > evidence/post-resume-status.txt
      - name: Pinned GitNexus exact production blast radius
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph-analyze.txt 2>&1
          # Analyze may refresh tracked skill docs. Never allow generated docs into a proposal.
          git reset --hard HEAD
          "$graph" query 'async retained task durable checkpoint before exec_command process spawn session' > evidence/runtime-query.json 2>&1 || true
          run_uid='Function:src-tauri/src/tools/异步命令v1.rs:run'
          start_uid='Function:src-tauri/src/tools/异步命令v1.rs:start'
          "$graph" context "$run_uid" > evidence/run-context.json 2>&1
          "$graph" impact "$run_uid" --direction upstream > evidence/run-impact.json 2>&1
          "$graph" context "$start_uid" > evidence/start-context.json 2>&1
          "$graph" impact "$start_uid" --direction upstream > evidence/start-impact.json 2>&1
          cat evidence/run-context.json evidence/run-impact.json evidence/start-context.json evidence/start-impact.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('run-impact.json','start-impact.json'):
              data=json.loads(Path('evidence',name).read_text(encoding='utf-8'))
              assert data.get('epistemic') == 'exact', data
              assert data.get('risk') in {'LOW','MEDIUM'}, data
              assert data.get('target',{}).get('filePath') == 'src-tauri/src/tools/异步命令v1.rs', data
          PY
          git status --short > evidence/post-graph-status.txt
          git diff --exit-code
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          printf '%s\n' 'READ_ONLY_IMPACT_HELPER_NEVER_MERGE_NOT_A_RELEASE_GATE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-production-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
