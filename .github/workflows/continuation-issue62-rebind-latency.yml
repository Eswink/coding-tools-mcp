name: Issue 62 rebind release latency diagnostic (never merge)
on:
  push:
    branches: ['ci/issue62-rebind-latency-20260924']
    paths:
      - 'src-tauri/src/tools/任务恢复传输v2.rs'
      - '.github/workflows/continuation-issue62-rebind-latency.yml'
permissions:
  contents: read
env:
  SOURCE_SHA: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Review failure-path latency instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          target='Function:src-tauri/src/tools/任务恢复传输v2.rs:listener_restart_keeps_the_running_job_and_its_idempotency_key'
          "$graph" impact "$target" --direction upstream > evidence/impact.txt 2>&1 || true
          git checkout "$GITHUB_SHA" -- src-tauri/src/tools/任务恢复传输v2.rs
          git add src-tauri/src/tools/任务恢复传输v2.rs
          git diff --cached --check
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/impact.txt evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          echo NEVER_MERGE_DIAGNOSTIC_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-rebind-latency-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git checkout "$GITHUB_SHA" -- src-tauri/src/tools/任务恢复传输v2.rs
          git diff --check
      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Repeat concurrent full suites and measure first-rebind failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          suite_failures=0
          for i in {1..20}; do
            set +e
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --nocapture 2>&1 | tee "evidence/full-$i.txt"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then suite_failures=$((suite_failures+1)); fi
          done
          grep -h '\[issue62-latency\]' evidence/full-*.txt > evidence/rebind-latency.txt || true
          initial_failures=$(grep -c 'initial_rebind=failure' evidence/rebind-latency.txt || true)
          echo "suite_failures=$suite_failures" | tee evidence/result.txt
          echo "initial_rebind_failures=$initial_failures" | tee -a evidence/result.txt
          cat evidence/rebind-latency.txt
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          test "$initial_failures" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-rebind-latency-ubuntu-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
