name: Issue 62 lifecycle architecture assess (never merge)
on:
  push:
    branches: ['ci/issue62-architecture-assess-20260924']
    paths:
      - '.github/workflows/continuation-issue62-architecture-assess.yml'
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
          persist-credentials: false
          fetch-depth: 0
      - name: Run ARC-8 assessment with verified evidence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/request.json
          import json, os
          payload={
            "mode":"assess",
            "project_root":os.getcwd(),
            "description":"Assess the safest architecture boundary for issue #62: on Ubuntu 24.04, stop.send() plus JoinHandle.await can be followed by a 15-36 ms kernel-visible LISTEN tail on the same loopback port, causing immediate same-port restart EADDRINUSE. Determine whether the contract should be repaired at listener lifecycle completion, ownership/handoff, or test/runtime boundary without arbitrary sleeps, blind rebind retries, relaxed assertions, auth/origin changes, or broad socket-policy changes.",
            "scope":[
              "src-tauri/src/mcp/listener.rs",
              "src-tauri/src/tools/任务恢复传输v2.rs",
              "MCP local listener shutdown/restart contract"
            ],
            "constraints":[
              "GitNexus 1.6.12 reports mcp::listener::serve and bind_listener as CRITICAL/exact; no production edit is authorized by this assessment.",
              "The same-port restart assertion and idempotency behavior must remain strict.",
              "Do not prescribe arbitrary sleeps or unbounded rebind retries.",
              "Do not weaken local auth, origin, loopback binding, or occupied-port rejection.",
              "Windows listener semantics must remain unchanged unless separately proven necessary."
            ],
            "non_goals":[
              "Implementing code changes",
              "Declaring #62 resolved",
              "Changing native PTY work",
              "Release authorization"
            ],
            "protected_invariants":[
              "Loopback-only listener binding",
              "Same-port restart after completed shutdown is deterministic",
              "Occupied-port conflicts remain synchronous and explicit",
              "No auth/origin broadening",
              "No hidden retry that masks lifecycle completion semantics"
            ],
            "current_facts":[
              {
                "statement":"Official current-source run 35900720966 reproduced Ubuntu EADDRINUSE in listener_restart_keeps_the_running_job_and_its_idempotency_key after stop.send() and handle.await; Windows passed.",
                "classification":"fact",
                "evidence":["Issue #62 comment 5800384657","Ubuntu artifact 10768823041 sha256:05d82534c003a876148a697407c27b02fb02a73e2383d4e20d9d0f02d9ad3ff0"]
              },
              {
                "statement":"Never-merge close-lag run 35951904056 reproduced the target in all three Ubuntu replicas and measured exact 127.0.0.1:<port> LISTEN visibility clearing roughly 15-36 ms after the failed immediate rebind.",
                "classification":"fact",
                "evidence":["Issue #62 comment 5807317900","artifacts 10788503881,10789201391,10789555537"]
              },
              {
                "statement":"Standard Linux ephemeral allocator range on the sampled runner was 32768-60999; 512 bind(127.0.0.1:0) samples did not allocate in the test's 12000-19999 range.",
                "classification":"fact",
                "evidence":["run 35951528446","artifact 10789205016 sha256:604e061e128727bc547b863051817e78b33d2745f8b0267ed7113278b3c89e45"]
              },
              {
                "statement":"Source scan found the recovery test is the only current test using the PID-derived 12000-19999 range; most listener tests use port 0.",
                "classification":"fact",
                "evidence":["run 35947380359","artifact 10786734967 sha256:dd7acc9e9a24b7d875d40111c5c4709b7f9a0fae282ccaa70e138a56002fbb29"]
              },
              {
                "statement":"Axum 0.8 serve graceful-shutdown implementation drops the listener after leaving the accept loop before waiting connection tasks, so the measured tail is not evidence that application code intentionally keeps the listener object after serve completion.",
                "classification":"inference",
                "evidence":["Axum 0.8 serve source previously reviewed; issue comment close-lag evidence"]
              },
              {
                "statement":"The architecture must explain why JoinHandle completion is observable before immediate same-port bind becomes consistently available on Linux.",
                "classification":"unknown",
                "evidence":[]
              }
            ],
            "runtime_evidence":[
              "GitNexus serve impact run 35953027211: CRITICAL/exact; artifact 10789257450 sha256:0cf5c7b650459b314fecd995846eccbd0d0e9bf431e36cff7e8728c3f5776f74",
              "bind_listener prior impact CRITICAL/exact: 24 impacted, 8 processes, 5 modules",
              "close-lag run 35951904056: 3/3 Ubuntu target reproductions; measured tail 15-36 ms"
            ],
            "collect_evidence":False,
            "save_to_docs":False
          }
          print(json.dumps(payload,ensure_ascii=False,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec architecture --stdin < evidence/request.json > evidence/architecture.json 2>&1
          cat evidence/architecture.json
          node - <<'NODE'
          const r=require('./evidence/architecture.json');
          if(r.isError===true) process.exit(1);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-architecture-assess
          path: evidence/
          retention-days: 14
          if-no-files-found: error
