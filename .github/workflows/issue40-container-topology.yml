name: Issue40 runnable nonproduction container topology
on:
  push:
    branches: ['ci/issue40-container-topology']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: issue40-topology-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '3'
jobs:
  topology:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud-gateway
          cache-targets: false
      - name: Strict renderer contracts and shipped bootstrap prerequisite
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue40-evidence"
          test -f services/cloud-gateway/tests/run_enrollment_process.py
          python -m unittest discover -s tests/cloud-gateway-deployment -p 'test_*.py'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exact audited product build and official Compose2.27 tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev curl ca-certificates
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/audit-tools"
          python scripts/exact_build_audit_tests.py
          export CARGO_TARGET_DIR="$RUNNER_TEMP/issue85-target"
          VERSION=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          python scripts/exact_build_audit.py collect \
            --root "$GITHUB_WORKSPACE" --expected-sha "$GITHUB_SHA" --version "$VERSION" \
            --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/exact-cloud-audit" \
            --audit-bin "$RUNNER_TEMP/audit-tools/bin/cargo-audit" \
            --audit-db "$RUNNER_TEMP/advisory-db" --clone-advisory-db
          mkdir -p "$RUNNER_TEMP/topology-tools"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 --output "$RUNNER_TEMP/topology-tools/compose"
          curl --fail --location --retry 2 https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64.sha256 --output "$RUNNER_TEMP/issue40-evidence/compose.sha256"
          test "$(sha256sum "$RUNNER_TEMP/topology-tools/compose" | awk '{print $1}')" = "$(awk '{print $1}' "$RUNNER_TEMP/issue40-evidence/compose.sha256")"
          chmod +x "$RUNNER_TEMP/topology-tools/compose"
      - name: Build non-root engineering image from exact four binaries
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/topology-image-context"
          mkdir -p "$context/bin"
          for name in coding-tools-gateway coding-tools-agent coding-tools-control-gateway coding-tools-mcp-gateway; do
            cp "$RUNNER_TEMP/issue85-target/x86_64-unknown-linux-gnu/release/$name" "$context/bin/$name"
          done
          cp deploy/cloud-gateway/Dockerfile.runtime "$context/Dockerfile"
          cp docs/releases/issue40-topology.md "$context/README.md"
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tomllib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'topology-image-context')
          version=tomllib.loads(pathlib.Path('services/cloud-gateway/Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'[0-9A-Za-z.+-]+',version)
          value={'source_sha':os.environ['GITHUB_SHA'],'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'component_version':version,'engineering_only':True,'binaries':{b.name:hashlib.sha256(b.read_bytes()).hexdigest() for b in (p/'bin').iterdir()}}
          audit=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'exact-cloud-audit','summary.json').read_text())
          assert audit['sha']==value['source_sha'] and audit['tree']==value['source_tree']
          assert audit['exact_build_audit']=='passed' and audit['binary_sha256']==value['binaries']
          value['exact_build_audit_envelope_sha256']=audit['envelope_sha256']
          (p/'manifest.json').write_text(json.dumps(value,indent=2)+'\n')
          pathlib.Path(os.environ['RUNNER_TEMP'],'issue40-evidence','source-binaries.json').write_text(json.dumps(value,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GATEWAY_VERSION='+version+'\n')
          PY
          docker pull --platform linux/amd64 ubuntu:22.04
          docker pull --platform linux/amd64 postgres:16-bookworm
          docker pull --platform linux/amd64 nginx:stable-alpine
          base=$(docker image inspect ubuntu:22.04 --format '{{index .RepoDigests 0}}')
          postgres=$(docker image inspect postgres:16-bookworm --format '{{index .RepoDigests 0}}')
          ingress=$(docker image inspect nginx:stable-alpine --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$base" | grep -Eq '^ubuntu@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$postgres" | grep -Eq '^postgres@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$ingress" | grep -Eq '^nginx@sha256:[0-9a-f]{64}$'
          version=$(python -c "import tomllib; print(tomllib.load(open('services/cloud-gateway/Cargo.toml','rb'))['package']['version'])")
          docker build --build-arg "BASE_IMAGE=$base" --build-arg "SOURCE_SHA=$GITHUB_SHA" --build-arg "PRODUCT_VERSION=$version" --iidfile "$RUNNER_TEMP/issue40-evidence/gateway-image-id.txt" "$context"
          printf 'POSTGRES_IMAGE=%s\nINGRESS_IMAGE=%s\nGATEWAY_IMAGE=%s\n' "$postgres" "$ingress" "$(cat "$RUNNER_TEMP/issue40-evidence/gateway-image-id.txt")" >> "$GITHUB_ENV"
          printf '%s\n%s\n%s\n' "$base" "$postgres" "$ingress" > "$RUNNER_TEMP/issue40-evidence/runtime-image-digests.txt"
      - name: Actual private topology from empty through revocation and shutdown
        run: |
          set -euo pipefail
          python tests/cloud-gateway-deployment/run_container_topology.py --compose "$RUNNER_TEMP/topology-tools/compose" --gateway-image "$GATEWAY_IMAGE" --ingress-image "$INGRESS_IMAGE" --postgres-image "$POSTGRES_IMAGE" --output "$RUNNER_TEMP/issue40-evidence/topology.json" | tee "$RUNNER_TEMP/issue40-evidence/topology-summary.json"
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue40-container-topology
          path: |
            ${{ runner.temp }}/issue40-evidence/
            ${{ runner.temp }}/exact-cloud-audit/
          if-no-files-found: error
          retention-days: 30
