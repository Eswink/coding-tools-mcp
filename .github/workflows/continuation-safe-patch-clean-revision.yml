name: Safe patch clean revision checkpoint (never merge)

on:
  push:
    branches: ['ci/safe-patch-plan-heartbeat-init-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-clean-revision.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-68-safe-patch-steady-fb01dcf53f
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-68-safe-patch-steady-fb01dcf53f.json
  CLEAN_SHA: c177357aca6d7f428d558d4994682b183faef39e
  TESTED_SHA: 784ef80374dc9ee896cd12a457d4bd3ce0365a80

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Record exact-blob clean revision evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          git fetch origin "$CLEAN_SHA" "$TESTED_SHA"
          for path in             src-tauri/src/tools/patch.rs             src-tauri/src/tools/patch_transaction.rs             src-tauri/src/tools/patch_transaction_tests.rs
          do
            tested="$(git rev-parse "$TESTED_SHA:$path")"
            clean="$(git rev-parse "$CLEAN_SHA:$path")"
            printf '%s tested=%s clean=%s\n' "$path" "$tested" "$clean" | tee -a evidence/blob-equality.txt
            test "$tested" = "$clean"
          done
          python - <<'PY' > evidence/heartbeat-request.json
          import json, os
          clean=os.environ["CLEAN_SHA"]
          tested=os.environ["TESTED_SHA"]
          files=[
            "src-tauri/src/tools/patch.rs",
            "src-tauri/src/tools/patch_transaction.rs",
            "src-tauri/src/tools/patch_transaction_tests.rs",
          ]
          payload={
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","write-spec","check-spec","estimate","implement","test"],
            "declared_scope":{
              "projectRoot":os.getcwd(),
              "docsDir":"docs",
              "featureName":"issue-68-safe-patch",
              "specLayout":"flat",
              "files":files
            },
            "evidence":[
              {
                "kind":"implementation",
                "step_id":"implement",
                "summary":"Clean production candidate c177357a contains exactly the three scoped production/test files and is one commit ahead of the feature base.",
                "reference":"review/safe-patch-production-candidate-20260924",
                "revision":clean
              },
              {
                "kind":"test",
                "step_id":"test",
                "summary":"The three clean-candidate Git blobs are byte-identical to tested candidate 784ef803; run 35953377131 therefore validates the exact production bytes on Windows 2025 and Ubuntu 24.04.",
                "reference":"GitHub Actions run 35953377131; blob equality recorded by safe-patch clean revision checkpoint",
                "revision":clean
              }
            ],
            "runtime_evidence":[
              {
                "kind":"blob-equivalence",
                "summary":"patch.rs blob ebb6108a5088c15a9abf30cd7446de897ca95d74; patch_transaction.rs c1c74be8e4c8f3be0f44f7a1c96f4103e59e13f4; patch_transaction_tests.rs 649aff13a5e2412f996cb868df143a910bd21092 are identical between tested and clean candidate.",
                "reference":"evidence/blob-equality.txt",
                "revision":clean
              }
            ],
            "last_verified_revision":clean
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          cat "$PLAN_PATH" > evidence/plan-after.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.PLAN_PATH,'utf8'));
          if(p.lastVerifiedRevision!==process.env.CLEAN_SHA) process.exit(1);
          if(!Array.isArray(p.declaredScope?.files) || p.declaredScope.files.length!==3) process.exit(2);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): bind safe-patch clean candidate revision"
          git fetch origin "ci/safe-patch-plan-heartbeat-init-20260924"
          test "$(git rev-parse "origin/ci/safe-patch-plan-heartbeat-init-20260924")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/safe-patch-plan-heartbeat-init-20260924"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-clean-revision
          path: evidence/
          retention-days: 14
          if-no-files-found: error
