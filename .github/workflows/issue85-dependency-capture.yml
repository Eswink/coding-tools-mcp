name: Issue85 engineering dependency capture integrity
on:
  push:
    branches: ['ci/issue85-dependency-capture-20261001']
permissions:
  contents: read
concurrency:
  group: issue85-dependency-capture-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
jobs:
  capture:
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/ci/issue85-dependency-capture-20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      receipt_sha256: ${{ steps.collect.outputs.receipt_sha256 }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retain exact source before tool installation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/dependency-evidence/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/dependency-evidence/source-tree.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Install exact audit tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/audit-tools" 2>&1 | tee "$RUNNER_TEMP/dependency-evidence/audit-install.txt"
      - name: Verify deterministic capture contracts
        shell: bash
        run: |
          set -euo pipefail
          for suite in engineering_dependency_capture release_dependency_capture release_dependency_contract exact_build_audit; do
            python "scripts/${suite}_tests.py" 2>&1 | tee "$RUNNER_TEMP/dependency-evidence/${suite}-tests.txt"
          done
      - name: Capture live four-lock audit and GLib provenance
        id: collect
        env:
          VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/engineering_dependency_capture.py collect --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/dependency-evidence/capture" --expected-sha "$GITHUB_SHA" --version "$VERSION" \
            --audit-bin "$RUNNER_TEMP/audit-tools/bin/cargo-audit" --audit-db "$RUNNER_TEMP/dependency-advisory-db" \
            > "$RUNNER_TEMP/dependency-evidence/integrity.json"
          printf 'receipt_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/dependency-evidence/capture/engineering-receipt.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain final clean-source result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-evidence"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/dependency-evidence/final-source-status.txt"
          test ! -s "$RUNNER_TEMP/dependency-evidence/final-source-status.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue85-dependency-capture
          path: ${{ runner.temp }}/dependency-evidence/capture/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue85-dependency-diagnostics
          path: |
            ${{ runner.temp }}/dependency-evidence/*.txt
            ${{ runner.temp }}/dependency-evidence/*.json
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: capture
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/ci/issue85-dependency-capture-20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue85-dependency-capture
          path: ${{ runner.temp }}/dependency-evidence/capture
      - name: Independently verify exact producer and downloaded evidence
        env:
          VERSION: ${{ needs.capture.outputs.version }}
          RECEIPT_SHA256: ${{ needs.capture.outputs.receipt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/engineering_dependency_capture.py verify --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/dependency-evidence/capture" --expected-sha "$GITHUB_SHA" --version "$VERSION" \
            --expected-receipt-sha256 "$RECEIPT_SHA256" > "$RUNNER_TEMP/dependency-verification.json" \
            2> "$RUNNER_TEMP/dependency-verification.stderr"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue85-dependency-verification
          path: |
            ${{ runner.temp }}/dependency-verification.json
            ${{ runner.temp }}/dependency-verification.stderr
          if-no-files-found: error
          retention-days: 30
