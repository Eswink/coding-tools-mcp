name: MCP business exact-source verification
on:
  push:
    branches: ['ci/mcp-business-r10']
    paths:
      - '.source-recovery-r10/**'
      - '.github/workflows/mcp-business-source-r10.yml'
permissions:
  contents: write
concurrency:
  group: mcp-business-source-r10
  cancel-in-progress: true
jobs:
  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Reconstruct reviewed candidate
        shell: bash
        env:
          BASE: '8836fd1da266cea5729c4dcb6a4f1d5d70ac8a90'
          XZ_SHA: 'dc1d253154efc7108152153be48714c32c10c7a0cba9b74015f8e6c8c461fca1'
          PATCH_SHA: '9e69affc1dd5f9bd3136870c2462d4ab532383d8436d869d8502e4a192a2f616'
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/mcp-r10"
          cat .source-recovery-r10/v2-part-*.txt | base64 -d > "$RUNNER_TEMP/mcp-r10/change.patch.xz"
          echo "$XZ_SHA  $RUNNER_TEMP/mcp-r10/change.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/mcp-r10/change.patch.xz" > "$RUNNER_TEMP/mcp-r10/change.patch"
          echo "$PATCH_SHA  $RUNNER_TEMP/mcp-r10/change.patch" | sha256sum -c -
          git checkout --detach "$BASE"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/mcp-r10/change.patch"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('services/cloud-gateway/tests/mcp_postgres.rs')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(\\bheader\\s*,\\s*)HeaderMap\\s*,\\s*', r'\\1', s)
          assert 'HeaderMap' not in s, [line for line in s.splitlines() if 'HeaderMap' in line]
          s=s.replace('mod channel_support;', '#[allow(dead_code)]\nmod channel_support;')
          s=s.replace('mod projection_support;', '#[allow(dead_code)]\nmod projection_support;')
          p.write_text(s, encoding='utf-8')
          PY
          git add -- services/cloud-gateway/tests/mcp_postgres.rs
          git diff --cached --check
          git diff --cached --name-only > evidence/changed-files.txt
          test "$(wc -l < evidence/changed-files.txt)" -eq 14
          git write-tree > evidence/verified-tree.txt
      - name: Rust and PostgreSQL gates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pgroot="$RUNNER_TEMP/pg-mcp-r10"
          mkdir -p "$pgroot"
          port="$(python3 - <<'PY'
          import socket
          s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()
          PY
          )"
          initdb -D "$pgroot/data" -A trust -U mcp_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$pgroot/data" -l "$pgroot/postgres.log" -o "-h 127.0.0.1 -p $port -k $pgroot" -w start >/dev/null
          trap 'pg_ctl -D "$pgroot/data" -m fast -w stop >/dev/null || true' EXIT
          createdb -h 127.0.0.1 -p "$port" -U mcp_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://mcp_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo fmt --manifest-path services/cloud-gateway/Cargo.toml
          git add -- services/cloud-gateway
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          git diff --cached --check
          git write-tree > evidence/verified-tree.txt
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib 2>&1 | tee evidence/lib-tests.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_service_contracts 2>&1 | tee evidence/service-tests.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_postgres -- --test-threads=1 2>&1 | tee evidence/mcp-postgres.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test admission_postgres -- --test-threads=1 2>&1 | tee evidence/admission-regression.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bin coding-tools-mcp-gateway
      - name: Import verified source blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo='Eswink/coding-tools-mcp'
          token=os.environ['GH_TOKEN']
          paths=pathlib.Path('evidence/changed-files.txt').read_text().splitlines()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          rows=[]
          for p in paths:
              raw=pathlib.Path(p).read_bytes()
              expected=git('hash-object',p)
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
                  method='POST')
              with urllib.request.urlopen(req,timeout=60) as r: got=json.load(r)
              assert got['sha']==expected,(p,expected,got.get('sha'))
              rows.append({'path':p,'mode':git('ls-files','-s','--',p).split()[0],'sha':expected})
          pathlib.Path('evidence/blob-receipt.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-business-source-r10
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Reconstruct and compile portable contracts
        env:
          BASE: '8836fd1da266cea5729c4dcb6a4f1d5d70ac8a90'
          XZ_SHA: 'dc1d253154efc7108152153be48714c32c10c7a0cba9b74015f8e6c8c461fca1'
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/mcp-r10"
          cat .source-recovery-r10/v2-part-*.txt | base64 -d > "$RUNNER_TEMP/mcp-r10/change.patch.xz"
          echo "$XZ_SHA  $RUNNER_TEMP/mcp-r10/change.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/mcp-r10/change.patch.xz" > "$RUNNER_TEMP/mcp-r10/change.patch"
          git checkout --detach "$BASE"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/mcp-r10/change.patch"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('services/cloud-gateway/tests/mcp_postgres.rs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('http::{header, HeaderMap, Request, StatusCode}', 'http::{header, Request, StatusCode}')
          s=s.replace('mod channel_support;', '#[allow(dead_code)]\nmod channel_support;')
          s=s.replace('mod projection_support;', '#[allow(dead_code)]\nmod projection_support;')
          p.write_text(s, encoding='utf-8')
          PY
          git add -- services/cloud-gateway/tests/mcp_postgres.rs
          cargo fmt --manifest-path services/cloud-gateway/Cargo.toml
          git add -- services/cloud-gateway
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          git diff --cached --check
          git write-tree > evidence/verified-tree.txt
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib 2>&1 | tee evidence/lib-tests.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_service_contracts 2>&1 | tee evidence/service-tests.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bin coding-tools-mcp-gateway
          git write-tree > evidence/verified-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-business-windows-r10
          path: evidence/
          retention-days: 14
          if-no-files-found: error
