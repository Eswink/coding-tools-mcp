name: Issue 62 listener syscall trace (never merge)
on:
  push:
    branches: ['ci/issue62-syscall-trace-20260924']
    paths:
      - '.github/workflows/continuation-issue62-syscall-trace.yml'
permissions:
  contents: read
env:
  SOURCE_SHA: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native dependencies and strace
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config strace
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Trace full-suite listener close/bind ordering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/trace
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          target_failures=0
          eaddr=0
          for i in {1..12}; do
            rm -f evidence/trace/trace.*
            set +e
            strace -ff -ttt -s 160               -e trace=socket,setsockopt,bind,listen,close,dup,dup2,dup3               -o evidence/trace/trace               cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --nocapture               > "evidence/full-$i.txt" 2>&1
            code=$?
            set -e
            if grep -q 'listener_restart_keeps_the_running_job_and_its_idempotency_key ... FAILED' "evidence/full-$i.txt"; then
              target_failures=$((target_failures+1))
              grep -H -n -B 20 -A 20 'EADDRINUSE' evidence/trace/trace.*                 > "evidence/eaddr-$i.txt" || true
              if test -s "evidence/eaddr-$i.txt"; then eaddr=$((eaddr+1)); fi
              cp evidence/trace/trace.* "evidence/" 2>/dev/null || true
              break
            fi
            if [ "$code" -ne 0 ]; then
              echo "non_target_suite_failure_iteration=$i" >> evidence/result.txt
            fi
          done
          echo "target_failures=$target_failures" | tee -a evidence/result.txt
          echo "eaddr_trace_groups=$eaddr" | tee -a evidence/result.txt
          if [ "$target_failures" -gt 0 ]; then
            cat evidence/eaddr-*.txt || true
          fi
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          test "$target_failures" -gt 0
          test "$eaddr" -gt 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-syscall-trace-ubuntu-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
