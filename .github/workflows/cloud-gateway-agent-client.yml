name: Cloud gateway outbound Agent client
on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime']
    paths: ['services/cloud-gateway/**', '.github/workflows/cloud-gateway-agent-client.yml']
  pull_request:
    branches: [main]
    paths: ['services/cloud-gateway/**', '.github/workflows/cloud-gateway-agent-client.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-agent-client-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Native compilation and protected client contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          rustc --version > evidence/toolchain.txt
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib 2>&1 | tee evidence/agent-pure.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bins
          services/cloud-gateway/target/debug/coding-tools-agent --help > evidence/agent-help.txt
          services/cloud-gateway/target/debug/coding-tools-control-gateway --help > evidence/control-help.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-client-portable-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  wss-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Real TLS and independent Agent and gateway processes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          mkdir -p evidence
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bins --example agent_fixture
          python services/cloud-gateway/tests/run_agent_process.py --pg-bin /usr/lib/postgresql/16/bin --bin-dir services/cloud-gateway/target/debug | tee evidence/agent-wss-process.json
          python services/cloud-gateway/tests/run_service_http.py --pg-bin /usr/lib/postgresql/16/bin --binary services/cloud-gateway/target/debug/coding-tools-gateway | tee evidence/service-http.json
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          openssl version > evidence/openssl.txt
          /usr/lib/postgresql/16/bin/postgres --version > evidence/postgres.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-client-real-wss-process
          path: evidence/
          retention-days: 14
          if-no-files-found: error
