name: Agent channel dependency preparation
on:
  push:
    branches: ['ci/agent-channel-deps-r6']
    paths: ['.github/workflows/agent-channel-deps-r6.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Fetch public dependencies only; do not run product or change refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/channel/src" evidence
          cp services/cloud-gateway/Cargo.toml "$RUNNER_TEMP/channel/Cargo.toml"
          cp services/cloud-gateway/Cargo.lock "$RUNNER_TEMP/channel/Cargo.lock"
          python3 - "$RUNNER_TEMP/channel/Cargo.toml" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text()
          s=s.replace('features = ["form"]','features = ["form", "ws"]')
          s=s.replace('[dev-dependencies]','[dev-dependencies]\ntokio-tungstenite = { version = "=0.26.2", features = ["rustls-tls-webpki-roots"] }\nfutures-util = "=0.3.34"')
          p.write_text(s)
          PY
          printf 'fn main() {}\n' > "$RUNNER_TEMP/channel/src/main.rs"
          cargo generate-lockfile --offline --manifest-path "$RUNNER_TEMP/channel/Cargo.toml" 2>/dev/null || cargo generate-lockfile --manifest-path "$RUNNER_TEMP/channel/Cargo.toml"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/channel/Cargo.toml"
          cp "$RUNNER_TEMP/channel/Cargo.lock" evidence/Cargo.lock
          cp "$RUNNER_TEMP/channel/Cargo.toml" evidence/dependency-seed.toml
          tar -czf evidence/channel-registry.tar.gz -C "$HOME/.cargo" registry
          sha256sum evidence/channel-registry.tar.gz evidence/Cargo.lock > evidence/SHA256SUMS.txt
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-channel-dependencies-r6
          path: evidence/
          retention-days: 7
          if-no-files-found: error
