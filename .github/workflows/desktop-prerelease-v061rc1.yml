name: Desktop v0.6.1-rc.1 prerelease

on:
  push:
    branches: ['release/desktop-v0.6.1-rc.1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-v0.6.1-rc.1-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: '0.6.1-rc.1'
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native:
    name: Exact-source sandbox and desktop regression
    uses: ./.github/workflows/cloud-gateway-desktop-sandbox.yml

  contracts:
    name: Version, packaging and dependency contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Exact committed source and packaging unit gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/rc_version_gate.py --expect-version "$VERSION" --expect-sha "$GITHUB_SHA" --output evidence/version.json
          python - <<'PY_SCOPE'
          import json, pathlib, subprocess
          base='2c5d133eaa75d7fc084b8122350d7768ce5b2382'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed={
            '.github/workflows/cloud-gateway-desktop-sandbox.yml',
            '.github/workflows/desktop-prerelease-v061rc1.yml',
            'package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json',
            'scripts/desktop_prerelease_bundle.py','scripts/desktop_prerelease_bundle_tests.py',
            'docs/releases/desktop-v0.6.1-rc.1/LOCAL-TEST.zh-CN.md',
            'docs/releases/desktop-v0.6.1-rc.1/scope.json',
          }
          if set(changed) != allowed:
              raise SystemExit(f'unexpected release delta: {sorted(set(changed)^allowed)}')
          pathlib.Path('evidence/release-scope.json').write_text(json.dumps({
            'passed':True,'verified_base':base,'changed_files':changed
          },indent=2)+'\n',encoding='utf-8')
          PY_SCOPE
          python scripts/rc_version_gate_tests.py
          python scripts/rc_packages_tests.py
          python scripts/rc_windows_install_contract_tests.py
          python scripts/desktop_prerelease_bundle_tests.py
          node --test tests/cloud-gateway/*.test.mjs
          node --test tests/offline-safe-ui.test.mjs tests/offline-safe-intent-ui.test.mjs
          python scripts/connector_fault_proxy_tests.py
          git diff --exit-code HEAD --
      - name: Frontend lockfile and vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          set +e
          npm audit --json > evidence/npm-audit.json
          code=$?
          set -e
          python - <<'PY'
          import json
          r=json.load(open('evidence/npm-audit.json',encoding='utf-8'))
          assert type(r['metadata']['vulnerabilities']['total']) is int
          assert r['metadata']['vulnerabilities']['total'] == 0, r['metadata']['vulnerabilities']
          PY
          test "$code" -eq 0
      - name: Desktop RustSec advisory gate
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Record desktop RustSec receipt
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          pathlib.Path('evidence/rust-audit-desktop.json').write_text(json.dumps({
            'tool':'rustsec/audit-check','action_sha':'69366f33c96575abad1ee0dba8212993eecbe998',
            'working_directory':'src-tauri','vulnerabilities':{'count':0,'found':False}
          },indent=2)+'\n')
          PY
      - name: Shared runtime RustSec advisory gate
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: services/local-agent
      - name: Record exact contract identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          p=pathlib.Path('evidence')
          (p/'rust-audit-runtime.json').write_text(json.dumps({
            'tool':'rustsec/audit-check','action_sha':'69366f33c96575abad1ee0dba8212993eecbe998',
            'working_directory':'services/local-agent','vulnerabilities':{'count':0,'found':False}
          },indent=2)+'\n')
          identity={
            'passed':True,'source_sha':os.environ['GITHUB_SHA'],
            'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'version':os.environ['VERSION'],'run_id':os.environ['GITHUB_RUN_ID'],
          }
          (p/'identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          PY
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-package-contracts
          path: evidence/
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Build and install exact Windows NSIS
    needs: [native, contracts]
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Exact-source NSIS build
        shell: pwsh
        run: |
          python scripts/rc_version_gate.py --expect-version $env:VERSION --expect-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'RC identity gate failed' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'frontend check failed' }
          npm run tauri -- build --ci --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'build changed tracked source' }
      - name: Prepare exact native WebView2 driver
        shell: pwsh
        run: ./scripts/Windows原生驱动准备v8.ps1 -OutputDirectory "$env:RUNNER_TEMP/windows-rc-driver"
      - name: Standard-user installed native acceptance
        shell: pwsh
        run: ./scripts/rc_windows_install.ps1 -OutputDirectory "$env:RUNNER_TEMP/desktop-windows-package" -Driver "$env:RUNNER_TEMP/windows-rc-driver/msedgedriver.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-windows-package
          path: ${{ runner.temp }}/desktop-windows-package/
          retention-days: 30
          if-no-files-found: error

  linux-build:
    name: Build exact Ubuntu DEB and AppImage
    needs: [native, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev patchelf libfuse2 libegl1 libgles2 libgl1
      - name: Exact-source Linux package build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rc_version_gate.py --expect-version "$VERSION" --expect-sha "$GITHUB_SHA"
          npm ci
          npm run check
          npm run build
          npm run tauri -- build --config src-tauri/Ubuntu桌面v1.json --bundles deb,appimage -- --locked
          image=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$image"
          python scripts/AppImage入口配置v3.py --verify "$image" --output "$RUNNER_TEMP/appimage-entry.json"
          python scripts/rc_packages.py prepare --directory . --output "$RUNNER_TEMP/desktop-linux-packages" --source "$GITHUB_SHA"
          cargo install tauri-driver --version 2.0.6 --locked --root "$RUNNER_TEMP/linux-rc-driver"
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-packages
          path: ${{ runner.temp }}/desktop-linux-packages/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-driver
          path: ${{ runner.temp }}/linux-rc-driver/bin/tauri-driver
          retention-days: 7
          if-no-files-found: error

  linux-installed:
    name: Installed Ubuntu (${{ matrix.kind }})
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        kind: [deb, appimage]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PACKAGE_KIND: ${{ matrix.kind }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-packages
          path: ${{ runner.temp }}/desktop-linux-packages
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-driver
          path: ${{ runner.temp }}/linux-rc-driver
      - name: Install exact package and startup prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth x11-utils fonts-noto-cjk desktop-file-utils gnome-keyring dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk libayatana-appindicator3-1 libsecret-1-0 libxdo3 libfuse2
          chmod +x "$RUNNER_TEMP/linux-rc-driver/tauri-driver" "$RUNNER_TEMP/desktop-linux-packages/"*.AppImage
          if [ "$PACKAGE_KIND" = deb ]; then
            sudo apt-get install -y "$RUNNER_TEMP/desktop-linux-packages/"*.deb
          fi
          mkdir -p evidence
          python scripts/rc_packages.py installed --directory "$RUNNER_TEMP/desktop-linux-packages" --source "$GITHUB_SHA" --kind "$PACKAGE_KIND" --output evidence/rc-package.json
      - name: Raw installed startup safety matrix
        shell: bash
        run: |
          set -euo pipefail
          app=$(python -c "import json; print(json.load(open('evidence/rc-package.json',encoding='utf-8'))['executable'])")
          export HOME="$RUNNER_TEMP/desktop-startup-$PACKAGE_KIND"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_CACHE_HOME="$HOME/cache" XDG_RUNTIME_DIR="$HOME/run"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          touch "$HOME/.linux-startup-disposable"
          for scenario in missing-bus unlocked-keyring split-session-bus safe-mode; do
            export XDG_STATE_HOME="$HOME/state-$scenario"
            mkdir -p "$XDG_STATE_HOME"; chmod 700 "$XDG_STATE_HOME"
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/linux_startup_candidate.py --app "$app" --case "$scenario" --seconds 20 --output "evidence/startup-$scenario"
          done
          if grep -R -E 'failed to load app state|panic' evidence/startup-*/stderr.txt; then
            echo 'fatal startup signature detected' >&2; exit 1
          fi
      - name: Install WebDriver after raw startup gate
        shell: bash
        run: sudo apt-get install -y webkit2gtk-driver
      - name: Installed native OAuth, exclusive ownership, refresh and drain acceptance
        shell: bash
        run: |
          set -euo pipefail
          app=$(python -c "import json; print(json.load(open('evidence/rc-package.json',encoding='utf-8'))['executable'])")
          export HOME="$RUNNER_TEMP/desktop-native-$PACKAGE_KIND"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_CACHE_HOME="$HOME/cache" XDG_RUNTIME_DIR="$HOME/run"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          touch "$HOME/.ubuntu-ci-fixture-v1"
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- bash scripts/Ubuntu图形会话v2.sh "$GITHUB_WORKSPACE/scripts/exclusive_native_acceptance.py" "$app" "$RUNNER_TEMP/linux-rc-driver/tauri-driver" "$PACKAGE_KIND" "$GITHUB_WORKSPACE/evidence" 2>&1 | tee evidence/native-session.log
          python scripts/rc_native_gate.py --input evidence/exclusive-native.json --binary "$app" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --version "$VERSION" --kind "$PACKAGE_KIND" | tee evidence/native-gate.json
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-linux-installed-${{ matrix.kind }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error

  bundle:
    name: Assemble exact-source prerelease bundle
    needs: [native, contracts, windows, linux-build, linux-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/desktop-prerelease-evidence
      - name: Validate all evidence and assemble user-testable assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/desktop_prerelease_bundle.py \
            --artifacts "$RUNNER_TEMP/desktop-prerelease-evidence" \
            --output "$RUNNER_TEMP/desktop-v0.6.1-rc.1" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          cd "$RUNNER_TEMP/desktop-v0.6.1-rc.1"
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-v0.6.1-rc.1-prerelease
          path: ${{ runner.temp }}/desktop-v0.6.1-rc.1/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease after asset digest verification
    needs: bundle
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/release/desktop-v0.6.1-rc.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Eswink/coding-tools-mcp
      TAG: v0.6.1-rc.1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-v0.6.1-rc.1-prerelease
          path: release-assets
      - name: Create draft, verify GitHub asset digests, then publish as prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "tag or release already exists; refusing overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title 'v0.6.1-rc.1 — Desktop local-machine validation' \
            --notes-file release-assets/LOCAL-TEST.zh-CN.md release-assets/*
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path('release-assets')
          expected={p.name:('sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),p.stat().st_size)
                    for p in root.iterdir() if p.is_file()}
          release=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/releases/tags/{os.environ['TAG']}"],text=True))
          assert release['draft'] is True and release['prerelease'] is True
          actual={a['name']:(a.get('digest'),a['size']) for a in release['assets']}
          assert actual == expected, (actual,expected)
          tag=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GH_REPO']}/git/ref/tags/{os.environ['TAG']}"],text=True))
          assert tag['object']['sha'] == os.environ['GITHUB_SHA']
          PY
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets | tee prerelease-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-prerelease-publication-receipt
          path: prerelease-receipt.json
          retention-days: 90
          if-no-files-found: warn
