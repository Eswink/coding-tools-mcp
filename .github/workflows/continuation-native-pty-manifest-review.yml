name: Native PTY manifest evidence review (never merge)

on:
  push:
    branches: ['ci/native-pty-manifest-review-20260925']
    paths:
      - 'tools/delivery/manifest.json'
      - '.github/workflows/continuation-native-pty-manifest-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 1b8ca774cb88ba30e9c94f94613e2fc7b5c641de

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify native PTY manifest receipt against exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}" | tee evidence/changed-paths.txt
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/continuation-native-pty-manifest-review.yml'
          test "${changed[1]}" = 'tools/delivery/manifest.json'
          git diff --check "$SOURCE_SHA"...HEAD
          python -m unittest discover -s tests/delivery -v 2>&1 | tee evidence/delivery-tests.txt
          node --test tests/delivery/metadata_contract.test.mjs 2>&1 | tee evidence/metadata-tests.txt
          rm -f "$RUNNER_TEMP/report.json"
          python tools/delivery/dispatch.py --manifest tools/delivery/manifest.json --repo-root . --output "$RUNNER_TEMP/report.json"
          cp "$RUNNER_TEMP/report.json" evidence/report.json
          python - <<'PY' | tee evidence/assertions.txt
          import hashlib, json, os
          source=os.environ['SOURCE_SHA']
          m=json.load(open('tools/delivery/manifest.json',encoding='utf-8'))
          t=next(t for t in m['tasks'] if t['id']=='native-pty')
          assert t['state']=='verified'
          assert t['issue']==59
          assert t['evidence']['revision']==source
          assert t['evidence']['run_id']==36116589164
          expected={
            "services/local-agent/Cargo.toml":"5f91a913256b8a7263e23d343ac8f762c8bf56a02586c94e7c4401a3d60a8b13",
            "services/local-agent/src/bin/pty_fixture.rs":"cfeb9e4e6f3a73c747b27b6f665ee20e7d2837cd3bb9696d7bde91f695395f1f",
            "services/local-agent/src/lib.rs":"d0a567e2c00935f07610728e47d20697a7c81b0602cb8220bf2fff605953f45a",
            "services/local-agent/src/process_tree.rs":"8888fe05f9e46e4f9906b6547ec1fa009515a498a4240fb745239faa12674bbd",
            "services/local-agent/src/process_tree_windows.rs":"448384c978313b7589443691d7193ddc3ac99482835aabaffd69ef96b03e7b30",
            "services/local-agent/src/pty.rs":"c1b97addde68d332115ed0a82afa898bc0f128c65213413926d3d929564a40f9",
            "services/local-agent/src/pty_io.rs":"9aa4e8bbd72e5ec230b528b450d4c8e22b0f632aae41cb05380d3603fc75e4a6",
            "services/local-agent/src/pty_unix.rs":"4dc4eec7e0af7f25cada7b4d4d426d0b96f34f813d18ab0a84340d3245e5928e",
            "services/local-agent/src/pty_windows.rs":"04df22383bc565514889b61f9af29d06a49a7cb754552da96f5076cfc1f7a69f",
            "services/local-agent/tests/pty_runtime.rs":"c296258142de441109fa22a6c3feddf311725acccbf4f51dd5ae69e521aa0bad",
          }
          assert t['evidence']['files']==expected
          actuals={}
          for path,digest in expected.items():
              actual=hashlib.sha256(open(path,'rb').read()).hexdigest()
              actuals[path]=actual
              print(f'hash {path} actual={actual} expected={digest} match={actual==digest}')
          report=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'report.json'),encoding='utf-8'))
          print('report-native-pty=' + json.dumps(report.get('states',{}).get('native-pty'),sort_keys=True))
          print('report-keys=' + ','.join(sorted(report.keys())))
          print('release_allowed=' + repr(report.get('release_allowed')))
          print('release_eligible_for_review=' + repr(report.get('release_eligible_for_review')))
          print('packets=' + ','.join(p.get('id','') for p in report.get('packets',[])))
          mismatches={p:(actuals[p],expected[p]) for p in expected if actuals[p]!=expected[p]}
          print('hash_mismatches=' + json.dumps(mismatches,sort_keys=True))
          assert not mismatches,mismatches
          assert report['states']['native-pty']=='verified',report['states']['native-pty']
          assert report.get('release_allowed',False) is False
          print('native-pty=verified')
          PY
          python - <<'PY' | tee evidence/manifest-hash.txt
          import hashlib
          p='tools/delivery/manifest.json'
          print(hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse HEAD > evidence/helper-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-pty-manifest-review
          path: evidence/
          retention-days: 14
          if-no-files-found: error
