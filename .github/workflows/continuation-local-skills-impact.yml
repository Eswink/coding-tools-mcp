name: Local Skills impact review (never merge)

on:
  push:
    branches: ['ci/local-skills-impact-20260924']
    paths:
      - '.github/workflows/continuation-local-skills-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 8c97a4c8a9d66666d91687ddfd05e9a132265775

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect guidance and policy integration boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          "$graph" query 'GuidanceResolver SKILL.md project guidance execution policy local skills' > evidence/query.txt 2>&1 || true
          "$graph" context 'GuidanceResolver' > evidence/guidance-context.txt 2>&1 || true
          "$graph" impact 'Struct:services/local-agent/src/guidance.rs:GuidanceResolver' --direction upstream > evidence/guidance-impact.txt 2>&1 || true
          "$graph" context 'LocalAdmission' > evidence/admission-context.txt 2>&1 || true
          "$graph" impact 'Struct:services/local-agent/src/policy.rs:ExecPolicy' --direction upstream > evidence/policy-impact.txt 2>&1 || true
          cat evidence/query.txt evidence/guidance-context.txt evidence/guidance-impact.txt evidence/admission-context.txt evidence/policy-impact.txt
          git diff --exit-code
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-skills-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
