name: Worktree current-source candidate review (never merge)

on:
  push:
    branches: ['ci/worktrees-current-candidate-review-20260925']
    paths:
      - 'src-tauri/src/harness/mod.rs'
      - 'src-tauri/src/harness/worktree.rs'
      - 'src-tauri/src/harness/worktree_git.rs'
      - 'src-tauri/src/harness/worktree_tests.rs'
      - '.github/workflows/continuation-worktrees-current-candidate-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: f4f93af9ee28aa209bb67643421725fcb22fb7e5
  PRODUCT_SHA: 7e77e846047460eb2c71596ce6087edcd0121ebc

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify staged worktree candidate on current source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          git checkout "$SOURCE_SHA"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          git checkout "$PRODUCT_SHA" --             src-tauri/src/harness/mod.rs             src-tauri/src/harness/worktree.rs             src-tauri/src/harness/worktree_git.rs             src-tauri/src/harness/worktree_tests.rs
          git add             src-tauri/src/harness/mod.rs             src-tauri/src/harness/worktree.rs             src-tauri/src/harness/worktree_git.rs             src-tauri/src/harness/worktree_tests.rs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 4
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          wc -l             src-tauri/src/harness/worktree.rs             src-tauri/src/harness/worktree_git.rs             src-tauri/src/harness/worktree_tests.rs | tee evidence/line-counts.txt
          test "$(wc -l < src-tauri/src/harness/worktree.rs)" -lt 500
          test "$(wc -l < src-tauri/src/harness/worktree_git.rs)" -lt 500
          test "$(wc -l < src-tauri/src/harness/worktree_tests.rs)" -lt 500
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
            'src-tauri/src/harness/mod.rs',
            'src-tauri/src/harness/worktree.rs',
            'src-tauri/src/harness/worktree_git.rs',
            'src-tauri/src/harness/worktree_tests.rs',
          ]:
            print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git diff --cached > evidence/candidate.patch
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$PRODUCT_SHA" > evidence/product-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-current-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable current-source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          test "$(git rev-parse "$PRODUCT_SHA")" = "$PRODUCT_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA"..."$PRODUCT_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
      - name: Install Ubuntu native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate worktree lifecycle and complete regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustfmt --edition 2021 --check             src-tauri/src/harness/worktree.rs             src-tauri/src/harness/worktree_git.rs             src-tauri/src/harness/worktree_tests.rs
          git diff --check "$SOURCE_SHA"..."$PRODUCT_SHA"
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format=json -- -D warnings             > evidence/clippy.jsonl 2> evidence/clippy.stderr
          clippy_code=$?
          set -e
          echo "clippy_exit=$clippy_code" | tee evidence/clippy-result.txt
          python - <<'PY' | tee -a evidence/clippy-result.txt
          import json, pathlib, sys
          candidates={
            'src/harness/mod.rs',
            'src/harness/worktree.rs',
            'src/harness/worktree_git.rs',
            'src/harness/worktree_tests.rs',
          }
          errors=[]
          for raw in pathlib.Path('evidence/clippy.jsonl').read_text(encoding='utf-8',errors='replace').splitlines():
            try: item=json.loads(raw)
            except json.JSONDecodeError: continue
            if item.get('reason')!='compiler-message': continue
            msg=item.get('message',{})
            if msg.get('level')!='error': continue
            files={str(span.get('file_name','')).replace('\\','/') for span in msg.get('spans',[])}
            if any(any(name.endswith(c) for c in candidates) for name in files):
              errors.append({'message':msg.get('message'),'files':sorted(files)})
          print(f'candidate_clippy_errors={len(errors)}')
          for e in errors: print(json.dumps(e,ensure_ascii=False,sort_keys=True))
          if errors: sys.exit(1)
          PY
          cat evidence/clippy.stderr
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path src-tauri/Cargo.toml harness::worktree -- --nocapture 2>&1 | tee evidence/focused.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full.txt
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
            'src-tauri/src/harness/mod.rs',
            'src-tauri/src/harness/worktree.rs',
            'src-tauri/src/harness/worktree_git.rs',
            'src-tauri/src/harness/worktree_tests.rs',
          ]:
            print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$PRODUCT_SHA" > evidence/product-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-current-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
