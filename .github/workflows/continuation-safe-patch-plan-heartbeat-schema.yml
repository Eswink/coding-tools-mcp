name: Safe patch plan heartbeat schema probe (never merge)

on:
  push:
    branches: ['ci/safe-patch-plan-heartbeat-schema-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-plan-heartbeat-schema.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
          persist-credentials: false
          fetch-depth: 0
      - name: Probe plan_heartbeat input contract only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          set +e
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --json '{}' > evidence/heartbeat-empty.json 2>&1
          code=$?
          set -e
          echo "exit_code=$code" | tee evidence/result.txt
          cat evidence/heartbeat-empty.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-plan-heartbeat-schema
          path: evidence/
          retention-days: 14
          if-no-files-found: error
