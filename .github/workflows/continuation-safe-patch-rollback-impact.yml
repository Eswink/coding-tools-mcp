name: Safe patch rollback impact review (never merge)

on:
  push:
    branches: ['ci/safe-patch-rollback-impact-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-rollback-impact.yml'

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 510f3f1d16bfe3cc433bd45d7697aa31235553ec
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Review rollback symbol impact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          "$graph" context 'Journal.rollback' > evidence/context.txt 2>&1 || true
          "$graph" impact 'Journal.rollback' --direction upstream > evidence/impact.txt 2>&1 || true
          cat evidence/context.txt evidence/impact.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-rollback-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
