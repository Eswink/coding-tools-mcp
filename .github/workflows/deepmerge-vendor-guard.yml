name: deepmerge vendor guard

on:
  pull_request:
    branches:
      - "develop/**"
      - main
    paths:
      - package.json
      - package-lock.json
      - "vendor-js/**"
      - tests/deepmerge-vendor.test.mjs
      - .github/workflows/deepmerge-vendor-guard.yml

permissions:
  contents: read

concurrency:
  group: deepmerge-vendor-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deepmerge-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/deepmerge-vendor.test.mjs
