name: deepmerge vendor guard

on:
  pull_request:
    branches:
      - "develop/**"
      - main
    paths:
      - package.json
      - package-lock.json
      - "vendor-js/**"
      - tests/deepmerge-vendor.test.mjs
      - scripts/rc_npm_audit_gate.py
      - "scripts/rc_npm_audit_gate_tests/**"
      - .github/workflows/deepmerge-vendor-guard.yml

permissions:
  contents: read

concurrency:
  group: deepmerge-vendor-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deepmerge-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/deepmerge-vendor.test.mjs
      - name: Vendored deepmerge mitigation (pinned digests)
        run: python3 scripts/rc_npm_audit_gate.py --verify-only --repo .
      - name: npm audit gate unit tests
        working-directory: scripts/rc_npm_audit_gate_tests
        run: python3 -m unittest rc_npm_audit_gate_tests rc_stable_channel_tests rc_npm_audit_mitigation_tests
      - name: Full npm audit judged by the gate (no capture)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          code=$?
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-prod.json"
          prod_code=$?
          set -e
          python3 scripts/rc_npm_audit_gate.py --repo . --no-capture \
            --full "$RUNNER_TEMP/npm-audit.json" --full-exit-code "$code" \
            --prod "$RUNNER_TEMP/npm-audit-prod.json" --prod-exit-code "$prod_code" \
            --npm-version "$(npm --version)" --node-version "$(node --version)"
