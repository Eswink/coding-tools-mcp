name: Cloud gateway standalone service
on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime']
    paths: ['services/cloud-gateway/**', '.github/workflows/cloud-gateway-service.yml']
  pull_request:
    branches: [main, 'develop/0.8.0']
    paths: ['services/cloud-gateway/**', '.github/workflows/cloud-gateway-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-gateway-service-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Native executable and portable boundary contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          python -m unittest discover -s services/cloud-gateway/tests -p 'test_service_diagnostics.py' -v > evidence/diagnostics.txt 2>&1
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test service_contracts 2>&1 | tee evidence/service-contracts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-gateway-service-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  process-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare public test tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: B5 single-variable userns AppArmor probe
        shell: bash
        run: |
          set -euo pipefail
          # Single knob only: kernel.apparmor_restrict_unprivileged_userns
          # Closed-set logs (token values only). No paths/URLs/raw sysctl dumps.
          # Keep chromium_sandbox=True; never pass --no-sandbox.
          KEY=kernel.apparmor_restrict_unprivileged_userns
          mkdir -p evidence
          raw_before="$(sysctl -n "$KEY" 2>/dev/null || true)"
          case "$raw_before" in
            0) before=0 ;;
            1) before=1 ;;
            '') before=absent ;;
            *) before=other ;;
          esac
          echo "ci_env key=apparmor_restrict_unprivileged_userns before=$before"
          apply=denied
          if [[ "$before" == "absent" ]]; then
            apply=absent
          elif [[ "$before" == "0" ]]; then
            apply=already_open
          elif [[ "$before" == "1" || "$before" == "other" ]]; then
            if sudo -n sysctl -w "${KEY}=0" >/dev/null 2>&1; then
              apply=ok
            elif sudo sysctl -w "${KEY}=0" >/dev/null 2>&1; then
              apply=ok
            else
              apply=denied
            fi
          fi
          raw_after="$(sysctl -n "$KEY" 2>/dev/null || true)"
          case "$raw_after" in
            0) after=0 ;;
            1) after=1 ;;
            '') after=absent ;;
            *) after=other ;;
          esac
          echo "ci_env key=apparmor_restrict_unprivileged_userns after=$after"
          echo "ci_env key=apparmor_restrict_unprivileged_userns apply=$apply"
          printf 'before=%s\nafter=%s\napply=%s\n' "$before" "$after" "$apply" > evidence/b5-userns-apparmor.env
          if [[ "$apply" == "denied" || "$apply" == "absent" ]]; then
            echo "ci_env probe=abort reason=sysctl_${apply}"
            exit 1
          fi
      - name: Independent disposable process and browser gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bin coding-tools-gateway
          binary="$PWD/services/cloud-gateway/target/debug/coding-tools-gateway"
          python services/cloud-gateway/tests/run_service_http.py --pg-bin /usr/lib/postgresql/16/bin --binary "$binary" | tee evidence/process-http.json
          chromium="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python services/cloud-gateway/tests/run_service_browser_ci.py --pg-bin /usr/lib/postgresql/16/bin --binary "$binary" --chromium "$chromium" | tee evidence/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-gateway-service-process-browser
          path: evidence/
          retention-days: 14
          if-no-files-found: error
