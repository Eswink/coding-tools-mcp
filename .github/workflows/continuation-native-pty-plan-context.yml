name: Native PTY Plan context checkpoint (never merge)

on:
  push:
    branches: ['ci/native-pty-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-native-pty-plan-context.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-59-windows-steady-103f1c5cb8
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-59-windows-steady-103f1c5cb8.json
  SOURCE_SHA: 5f65d069343c0cdcb5455fa7cc76792a14bb5d2e

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume and checkpoint existing project context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          node - <<'NODE'
          const r=require('./evidence/resume.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='context') process.exit(2);
          NODE
          test -f AGENTS.md
          test -f docs/graph-insights/latest.md
          test -f docs/graph-insights/latest.json
          test -f docs/project-context.md
          python - <<'PY' > evidence/heartbeat.json
          import json, os, hashlib
          refs=[]
          for p in ['AGENTS.md','docs/graph-insights/latest.md','docs/graph-insights/latest.json','docs/project-context.md']:
              refs.append(f"{p} sha256:{hashlib.sha256(open(p,'rb').read()).hexdigest()}")
          print(json.dumps({
            "plan_id": os.environ["PLAN_ID"],
            "project_root": os.getcwd(),
            "completed_step_ids": ["context"],
            "evidence": [{
              "kind": "requirements",
              "step_id": "context",
              "summary": "Repository instructions, project context and both current graph-insights documents exist and were revalidated before native PTY specification.",
              "reference": "; ".join(refs),
              "revision": os.environ["SOURCE_SHA"]
            }],
            "last_verified_revision": os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          cat "$PLAN_PATH" | tee evidence/plan-after.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint native PTY context"
          git fetch origin "ci/native-pty-plan-init-20260925"
          test "$(git rev-parse "origin/ci/native-pty-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/native-pty-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-pty-plan-context
          path: evidence/
          retention-days: 14
          if-no-files-found: error
