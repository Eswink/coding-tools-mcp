name: Safe patch pure candidate validation (never merge)

on:
  push:
    branches: ['ci/safe-patch-pure-candidate-validation-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-pure-candidate-validation.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
  CANDIDATE_SHA: c177357aca6d7f428d558d4994682b183faef39e

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Detect exact three-file production candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch origin "$CANDIDATE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          git checkout "$CANDIDATE_SHA" --             src-tauri/src/tools/patch.rs             src-tauri/src/tools/patch_transaction.rs             src-tauri/src/tools/patch_transaction_tests.rs
          git add src-tauri/src/tools/patch.rs src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          wc -l src-tauri/src/tools/patch.rs src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs | tee evidence/line-counts.txt
          test "$(wc -l < src-tauri/src/tools/patch_transaction.rs)" -lt 500
          test "$(wc -l < src-tauri/src/tools/patch_transaction_tests.rs)" -lt 500
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'src-tauri/src/tools/patch.rs',
              'src-tauri/src/tools/patch_transaction.rs',
              'src-tauri/src/tools/patch_transaction_tests.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$CANDIDATE_SHA" > evidence/candidate-commit.txt
          echo NEVER_MERGE_HELPER_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-pure-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable candidate revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only "$SOURCE_SHA"..."$CANDIDATE_SHA" | wc -l)" -eq 3
          git diff --check "$SOURCE_SHA"..."$CANDIDATE_SHA"
      - name: Install Ubuntu native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify exact pure candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustfmt --edition 2021 --check src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format=json -- -D warnings             > evidence/clippy.jsonl 2> evidence/clippy.stderr
          clippy_code=$?
          set -e
          echo "clippy_exit=$clippy_code" | tee evidence/clippy-result.txt
          python - <<'PY' | tee -a evidence/clippy-result.txt
          import json, pathlib, sys
          candidates={"src/tools/patch.rs","src/tools/patch_transaction.rs","src/tools/patch_transaction_tests.rs"}
          candidate_errors=[]; all_errors=0
          for raw in pathlib.Path("evidence/clippy.jsonl").read_text(encoding="utf-8",errors="replace").splitlines():
              try: item=json.loads(raw)
              except json.JSONDecodeError: continue
              if item.get("reason")!="compiler-message": continue
              msg=item.get("message",{})
              if msg.get("level")!="error": continue
              all_errors+=1
              files={str(s.get("file_name","")).replace("\\","/") for s in msg.get("spans",[])}
              if any(any(name.endswith(c) for c in candidates) for name in files):
                  candidate_errors.append({"code":(msg.get("code") or {}).get("code"),"message":msg.get("message"),"files":sorted(files)})
          print(f"clippy_all_errors={all_errors}")
          print(f"clippy_candidate_errors={len(candidate_errors)}")
          for e in candidate_errors: print(json.dumps(e,ensure_ascii=False,sort_keys=True))
          if candidate_errors: sys.exit(1)
          PY
          cat evidence/clippy.stderr
          cargo test --locked --manifest-path src-tauri/Cargo.toml patch_transaction -- --nocapture 2>&1 | tee evidence/focused.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full.txt
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'src-tauri/src/tools/patch.rs',
              'src-tauri/src/tools/patch_transaction.rs',
              'src-tauri/src/tools/patch_transaction_tests.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-pure-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
