name: Desktop prerelease rustls fix probe
on:
  push:
    branches: ['ci/desktop-prerelease-rustls-fix']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Cargo-generated rustls remediation and compile
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml -p rustls --precise 0.23.45
          git diff -- src-tauri/Cargo.lock | tee rustls-lock.patch
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          grep -q 'name = "rustls"' src-tauri/Cargo.lock
          grep -q 'version = "0.23.45"' src-tauri/Cargo.lock
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-rustls-remediation
          path: rustls-lock.patch
          retention-days: 7
          if-no-files-found: error
