name: Worktrees implement checkpoint (never merge)

on:
  push:
    branches: ['ci/worktrees-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-worktrees-plan-implement.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-70-isolated-steady-19007e247b
  CANDIDATE_SHA: d951259ddf8a20b1287a51f57b532ce846acb94e
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-70-isolated-steady-19007e247b.json

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume and checkpoint implement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          node - <<'NODE'
          const r=require('./evidence/resume.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='implement') process.exit(2);
          NODE
          python - <<'PY' > evidence/heartbeat.json
          import json, os
          print(json.dumps({
            "plan_id": os.environ["PLAN_ID"],
            "project_root": os.getcwd(),
            "completed_step_ids": ["implement"],
            "evidence": [{
              "kind": "implementation",
              "step_id": "implement",
              "summary": "Issue #70 candidate implements bounded managed detached worktree create/list/clean-remove with canonical workspace/Harness boundaries and a separate bounded Git argv runner; no public MCP tool exposure or snapshot behavior.",
              "reference": "ci/worktrees-candidate-review-20260925 production bytes",
              "revision": os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision": os.environ["CANDIDATE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          cat "$PLAN_PATH" | tee evidence/plan-after.json
          node - <<'NODE'
          const p=require('./'+process.env.PLAN_PATH);
          if(!p.completedStepIds.includes('implement')) process.exit(1);
          if(p.lastVerifiedRevision!==process.env.CANDIDATE_SHA) process.exit(2);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint worktree implementation"
          git fetch origin "ci/worktrees-plan-init-20260925"
          test "$(git rev-parse "origin/ci/worktrees-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/worktrees-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-plan-implement
          path: evidence/
          retention-days: 14
          if-no-files-found: error
