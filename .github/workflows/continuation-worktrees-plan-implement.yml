name: Worktree Plan implement checkpoint (never merge)

on:
  push:
    branches: ['ci/worktrees-plan-implement-20260925']
    paths:
      - '.github/workflows/continuation-worktrees-plan-implement.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-70-isolated-steady-19007e247b
  PLAN_BRANCH: ci/worktrees-plan-init-20260925
  PLAN_REF: 574add2a6c1c781e79cd30b812d65431d9d3471a
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-70-isolated-steady-19007e247b.json
  CANDIDATE_SHA: 7e77e846047460eb2c71596ce6087edcd0121ebc

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume Plan, checkpoint implement, and persist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$(dirname "$PLAN_PATH")"
          git show "$PLAN_REF:$PLAN_PATH" > "$PLAN_PATH"
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node - <<'NODE'
          const r=require('./evidence/resume-before.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='implement') process.exit(2);
          if(r.structuredContent?.mustContinue!==true) process.exit(3);
          NODE
          python - <<'PY' > evidence/heartbeat-request.json
          import json, os
          payload={
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["implement"],
            "evidence":[{
              "kind":"implementation",
              "step_id":"implement",
              "summary":"Current-source worktree candidate materializes exactly four scoped harness production/test files on feature f4f93af9; old helper history is excluded. Current-source GitNexus impact run 36132996247 reported harness/mod.rs LOW/exact and Harness UNKNOWN/exact with no HIGH/CRITICAL finding.",
              "reference":"ci/worktrees-current-candidate-review-20260925",
              "revision":os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision":os.environ["CANDIDATE_SHA"]
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          cat "$PLAN_PATH" | tee evidence/plan-after.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          node - <<'NODE'
          const r=require('./evidence/resume-after.json');
          if(r.isError===true || r.structuredContent?.nextStepId!=='test') process.exit(1);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint current-source worktree implementation"
          git fetch origin "$PLAN_BRANCH"
          test "$(git rev-parse "origin/$PLAN_BRANCH")" = "$PLAN_REF"
          git push origin "HEAD:$PLAN_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-plan-implement
          path: evidence/
          retention-days: 14
          if-no-files-found: error
