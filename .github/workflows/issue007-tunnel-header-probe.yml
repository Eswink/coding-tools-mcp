name: ISSUE-007 tunnel header probe validation

on:
  push:
    branches:
      - test/tunnel-header-topology-probe
    paths:
      - 'src-tauri/examples/tunnel_header_probe.rs'
      - '.github/workflows/issue007-tunnel-header-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: Compile sanitized topology probe
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path src-tauri/Cargo.toml --example tunnel_header_probe
          cargo test --locked --manifest-path src-tauri/Cargo.toml --example tunnel_header_probe
