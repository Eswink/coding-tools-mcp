name: Execution policy foundation

on:
  push:
    branches: ['ci/exec-policy-r13']
    paths:
      - 'services/local-agent/**'
      - '.github/workflows/exec-policy-r13.yml'

permissions:
  contents: read

concurrency:
  group: exec-policy-r13
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Verify deterministic execution policy
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo generate-lockfile --manifest-path services/local-agent/Cargo.toml
          cargo fmt --check --manifest-path services/local-agent/Cargo.toml
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/tests.txt
          cargo check --locked --manifest-path services/local-agent/Cargo.toml
          git diff --check 402fc5771453fcff1613fc7f13693a513a59d0d1 HEAD
          git diff --name-only 402fc5771453fcff1613fc7f13693a513a59d0d1 HEAD > evidence/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('evidence/changed-files.txt').read_text(encoding='utf-8').splitlines()
          assert paths
          assert all(
              p.startswith('services/local-agent/')
              or p=='.github/workflows/exec-policy-r13.yml'
              for p in paths
          ), paths
          PY
          git add -- services/local-agent
          git diff --cached --check
          git write-tree > evidence/verified-tree.txt
          mkdir -p evidence/source
          cp -R services/local-agent/. evidence/source/
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exec-policy-r13-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
