name: Isolated RC60 native candidate validation r2 (never merge)

on:
  push:
    branches: ['ci/rc60-native-validation-20260923-r2']
    paths:
      - '.github/workflows/continuation-rc60-native-validation-r2.yml'
      - 'tools/ci/rc60_apply_candidate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuation-rc60-native-validation-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve helper-only patcher outside checkout
        shell: bash
        run: cp tools/ci/rc60_apply_candidate.py "$RUNNER_TEMP/rc60_apply_candidate.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build pinned graph from untouched production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md .claude/skills/gitnexus
          git diff --exit-code
          "$graph" impact 'Function:src-tauri/src/tools/异步命令v1.rs:run' --direction upstream > evidence/pre-edit-impact.json 2>&1
          cat evidence/pre-edit-impact.json
      - name: Apply exact disposable candidate after graph baseline
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python "$RUNNER_TEMP/rc60_apply_candidate.py")"
          test "${#sha}" -eq 64
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$sha" 'src-tauri/src/tools/异步命令v1.rs' | tee evidence/candidate-source.sha256
          git add -- src-tauri/src/tools/异步命令v1.rs
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" detect-changes --scope staged > evidence/detect-changes.txt 2>&1
          cat evidence/detect-changes.txt
          git diff --cached --check
          git diff --cached -- src-tauri/src/tools/异步命令v1.rs > evidence/candidate.patch
          wc -l src-tauri/src/tools/异步命令v1.rs | tee evidence/source-lines.txt
          git rev-parse HEAD > evidence/base-source.txt
          printf '%s\n' 'DISPOSABLE_CANDIDATE_NEVER_MERGE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-r2-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    needs: impact
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve helper-only patcher outside checkout
        run: cp tools/ci/rc60_apply_candidate.py "$RUNNER_TEMP/rc60_apply_candidate.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Install official RC Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply exactly the candidate reviewed by impact job
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha="$(python "$RUNNER_TEMP/rc60_apply_candidate.py")"
          printf '%s  %s\n' "$sha" 'src-tauri/src/tools/异步命令v1.rs' | tee evidence/candidate-source.sha256
          test "$sha" = '${{ needs.impact.outputs.candidate_sha }}'
          git diff --check
          rustfmt --edition 2021 --check 'src-tauri/src/tools/异步命令v1.rs'
          wc -l src-tauri/src/tools/异步命令v1.rs | tee evidence/source-lines.txt
          git rev-parse HEAD > evidence/base-source.txt
      - name: Preserve durable no-replay contract
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml queued_record_is_encrypted_and_restart_never_replays_it -- --nocapture 2>&1 | tee evidence/no-replay-test.txt
      - name: Repeat exact Windows regression ten times
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "attempt=$i" | tee -a evidence/windows-exact-repeat.txt
            cargo test --locked --manifest-path src-tauri/Cargo.toml http_revoked_owner_drains_actual_background_process_before_successor -- --nocapture 2>&1 | tee -a evidence/windows-exact-repeat.txt
          done
      - name: Official RC all-target type check
        run: |
          set -o pipefail
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/check.txt
      - name: Official RC full regression
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full-tests.txt
      - name: Official RC production library warnings
        run: |
          set -o pipefail
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee evidence/warnings.txt
      - name: Record immutable evidence identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence'); root.mkdir(exist_ok=True)
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          report={
              'base_source':'c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b',
              'candidate_sha256':'${{ needs.impact.outputs.candidate_sha }}',
              'runner_os':os.environ['RUNNER_OS'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'files':files,
              'boundary':'DISPOSABLE_CANDIDATE_NEVER_MERGE'
          }
          (root/'identity.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-r2-native-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
