name: Issue 62 root-cause plan checkpoint (never merge)

on:
  push:
    branches: ['ci/issue62-plan-init-20260924']
    paths:
      - '.github/workflows/continuation-issue62-plan-root-cause.yml'

permissions:
  contents: write

env:
  PLAN_ID: bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b
  PLAN_PATH: .mcp-probe-kit/plans/bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b.json
  FEATURE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact current production sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch origin "$FEATURE_SHA"
          git show "$FEATURE_SHA:src-tauri/src/runtime/port.rs" > evidence/port.rs
          git show "$FEATURE_SHA:src-tauri/src/runtime/supervisor.rs" > evidence/supervisor.rs
          git show "$FEATURE_SHA:src-tauri/src/tools/任务恢复传输v2.rs" > evidence/recovery-test.rs
          git rev-parse "$FEATURE_SHA" > evidence/feature-commit.txt
      - name: Resume bugfix Plan and execute code_insight
        shell: bash
        run: |
          set -euo pipefail
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node - <<'NODE'
          const r=require('./evidence/resume-before.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='src8-1') process.exit(2);
          NODE
          python - <<'PY' > evidence/code-insight-request.json
          import json, os
          print(json.dumps({
            "project_root": os.getcwd(),
            "mode": "auto",
            "query": "Issue #62 Ubuntu same-port restart: contrast raw MCP listener stop.send()+JoinHandle completion with the production restart path RuntimeSupervisor::sync_stop_and_wait -> runtime::port::await_listener_shutdown_blocking. Determine whether the failing recovery_transport test bypasses the production restart-safe completion boundary and identify the smallest test-only correction."
          }))
          PY
          ./.mcp-probe-kit/bin/probe exec code_insight --stdin < evidence/code-insight-request.json > evidence/code-insight.json 2>&1
          cat evidence/code-insight.json
          node - <<'NODE'
          const r=require('./evidence/code-insight.json'); if(r.isError===true) process.exit(1);
          NODE
      - name: Checkpoint SRC-1 through SRC-5 with verified root cause
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/heartbeat-request.json
          import json, os
          feature=os.environ["FEATURE_SHA"]
          payload={
            "plan_id": os.environ["PLAN_ID"],
            "project_root": os.getcwd(),
            "completed_step_ids":["context","src8-1","src8-2","src8-3","src8-4","src8-5"],
            "evidence":[
              {
                "kind":"requirements",
                "step_id":"src8-1",
                "summary":"Ideal: callers that require immediate same-port reuse wait for restart-safe listener completion. Actual: the #62 recovery test waits only for raw JoinHandle completion; Ubuntu close-lag evidence shows the exact loopback LISTEN can persist 15-36 ms beyond that boundary, causing immediate EADDRINUSE.",
                "reference":"#62 comment 5807317900; close-lag run 35951904056",
                "revision":feature
              },
              {
                "kind":"other",
                "step_id":"src8-2",
                "summary":"Current production restart is already stronger than the failing test: RuntimeSupervisor::sync_stop_and_wait calls runtime::port::await_listener_shutdown_blocking(handle, port) before start; runtime::port also has async await_listener_shutdown. The failing recovery_transport test directly stop.send()+handle.await and bypasses this boundary.",
                "reference":"src-tauri/src/runtime/supervisor.rs:533-546; src-tauri/src/runtime/port.rs:175-206; lifecycle caller run 35981142285; evidence/code-insight.json",
                "revision":feature
              },
              {
                "kind":"other",
                "step_id":"src8-3",
                "summary":"Acceptance: preserve the single immediate same-port bind assertion; change only the recovery test shutdown observation to the existing production await_listener_shutdown boundary; exact target must pass repeatedly on Ubuntu and Windows, full suites must pass, no sleeps/rebind retries/SO_REUSEPORT/auth-origin behavior changes.",
                "reference":"Issue #62 acceptance plus architecture design run 35975824092",
                "revision":feature
              },
              {
                "kind":"other",
                "step_id":"src8-4",
                "summary":"Root cause: the regression test equates raw listener-task completion with production restart-safe completion. That equivalence is false on sampled Ubuntu kernels: the loopback LISTEN can remain visible 15-36 ms after handle.await. Production supervisor already waits for port release, so the test bypasses the real lifecycle contract. Ruled out: standard ephemeral allocator collision, another test using the same PID range, ordinary TIME_WAIT, and SO_REUSEADDR as a stable standalone fix.",
                "reference":"runs 35951904056, 35951528446, 35947380359, 35981142285",
                "revision":feature
              },
              {
                "kind":"other",
                "step_id":"src8-5",
                "summary":"Minimal repair: in src-tauri/src/tools/任务恢复传输v2.rs replace raw handle.await at both listener shutdown points with runtime::port::await_listener_shutdown(Some(handle), port).await after sending shutdown. Do not edit CRITICAL listener.rs/serve/bind_listener. Re-run GitNexus staged detect, exact same-port target repetitions, occupied-port/idempotency behavior and full Ubuntu/Windows suites.",
                "reference":"architecture design run 35975824092; release-observer primitive run 35980510044 proves the release condition is sufficient",
                "revision":feature
              }
            ],
            "last_verified_revision":feature
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          node - <<'NODE'
          const r=require('./evidence/resume-after.json');
          if(r.isError===true || r.structuredContent?.nextStepId!=='src8-6') process.exit(1);
          NODE
      - name: Persist Plan checkpoint without overwriting another executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint issue62 root cause"
          git fetch origin "ci/issue62-plan-init-20260924"
          test "$(git rev-parse "origin/ci/issue62-plan-init-20260924")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue62-plan-init-20260924"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-root-cause-plan
          path: evidence/
          retention-days: 14
          if-no-files-found: error
