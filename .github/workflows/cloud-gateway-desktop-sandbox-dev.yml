name: Desktop sandbox isolated development tools
on:
  push:
    branches: ['feat/issue-73-desktop-sandbox']
    paths:
      - '.github/workflows/cloud-gateway-desktop-sandbox-dev.yml'
      - 'src-tauri/src/auth/local_admission_deadline_tests.rs'
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-sandbox-development-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  RUST_BACKTRACE: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/probe" --no-audit --no-fund mcp-probe-kit@4.0.1 gitnexus@1.6.9
      - name: Resume actual checkpoint and advance only verified specification steps
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/delivery/dev-desktop-sandbox.py plan
      - name: Record source-bound contexts and impacts before further edits
        shell: bash
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/probe/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph.txt 2>&1
          git restore --worktree --source="$GITHUB_SHA" -- .
          python - <<'PY'
          import json, os, pathlib, subprocess
          graph = os.environ['RUNNER_TEMP'] + '/probe/node_modules/.bin/gitnexus'
          targets = [
            ('new', 'src-tauri/src/auth/local_admission_deadline_tests.rs'),
            ('from_workspace_with_harness_root', 'src-tauri/src/tools/context.rs'),
            ('background_snapshot', 'src-tauri/src/tools/context.rs'),
            ('exec_command', 'src-tauri/src/tools/exec.rs'),
            ('run_command', 'src-tauri/src/tools/exec.rs'),
            ('spawn_timeout_monitor', 'src-tauri/src/tools/exec.rs'),
            ('execution_failure_result', 'src-tauri/src/tools/exec.rs'),
            ('check_exec_environment', 'src-tauri/src/tools/dispatch.rs'),
            ('new_with_mode', 'src-tauri/src/tools/session.rs'),
            ('wait_for_readers', 'src-tauri/src/tools/session.rs'),
            ('snapshot', 'src-tauri/src/tools/session.rs'),
            ('commit_local_admission', 'src-tauri/src/auth/聊天授权v1.rs'),
            ('prepare', 'src-tauri/src/tools/linux_sandbox_bridge.rs'),
            ('commit_runtime_admission', 'src-tauri/src/auth/runtime_admission.rs'),
          ]
          for index, (symbol, path) in enumerate(targets):
              for mode in ['context', 'impact']:
                  args = [graph, mode, symbol, '--file', path]
                  if mode == 'impact': args += ['--direction', 'upstream', '--depth', '3']
                  r = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=60)
                  pathlib.Path(f'evidence/{index:02}-{mode}-{symbol}.json').write_text(r.stdout, encoding='utf-8')
                  if r.returncode: raise SystemExit(f'{mode} failed for {path}:{symbol}')
                  if mode == 'impact': print(f'IMPACT {path}:{symbol}\n{r.stdout}')
          PY
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git bundle create evidence/source.bundle HEAD
      - name: Preserve checkpoint evidence without overriding failure
        if: always()
        run: python tools/delivery/dev-desktop-sandbox.py hash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-sandbox-plan-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-sandbox-development
      - name: Reproduce old failure, verify fixed code, run complete native desktop suite
        run: python tools/delivery/dev-desktop-sandbox.py deadline
      - name: Preserve source-bound evidence without overriding failure
        if: always()
        run: python tools/delivery/dev-desktop-sandbox.py hash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-deadline-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  export:
    needs: native
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/feat/issue-73-desktop-sandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-deadline-ubuntu-24.04-${{ github.run_id }}
          path: ${{ runner.temp }}/native/ubuntu-24.04
      - uses: actions/download-artifact@v4
        with:
          name: desktop-deadline-windows-2025-${{ github.run_id }}
          path: ${{ runner.temp }}/native/windows-2025
      - name: Import two identical tested blobs only; never update commits, refs or releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/delivery/dev-desktop-sandbox.py blobs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-deadline-blob-receipt-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
