name: Desktop sandbox isolated development tools
on:
  push:
    branches: ['feat/issue-73-desktop-sandbox']
    paths: ['.github/workflows/cloud-gateway-desktop-sandbox-dev.yml']
permissions:
  contents: read
concurrency:
  group: desktop-sandbox-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect exact prior development evidence without changing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          request = urllib.request.Request('https://api.github.com/repos/Eswink/coding-tools-mcp/actions/artifacts/10925699027/zip', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read(10 * 1024 * 1024)
          assert hashlib.sha256(data).hexdigest() == '1466508bd2dfcb74fcbb6840b66db6f895618da76f803f2ddbf3b35856ff7cbf'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  if name == 'start-feature.json':
                      doc = json.loads(archive.read(name))
                      print('===START_FEATURE===')
                      print(json.dumps(doc.get('structuredContent'), ensure_ascii=False, indent=2))
                  if '-impact-' in name or name in ['14-context-commit_local_admission.json', '15-context-new.json']:
                      print('=== ' + name + ' ===')
                      text = archive.read(name).decode('utf-8')
                      print(text[:9000])
          PY
      - name: Describe exact plan checkpoint input schema
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/probe" --no-audit --no-fund mcp-probe-kit@4.0.1
          "$RUNNER_TEMP/probe/node_modules/.bin/mcp-probe-kit" --help
          "$RUNNER_TEMP/probe/node_modules/.bin/mcp-probe-kit" exec plan_heartbeat --json "{\"project_root\":\"$PWD\"}" || true
