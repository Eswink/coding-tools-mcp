name: RC60 Python module factorial diagnostic (never merge)

on:
  push:
    branches: ['ci/rc60-python-module-factorial-20260924']
    paths:
      - '.github/workflows/continuation-rc60-python-module-factorial.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 4f925e44c54066b5cf7df57e1133404542d70aec
  TARGET: auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor

jobs:
  factorial:
    strategy:
      fail-fast: false
      matrix:
        mode: [none, import_time, import_pathlib, import_pathlib_time]
        replica: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Bind exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prebuild without running tests
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path src-tauri/Cargo.toml > evidence/cargo-check.txt 2>&1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run > evidence/lib-prebuild.txt 2>&1
      - name: Apply module warmup
        if: matrix.mode != 'none'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = '${{ matrix.mode }}'
          if ($mode -eq 'import_time') { & python -c "import time" }
          elseif ($mode -eq 'import_pathlib') { & python -c "import pathlib" }
          elseif ($mode -eq 'import_pathlib_time') { & python -c "import pathlib, time" }
          else { throw "unknown mode: $mode" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First exact target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $start = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          & cargo test --locked --manifest-path src-tauri/Cargo.toml --lib $env:TARGET -- --exact --nocapture 2>&1 | Tee-Object -FilePath evidence/first.txt
          $code = $LASTEXITCODE
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $start
          $match = Select-String -Path evidence/first.txt -Pattern 'drain-startup ready after ([0-9]+)ms' | Select-Object -Last 1
          $ready = if ($match -and $match.Matches.Count -gt 0) { $match.Matches[0].Groups[1].Value } else { 'NA' }
          "mode=${{ matrix.mode }}" | Out-File evidence/result.txt -Encoding utf8
          "replica=${{ matrix.replica }}" | Out-File evidence/result.txt -Encoding utf8 -Append
          "first_readiness_ms=$ready" | Out-File evidence/result.txt -Encoding utf8 -Append
          "first_elapsed_ms=$elapsed" | Out-File evidence/result.txt -Encoding utf8 -Append
          "first_exit_code=$code" | Out-File evidence/result.txt -Encoding utf8 -Append
          Get-Content evidence/result.txt
          if ($code -ne 0) { exit $code }
      - name: Second exact target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $start = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          & cargo test --locked --manifest-path src-tauri/Cargo.toml --lib $env:TARGET -- --exact --nocapture 2>&1 | Tee-Object -FilePath evidence/second.txt
          $code = $LASTEXITCODE
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $start
          $match = Select-String -Path evidence/second.txt -Pattern 'drain-startup ready after ([0-9]+)ms' | Select-Object -Last 1
          $ready = if ($match -and $match.Matches.Count -gt 0) { $match.Matches[0].Groups[1].Value } else { 'NA' }
          "second_readiness_ms=$ready" | Out-File evidence/result.txt -Encoding utf8 -Append
          "second_elapsed_ms=$elapsed" | Out-File evidence/result.txt -Encoding utf8 -Append
          "second_exit_code=$code" | Out-File evidence/result.txt -Encoding utf8 -Append
          Get-Content evidence/result.txt
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-module-${{ matrix.mode }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
