name: Fixed RC artifact redirect observation

on:
  push:
    branches: [ci/rc-transport-observation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observe:
    if: >-
      github.repository == 'Eswink/coding-tools-mcp' &&
      github.repository_id == '1360355522' &&
      github.ref == 'refs/heads/ci/rc-transport-observation' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Hermetic rejection and no-follow tests
        run: python scripts/rc_transport_observation_tests.py
      - name: Observe fixed authenticated API redirect without following it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rc_transport_observation.py
