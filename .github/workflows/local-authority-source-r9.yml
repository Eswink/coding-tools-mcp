name: Local authority bridge exact-source verification
on:
  push:
    branches: ['ci/local-authority-bridge-r9']
    paths:
      - '.source-recovery-r9/**'
      - '.github/workflows/local-authority-source-r9.yml'
permissions:
  contents: write
concurrency:
  group: local-authority-source-r9
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Reconstruct exact reviewed source
        shell: bash
        env:
          BASE: '50fc0caa1be959adff3640b4d75b47ff778d2045'
          PATCH_SHA: '743c41399e691a84758b638f5bbda24d9c3f9bf9ec4829da7f05681ee9f4c63c'
          XZ_SHA: '993b7da973320cfc49691eb908bb1e70dd98bb2e46af1c374fd2a9ff11ff6ab9'
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/local-authority-r9"
          mkdir -p "$tmp" evidence
          cp -a .source-recovery-r9 "$tmp/recovery"
          cat "$tmp"/recovery/part-*.txt | base64 -d > "$tmp/change.patch.xz"
          echo "$XZ_SHA  $tmp/change.patch.xz" | sha256sum -c -
          xz -dc "$tmp/change.patch.xz" > "$tmp/change.patch"
          echo "$PATCH_SHA  $tmp/change.patch" | sha256sum -c -
          git checkout --detach "$BASE"
          git apply --index --whitespace=error-all "$tmp/change.patch"
          git diff --cached --check
          git -c core.quotePath=false diff --cached --name-only > evidence/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/local-authority-bridge.yml',
            'docs/specs/cloud-gateway-agent-runtime/issue-020a-local-authority-bridge.md',
            'docs/specs/cloud-gateway-agent-runtime/round9-validation.md',
            'src-tauri/src/auth/local_authority.rs',
            'src-tauri/src/auth/mod.rs',
            'src-tauri/src/auth/聊天授权v1.rs',
            'src-tauri/src/auth/聊天授权回归v1.rs',
            'src-tauri/src/runtime/execution_gate.rs',
            'src-tauri/src/runtime/mod.rs',
          }
          paths=set(Path('evidence/changed-files.txt').read_text().splitlines())
          assert paths==allowed,(paths,allowed)
          PY
          git write-tree > evidence/verified-tree.txt
      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Full desktop compile and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/cargo-check.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/cargo-test.txt
      - name: Import hash-verified blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo='Eswink/coding-tools-mcp'
          token=os.environ['GH_TOKEN']
          paths=pathlib.Path('evidence/changed-files.txt').read_text().splitlines()
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          def api(path,body):
              req=urllib.request.Request(
                  'https://api.github.com/repos/'+repo+'/'+path,
                  data=json.dumps(body,separators=(',',':')).encode(),
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
                  method='POST')
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          rows=[]
          for p in paths:
              raw=pathlib.Path(p).read_bytes()
              expected=git('hash-object',p)
              got=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert got['sha']==expected,(p,expected,got.get('sha'))
              mode=git('ls-files','-s','--',p).split()[0]
              rows.append({'path':p,'mode':mode,'sha':expected,'bytes':len(raw)})
          pathlib.Path('evidence/blob-receipt.json').write_text(json.dumps({'tree':git('write-tree'),'ref_modified':False,'blobs':rows},indent=2))
          PY
          git rev-parse HEAD > evidence/base-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-authority-source-r9
          path: evidence/
          retention-days: 14
          if-no-files-found: error
