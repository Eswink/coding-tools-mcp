name: Cloud gateway Rust build preflight
on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime']
    paths: ['.github/workflows/cloud-gateway-rust-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Prepare isolated dependency cache without desktop changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-deps/src" evidence
          cat > "$RUNNER_TEMP/gateway-deps/Cargo.toml" <<'EOF'
          [package]
          name = "coding-tools-cloud-gateway"
          version = "0.1.0"
          edition = "2021"
          [workspace]
          [dependencies]
          axum = { version = "=0.8.4", features = ["form"] }
          tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
          serde = { version = "=1.0.219", features = ["derive"] }
          serde_json = "=1.0.140"
          sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid"] }
          uuid = { version = "=1.16.0", features = ["v4", "serde"] }
          ring = "=0.17.14"
          base64 = "=0.22.1"
          url = "=2.5.4"
          zeroize = "=1.8.1"
          argon2 = "=0.5.3"
          [dev-dependencies]
          tower = { version = "=0.5.2", features = ["util"] }
          http-body-util = "=0.1.3"
          EOF
          printf '// Offline dependency seed; not production source.\n' > "$RUNNER_TEMP/gateway-deps/src/lib.rs"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/gateway-deps/Cargo.toml"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/gateway-deps/Cargo.toml"
          cp "$RUNNER_TEMP/gateway-deps/Cargo.toml" evidence/dependency-seed.toml
          cp "$RUNNER_TEMP/gateway-deps/Cargo.lock" evidence/Cargo.lock
          rustc --version > evidence/rust-version.txt
          cargo --version >> evidence/rust-version.txt
          tar -czf evidence/rust-toolchain.tar.gz -C "$(rustc --print sysroot)" .
          tar -czf evidence/cargo-registry.tar.gz -C "$HOME/.cargo" registry
          git rev-parse HEAD > evidence/source-commit.txt
          sha256sum evidence/*.tar.gz evidence/Cargo.lock > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-gateway-rust-preflight
          path: evidence/
          retention-days: 7
          if-no-files-found: error
