name: Issue81 recovered cloud candidate native verification
on:
  push:
    branches: ['ci/issue81-resume-full-plan']
    paths: ['.ci/issue81-resume-*.b64', '.github/workflows/issue81-resumed-candidate.yml']
permissions:
  contents: read
concurrency:
  group: issue81-resumed-candidate
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - name: Deterministic checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud-gateway
          cache-on-failure: true
      - name: Restore only the exact reviewed 30-file candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root=pathlib.Path('.')
          encoded=''.join((root/f'.ci/issue81-resume-{i}.b64').read_text() for i in range(3))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0d261b71434182bd6b7a791b2717faf5f3980dd3583e486171a2f1cc7c2f9189'
          paths=[s.split(' b/',1)[1] for s in patch.decode().splitlines() if s.startswith('diff --git ')]
          assert len(paths)==len(set(paths))==30
          allowed=('services/cloud-gateway/','docs/specs/cloud-execution-bridge/','tests/delivery/')
          assert all((p.startswith(allowed) or p in ('tools/delivery/manifest.json','.github/workflows/cloud-execution-bridge.yml')) and '..' not in pathlib.PurePosixPath(p).parts for p in paths)
          pathlib.Path('evidence/input.patch').write_bytes(patch)
          subprocess.run(['git','checkout','--detach','2c5d133eaa75d7fc084b8122350d7768ce5b2382'],check=True)
          subprocess.run(['git','apply','--check','evidence/input.patch'],check=True)
          subprocess.run(['git','apply','--index','evidence/input.patch'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='c67f14926b670c16b224e041423b522a19b74823',tree
          files={}
          for name in paths:
              data=pathlib.Path(name).read_bytes(); dest=pathlib.Path('evidence/source')/name
              dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
              files[name]={'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()}
          receipt={'candidate_tree':tree,'baseline':'2c5d133eaa75d7fc084b8122350d7768ce5b2382','local_commit':'5fb868d22cdb6f3a2f6abd12870f9700dbfb5e02','ci_sha':os.environ['GITHUB_SHA'],'files':files}
          pathlib.Path('evidence/source.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print('CANDIDATE_TREE='+tree)
          PY
      - name: Strict gateway compilation and portable contracts
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee evidence/fmt.txt
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/clippy.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib --test service_cli 2>&1 | tee evidence/portable.txt
          cargo rustc --locked --manifest-path services/cloud-gateway/Cargo.toml --lib -- -D warnings 2>&1 | tee evidence/production.txt
          python -m unittest discover -s tests/delivery -p 'test_*.py' 2>&1 | tee evidence/delivery-python.txt
          node --test tests/delivery/*.test.mjs 2>&1 | tee evidence/delivery-js.txt
          node --test tests/cloud-gateway/*.test.mjs 2>&1 | tee evidence/cloud-js.txt
      - name: Complete real PostgreSQL and authenticated transport suite
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/pg81-resumed"
          initdb -D "$RUNNER_TEMP/pg81-resumed/data" -A trust -U mcp_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pg81-resumed/data" -l "$RUNNER_TEMP/pg81-resumed/log" -o "-h 127.0.0.1 -p 55442 -k $RUNNER_TEMP/pg81-resumed" -w start >/dev/null
          trap 'pg_ctl -D "$RUNNER_TEMP/pg81-resumed/data" -m fast -w stop >/dev/null || true' EXIT
          createdb -h 127.0.0.1 -p 55442 -U mcp_test coding_tools_identity_test
          export TEST_DATABASE_URL=postgresql://mcp_test@127.0.0.1:55442/coding_tools_identity_test
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee evidence/full-postgres.txt
          python - <<'PY'
          import pathlib,re
          rows=re.findall(r'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;',pathlib.Path('evidence/full-postgres.txt').read_text())
          assert rows and sum(int(r[1]) for r in rows)==292,rows
          assert all(r[0]=='ok' and r[2]=='0' and r[3]=='0' for r in rows),rows
          PY
      - name: Verify final source identity
        run: |
          set -euo pipefail
          git diff --exit-code --
          test "$(git write-tree)" = c67f14926b670c16b224e041423b522a19b74823
      - name: Preserve source and all failures
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('evidence');root.mkdir(exist_ok=True)
          (root/'hashes.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.name!='hashes.json'},indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-resumed-native-${{ matrix.os }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  canonical-objects:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: issue81-resumed-native-*
          path: checked
      - name: Require source agreement and import unreferenced blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('checked');a=root/'issue81-resumed-native-ubuntu-24.04';b=root/'issue81-resumed-native-windows-2025'
          first=json.loads((a/'source.json').read_text());second=json.loads((b/'source.json').read_text())
          assert first==second and first['ci_sha']==os.environ['GITHUB_SHA']
          assert first['candidate_tree']=='c67f14926b670c16b224e041423b522a19b74823'
          blobs={}
          for path,proof in first['files'].items():
              data=(a/'source'/path).read_bytes()
              assert data==(b/'source'/path).read_bytes() and hashlib.sha256(data).hexdigest()==proof['sha256']
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: sha=json.load(r)['sha']
              assert sha==proof['git_blob'];blobs[path]=sha
          pathlib.Path('canonical-objects.json').write_text(json.dumps({'source':first,'blobs':blobs},indent=2))
          print('CANONICAL_OBJECTS='+json.dumps(blobs,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue81-resumed-canonical-objects
          path: canonical-objects.json
          retention-days: 30
          if-no-files-found: error
