              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'staging-budget-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert staging_budget.execution_valid(loaded, result)
              names = x.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              (evidence / 'inventory-loaded.json').write_text(json.dumps(loaded), encoding='utf-8')
              with (evidence / 'forty-eight-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'inventory-executed.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert x.execution_valid(loaded, result)
              names = admission.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'admission-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'admission-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert admission.execution_valid(loaded, result)
              names = final_admission.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'final-admission-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'final-admission-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert final_admission.execution_valid(loaded, result)
              names = download_budget.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'download-budget-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'download-budget-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert download_budget.execution_valid(loaded, result)
              names = checksum_budget.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'checksum-budget-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'checksum-budget-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert checksum_budget.execution_valid(loaded, result)
              names = archive_budget.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'archive-budget-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'archive-budget-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert archive_budget.execution_valid(loaded, result)
              names = staged_bytes.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'staged-bytes-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'staged-bytes-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert staged_bytes.execution_valid(loaded, result)
              names = supervisor_readiness.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'supervisor-readiness-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'supervisor-readiness-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert supervisor_readiness.execution_valid(loaded, result)
              names = stage_retirement.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'stage-retirement-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'stage-retirement-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert stage_retirement.execution_valid(loaded, result)
              names = windows_vm.inventory()
              suite = unittest.defaultTestLoader.loadTestsFromNames(names)
              loaded = [test.id() for test in c._flatten(suite)]
              with (evidence / 'windows-vm-cases.log').open('w', encoding='utf-8') as output:
                  result = unittest.TextTestRunner(stream=output, verbosity=2, resultclass=c.InventoryResult).run(suite)
              receipt = {'loaded_ids': loaded, 'executed_ids': result.executed_ids, 'tests_run': result.testsRun,
                         'skipped': result.skipped, 'expected_failures': result.expectedFailures, 'unexpected_successes': result.unexpectedSuccesses, 'successful': result.wasSuccessful()}
              (evidence / 'windows-vm-inventory.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              assert windows_vm.execution_valid(loaded, result)
              assert checked() == before and git('rev-parse', 'HEAD') == sha and git('rev-parse', 'HEAD^{tree}') == tree
              (evidence / 'source-after.json').write_text(json.dumps(binding | {'source_unchanged': True}, indent=2) + '\n', encoding='utf-8')
          except BaseException:
              (evidence / 'failure.txt').write_text(traceback.format_exc(), encoding='utf-8'); raise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'issue88-publisher-${{ matrix.os }}-${{ github.sha }}', path: '${{ runner.temp }}/publisher-evidence/', if-no-files-found: error, retention-days: 30}
