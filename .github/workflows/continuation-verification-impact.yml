name: Verification evidence impact review (never merge)

on:
  push:
    branches: ['ci/verification-impact-20260924']
    paths:
      - '.github/workflows/continuation-verification-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 4f925e44c54066b5cf7df57e1133404542d70aec

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Trace-boundary context and impact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          "$graph" query 'TraceJournal snapshot RecoveryView verification evidence local admission' > evidence/query.txt 2>&1
          "$graph" context 'TraceJournal' > evidence/trace-context.txt 2>&1
          "$graph" impact 'Struct:services/local-agent/src/trace.rs:TraceJournal' --direction upstream > evidence/trace-impact.txt 2>&1
          cat evidence/query.txt evidence/trace-context.txt evidence/trace-impact.txt
          git diff --exit-code
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
