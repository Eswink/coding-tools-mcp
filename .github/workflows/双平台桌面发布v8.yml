name: 双平台桌面发布v8
on:
  push:
    branches: ['fix/双平台发布v8', 'release/双平台v8']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-desktop-release-v8-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
jobs:
  ubuntu:
    name: Ubuntu与跨平台全量门禁
    uses: ./.github/workflows/双平台Ubuntu验收v8.yml
  windows:
    name: Windows安装包构建及启动验收
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 从已提交版本构建NSIS
        shell: bash
        run: |
          set -euo pipefail
          python scripts/发布版本校验v4.py --expect-sha "$SOURCE_SHA"
          npm ci
          npm run check
          mkdir -p "$RUNNER_TEMP/安装包构建v8"
          npm run tauri -- build --ci --bundles nsis -- --locked 2>&1 | tee "$RUNNER_TEMP/安装包构建v8/构建日志.txt"
      - name: PE内部版本、真实安装及窗口启动
        shell: pwsh
        run: ./scripts/安装包冒烟v7.ps1 -OutputDirectory "$env:RUNNER_TEMP/发布产物v8"
      - name: 生成绑定源码的安装包来源及摘要
        shell: bash
        run: |
          set -euo pipefail
          python scripts/发布版本校验v4.py --expect-sha "$SOURCE_SHA" --artifacts "$RUNNER_TEMP/发布产物v8" --output "$RUNNER_TEMP/发布产物v8/发布来源v7.json"
          cp docs/releases/双平台安装说明v0.2.6.md "$RUNNER_TEMP/发布产物v8/本地验收说明v7.md"
          printf '\n构建来源：%s；工作流：https://github.com/Eswink/coding-tools-mcp/actions/runs/%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/发布产物v8/本地验收说明v7.md"
      - name: 记录同一工作流身份
        shell: bash
        run: |
          python - <<'PYIDENTITY'
          import json,os,pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'],'发布产物v8','双平台构建身份v8.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'version':'0.2.6'}),encoding='utf-8')
          PYIDENTITY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Windows本地验收安装包v8
          path: ${{ runner.temp }}/发布产物v8/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 安装包诊断v8-非发布产物
          path: |
            ${{ runner.temp }}/发布产物v8/
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/coding-tools-mcp-desktop.exe
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 安装包构建日志v8
          path: ${{ runner.temp }}/安装包构建v8/
          retention-days: 14
          if-no-files-found: warn

  acceptance:
    name: 双平台来源与六附件汇总
    needs: [ubuntu, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/双平台全部证据v8
      - name: 验证两端完整证据，生成候选资产
        run: python scripts/双平台发布v8.py --evidence "$RUNNER_TEMP/双平台全部证据v8" --output "$RUNNER_TEMP/双平台候选发布v8" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: 双平台候选发布v8
          path: |
            ${{ runner.temp }}/双平台候选发布v8/*.deb
            ${{ runner.temp }}/双平台候选发布v8/*.AppImage
            ${{ runner.temp }}/双平台候选发布v8/*.exe
            ${{ runner.temp }}/双平台候选发布v8/*.zip
            ${{ runner.temp }}/双平台候选发布v8/*.txt
            ${{ runner.temp }}/双平台候选发布v8/*.json
          retention-days: 30
          if-no-files-found: error
  publish:
    name: 公开Ubuntu与Windows并匿名下载校验
    needs: [ubuntu, windows, acceptance]
    if: github.ref == 'refs/heads/release/双平台v8' && github.repository == 'Eswink/coding-tools-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/双平台全部证据v8
      - name: 重验候选、锁定main并公开完整发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/双平台发布v8.py --evidence "$RUNNER_TEMP/双平台全部证据v8" --output "$RUNNER_TEMP/双平台正式发布v8" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 双平台公开回执v8
          path: ${{ runner.temp }}/双平台正式发布v8/双平台公开回执v8.json
          retention-days: 90
          if-no-files-found: error
