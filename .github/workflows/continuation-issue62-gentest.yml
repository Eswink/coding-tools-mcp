name: Issue 62 gentest review (never merge)

on:
  push:
    branches: ['ci/issue62-gentest-20260925']
    paths:
      - '.github/workflows/continuation-issue62-gentest.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6
  CANDIDATE_SHA: 1ceeae929da3d0f0e4afb36a9f92e2ca7b19f975

jobs:
  gentest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize exact candidate diff and ask gentest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch origin "$CANDIDATE_SHA"
          git diff "$SOURCE_SHA" "$CANDIDATE_SHA" --             src-tauri/src/platform/linux/net.rs             src-tauri/src/platform/linux/mod.rs             src-tauri/src/platform/mod.rs             src-tauri/src/runtime/port.rs             src-tauri/src/tools/任务恢复传输v2.rs > evidence/candidate.diff
          test -s evidence/candidate.diff
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/request.json
          import json, os, pathlib
          code=pathlib.Path('evidence/candidate.diff').read_text(encoding='utf-8')
          print(json.dumps({
            "code": code,
            "framework": "cargo test",
            "project_root": os.getcwd()
          }, ensure_ascii=False))
          PY
          ./.mcp-probe-kit/bin/probe exec gentest --stdin < evidence/request.json > evidence/gentest.json 2>&1
          cat evidence/gentest.json
          node - <<'NODE'
          const r=require('./evidence/gentest.json');
          if(r.isError===true) process.exit(1);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-gentest
          path: evidence/
          retention-days: 14
          if-no-files-found: error
