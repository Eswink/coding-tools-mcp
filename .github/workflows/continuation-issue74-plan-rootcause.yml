name: Issue 74 root-cause and repair Plan checkpoint (never merge)

on:
  push:
    branches: ['ci/issue74-plan-init-20260926']
    paths:
      - '.github/workflows/continuation-issue74-plan-rootcause.yml'

permissions:
  contents: write

env:
  PLAN_ID: bugfix-issue-74-current-feature-6fe8f8a3f1d-f6abaefb07
  PLAN_PATH: .mcp-probe-kit/plans/bugfix-issue-74-current-feature-6fe8f8a3f1d-f6abaefb07.json
  SOURCE_SHA: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume Plan and persist root-cause/fix-plan evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node - <<'NODE'
          const r=require('./evidence/resume-before.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='src8-4') process.exit(2);
          NODE
          python - <<'PY' > evidence/heartbeat-request.json
          import json, os
          payload={
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["src8-4","src8-5"],
            "evidence":[
              {
                "kind":"other",
                "step_id":"src8-4",
                "summary":"Root cause is a test-fixture TOCTOU: offline_new_authorization binds 127.0.0.1:0 only to discover a Windows dynamic port, drops that reservation, then later asks the production listener to bind the numeric port. Official RC run 36154924658 job 108137017396 failed exactly at that second bind with WSAEADDRINUSE on 64506. Windows 2025 run 36182179349 proves the runner dynamic TCP range is 49152-65535, so 64506 is allocator-owned dynamic space. Three never-merge replicas each passed 30 baseline and 50 synthetic-churn exact repeats; this non-reproduction shows rarity, not safety, because no ownership exists between drop and second bind. Production bind conflict behavior remains correct/fail-closed and GitNexus marks listener bind symbols CRITICAL, so production listener code is not the repair boundary.",
                "reference":"RC run 36154924658 job 108137017396; root-cause run 36172251997; Windows range run 36182179349 artifact 10884817450 sha256:de45d761fd89e7102322eeaaa601c249ba0e15d8920271bb3baf1bffc0b9c0de",
                "revision":os.environ["SOURCE_SHA"]
              },
              {
                "kind":"review",
                "step_id":"src8-4",
                "summary":"Pinned GitNexus 1.6.12 found the failing test symbol exact/UNKNOWN with no resolved upstream callers; spawn_listener/bind_listener remain CRITICAL/exact and are explicitly excluded from the edit. The observed bug is test setup before listener startup, not relaxed production bind semantics.",
                "reference":"Issue 74 root-cause impact run 36172251997 artifact 10880606706 sha256:ca71e87374b48e58014ff6318ace3eeaf1c3e6d95fda75ad98cb551d77e45c3a",
                "revision":os.environ["SOURCE_SHA"]
              },
              {
                "kind":"requirements",
                "step_id":"src8-5",
                "summary":"Minimal repair: remove reserve-drop-rebind from the affected chat HTTP test fixture. Allocate test-only ports from a process-local unique low range 20000-25999, outside the verified Windows dynamic range and the Ubuntu hosted-runner ephemeral range used by existing diagnostics; let spawn_listener perform the only bind. Preserve strict production port conflicts, auth/origin behavior, offline CHAT_AUTHORIZATION_UNAVAILABLE assertions, no pending event/record, clean resume, and bounded shutdown. Do not add sleeps or production retries.",
                "reference":"Issue #74 acceptance plus source src-tauri/src/auth/聊天HTTP回归v1.rs",
                "revision":os.environ["SOURCE_SHA"]
              }
            ],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          node - <<'NODE'
          const r=require('./evidence/resume-after.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='src8-6') process.exit(2);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint issue74 root cause"
          git fetch origin "ci/issue74-plan-init-20260926"
          test "$(git rev-parse "origin/ci/issue74-plan-init-20260926")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue74-plan-init-20260926"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-plan-rootcause
          path: evidence/
          retention-days: 14
          if-no-files-found: error
