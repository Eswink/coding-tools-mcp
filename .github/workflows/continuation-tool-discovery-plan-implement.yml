name: Tool discovery implementation checkpoint (never merge)
on:
  push:
    branches: ['ci/tool-discovery-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-tool-discovery-plan-implement.yml'
permissions:
  contents: write
env:
  PLAN_ID: feature-issue-72-deferred-steady-057f3854d4
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-72-deferred-steady-057f3854d4.json
  CANDIDATE_SHA: 4adc65541381ee881e302fabaf12a61ea5ec0cfc
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Heartbeat implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          python - <<'PY' > evidence/heartbeat.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["implement"],
            "evidence":[{
              "kind":"implementation",
              "step_id":"implement",
              "summary":"Candidate adds a bounded read-only DeferredToolCatalog/discover_deferred contract and focused registry coverage in exactly registry.rs, registry_tests.rs and lib.rs.",
              "reference":"ci/tool-discovery-candidate-review-20260925",
              "revision":os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision":os.environ["CANDIDATE_SHA"]
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint deferred discovery implementation"
          git fetch origin "ci/tool-discovery-plan-init-20260925"
          test "$(git rev-parse "origin/ci/tool-discovery-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/tool-discovery-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-plan-implement
          path: evidence/
          retention-days: 14
          if-no-files-found: error
