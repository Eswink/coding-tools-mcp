name: Issue 73 spec gates and estimate (never merge)

on:
  push:
    branches: ['ci/issue73-plan-start-20260926']
    paths:
      - '.github/workflows/continuation-issue73-spec-gates.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-73-steady-fa65bddc35
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-73-steady-fa65bddc35.json
  SPEC_REVISION: 7d890186eea06c41dad00dc523ba950173ee3f2f
  SOURCE_SHA: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd

jobs:
  spec-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume and checkpoint write-spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node - <<'NODE' > evidence/heartbeat-write-spec.json
          const payload={
            plan_id:process.env.PLAN_ID,
            project_root:process.cwd(),
            completed_step_ids:["context","write-spec"],
            evidence:[{
              kind:"spec",
              step_id:"write-spec",
              summary:"Completed issue-73 requirements/design/tasks with scope-lock, EARS acceptance, real source evidence and line budgets; no placeholders remain.",
              reference:"docs/specs/issue-73/{requirements,design,tasks}.md",
              revision:process.env.SPEC_REVISION
            }],
            last_verified_revision:process.env.SOURCE_SHA
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-write-spec.json > evidence/heartbeat-write-spec-result.json 2>&1
          cat evidence/heartbeat-write-spec-result.json
      - name: Run check_spec and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec check_spec --json "{\"project_root\":\"$PWD\",\"feature_name\":\"issue-73\",\"docs_dir\":\"docs\"}" > evidence/check-spec.json 2>&1
          cat evidence/check-spec.json
          node - <<'NODE'
          const r=require('./evidence/check-spec.json');
          if(r.isError===true || r.structuredContent?.passed!==true) process.exit(1);
          NODE
          node - <<'NODE' > evidence/heartbeat-check-spec.json
          const payload={
            plan_id:process.env.PLAN_ID,
            project_root:process.cwd(),
            completed_step_ids:["context","write-spec","check-spec"],
            evidence:[{
              kind:"spec",
              step_id:"check-spec",
              summary:"mcp-probe check_spec passed for issue-73; implementation remains blocked until estimate is checkpointed.",
              reference:"GitHub Actions run "+process.env.GITHUB_RUN_ID,
              revision:process.env.SPEC_REVISION
            }],
            last_verified_revision:process.env.SOURCE_SHA
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-check-spec.json > evidence/heartbeat-check-spec-result.json 2>&1
          cat evidence/heartbeat-check-spec-result.json
      - name: Estimate bounded implementation and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/estimate-request.json
          import json
          print(json.dumps({
            "task_description":"Implement issue-73 Ubuntu-only local execution sandbox after existing LocalAdmission/ExecPolicy approval, using fail-closed filesystem and network isolation, preserving non-PTY/PTTY lifecycle and Windows semantics.",
            "code_context":"Use docs/specs/issue-73/tasks.md and docs/specs/issue-73/design.md. process.rs is already 741 lines, so sandbox implementation must live in dedicated English-named modules."
          }))
          PY
          ./.mcp-probe-kit/bin/probe exec estimate --stdin < evidence/estimate-request.json > evidence/estimate.json 2>&1
          cat evidence/estimate.json
          node - <<'NODE'
          const r=require('./evidence/estimate.json');
          if(r.isError===true) process.exit(1);
          NODE
          node - <<'NODE' > evidence/heartbeat-estimate.json
          const payload={
            plan_id:process.env.PLAN_ID,
            project_root:process.cwd(),
            completed_step_ids:["context","write-spec","check-spec","estimate"],
            evidence:[{
              kind:"spec",
              step_id:"estimate",
              summary:"mcp-probe estimate completed for the bounded issue-73 implementation after spec validation.",
              reference:"GitHub Actions run "+process.env.GITHUB_RUN_ID,
              revision:process.env.SPEC_REVISION
            }],
            last_verified_revision:process.env.SOURCE_SHA
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-estimate.json > evidence/heartbeat-estimate-result.json 2>&1
          cat evidence/heartbeat-estimate-result.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          node - <<'NODE'
          const r=require('./evidence/resume-after.json');
          if(r.isError===true || r.structuredContent?.nextStepId!=='implement' || r.structuredContent?.mustContinue!==true) process.exit(1);
          NODE
      - name: Persist Plan checkpoints without overwriting another executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): checkpoint issue73 spec gates"
          git fetch origin "ci/issue73-plan-start-20260926"
          test "$(git rev-parse "origin/ci/issue73-plan-start-20260926")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue73-plan-start-20260926"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue73-spec-gates
          path: evidence/
          retention-days: 14
          if-no-files-found: error
