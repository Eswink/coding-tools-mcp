name: Local authority bridge contracts
on:
  push:
    branches: ['ci/local-authority-bridge-r9', 'feat/cloud-gateway-agent-runtime']
    paths:
      - 'src-tauri/src/auth/local_authority.rs'
      - 'src-tauri/src/auth/mod.rs'
      - 'src-tauri/src/auth/聊天授权v1.rs'
      - 'src-tauri/src/auth/聊天授权回归v1.rs'
      - 'src-tauri/src/runtime/execution_gate.rs'
      - 'src-tauri/src/runtime/mod.rs'
      - '.github/workflows/local-authority-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/auth/local_authority.rs'
      - 'src-tauri/src/auth/mod.rs'
      - 'src-tauri/src/auth/聊天授权v1.rs'
      - 'src-tauri/src/auth/聊天授权回归v1.rs'
      - 'src-tauri/src/runtime/execution_gate.rs'
      - 'src-tauri/src/runtime/mod.rs'
      - '.github/workflows/local-authority-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-authority-bridge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile and run desktop authorization regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git diff --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/cargo-check.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/cargo-test.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-authority-bridge-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
