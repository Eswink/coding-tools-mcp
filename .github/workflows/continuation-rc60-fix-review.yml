name: Isolated RC60 fix review (never merge)

on:
  push:
    branches: ['ci/rc60-fix-review-20260923']
    paths: ['.github/workflows/continuation-rc60-fix-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuation-rc60-fix-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Resume plan and bind exact low-risk production symbol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [[ ! -x ./.mcp-probe-kit/bin/probe ]]; then
            npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/probe-install.txt 2>&1
          fi
          printf '{"project_root":"%s"}\n' "$GITHUB_WORKSPACE" | ./.mcp-probe-kit/bin/probe exec resume_plan --stdin > evidence/resume-plan.json 2>&1 || true
          git reset --hard HEAD
          git clean -fd -- .mcp-probe-kit 2>/dev/null || true
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph-analyze.txt 2>&1
          git reset --hard HEAD
          run_uid='Function:src-tauri/src/tools/异步命令v1.rs:run'
          "$graph" impact "$run_uid" --direction upstream > evidence/run-impact.json
          cat evidence/run-impact.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evidence/run-impact.json').read_text(encoding='utf-8'))
          assert data.get('epistemic') == 'exact', data
          assert data.get('risk') in {'LOW','MEDIUM'}, data
          assert data.get('target',{}).get('filePath') == 'src-tauri/src/tools/异步命令v1.rs', data
          PY
      - name: Apply the exact candidate only in this disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('src-tauri/src/tools/异步命令v1.rs')
          text=path.read_text(encoding='utf-8')
          old='''    if ctx.exec_tasks.checkpoint(job).is_err() {\n        job.finish(Status::Failed, json!({"command_ok":false, "termination_reason":"storage_failed_before_spawn"}));\n        return;\n    }\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          new='''    // reserve() already persisted the queued no-replay record. Never put a durable\n    // filesystem checkpoint between the public Running state and actual child spawn.\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          assert text.count(old) == 1
          text=text.replace(old,new)
          old='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          new='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    // Once the child exists, persist Running + session ownership. If that durable\n    // checkpoint fails, stop the child and fail closed rather than leaving an\n    // untracked process behind or inviting an automatic retry.\n    if ctx.exec_tasks.checkpoint(job).is_err() {\n        session.mark_termination_reason("killed");\n        let waited = tauri::async_runtime::block_on(async {\n            tokio::time::timeout(Duration::from_secs(5), session.kill_and_wait()).await.is_ok()\n        });\n        tauri::async_runtime::block_on(async {\n            session.refresh_status().await;\n            session.wait_for_readers().await;\n        });\n        let process_may_be_running = !waited || !session.has_exited();\n        let mut failure = session.snapshot(0);\n        failure["command_ok"] = json!(false);\n        failure["output_complete"] = json!(session.readers_completed());\n        failure["process_may_be_running"] = json!(process_may_be_running);\n        failure["termination_reason"] = json!("storage_failed_after_spawn");\n        failure["error"] = json!({\n            "code": "EXEC_TASK_CHECKPOINT_FAILED",\n            "message": if process_may_be_running {\n                "Durable task checkpoint failed after child start and termination could not be confirmed; inspect local processes and do not retry automatically"\n            } else {\n                "Durable task checkpoint failed after child start; child was terminated and the command must not be retried automatically"\n            }\n        });\n        if let Some(operation) = result.get("operation_id") {\n            failure["operation_id"] = operation.clone();\n        }\n        job.finish(Status::Failed, failure);\n        ctx.sessions.remove(&session.session_id);\n        return;\n    }\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          assert text.count(old) == 1
          text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          text=Path('src-tauri/src/tools/异步命令v1.rs').read_text(encoding='utf-8')
          run=text[text.index('fn run('):text.index('\npub fn get(')]
          spawn=run.index('crate::tools::call_tool(ctx, "exec_command", args)')
          checkpoint=run.index('ctx.exec_tasks.checkpoint(job)')
          assert spawn < checkpoint, (spawn,checkpoint)
          assert 'storage_failed_before_spawn' not in run
          assert 'storage_failed_after_spawn' in run
          assert len(text.splitlines()) < 500
          PY
          git diff --check
          git add -- src-tauri/src/tools/异步命令v1.rs
          git diff --cached --name-only | tee evidence/candidate-files.txt
          test "$(cat evidence/candidate-files.txt)" = 'src-tauri/src/tools/异步命令v1.rs'
          sha256sum src-tauri/src/tools/异步命令v1.rs > evidence/candidate-source.sha256
      - name: Pre-commit graph scope and Rust checks
        shell: bash
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" detect-changes --scope staged > evidence/detect-changes.txt 2>&1
          cat evidence/detect-changes.txt
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml queued_record_is_encrypted_and_restart_never_replays_it -- --exact --nocapture
          cargo test --locked --manifest-path src-tauri/Cargo.toml http_revoked_owner_drains_actual_background_process_before_successor -- --exact --nocapture
          git diff --check
          git rev-parse HEAD > evidence/base-source.txt
          printf '%s\n' 'DISPOSABLE_CANDIDATE_REVIEW_NEVER_MERGE_NOT_A_RELEASE_GATE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-fix-review
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  native:
    needs: review
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply identical candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          path=Path('src-tauri/src/tools/异步命令v1.rs')
          text=path.read_text(encoding='utf-8')
          old='''    if ctx.exec_tasks.checkpoint(job).is_err() {\n        job.finish(Status::Failed, json!({"command_ok":false, "termination_reason":"storage_failed_before_spawn"}));\n        return;\n    }\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          new='''    // reserve() already persisted the queued no-replay record. Never put a durable\n    // filesystem checkpoint between the public Running state and actual child spawn.\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          assert text.count(old) == 1
          text=text.replace(old,new)
          old='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          new='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    // Once the child exists, persist Running + session ownership. If that durable\n    // checkpoint fails, stop the child and fail closed rather than leaving an\n    // untracked process behind or inviting an automatic retry.\n    if ctx.exec_tasks.checkpoint(job).is_err() {\n        session.mark_termination_reason("killed");\n        let waited = tauri::async_runtime::block_on(async {\n            tokio::time::timeout(Duration::from_secs(5), session.kill_and_wait()).await.is_ok()\n        });\n        tauri::async_runtime::block_on(async {\n            session.refresh_status().await;\n            session.wait_for_readers().await;\n        });\n        let process_may_be_running = !waited || !session.has_exited();\n        let mut failure = session.snapshot(0);\n        failure["command_ok"] = json!(false);\n        failure["output_complete"] = json!(session.readers_completed());\n        failure["process_may_be_running"] = json!(process_may_be_running);\n        failure["termination_reason"] = json!("storage_failed_after_spawn");\n        failure["error"] = json!({\n            "code": "EXEC_TASK_CHECKPOINT_FAILED",\n            "message": if process_may_be_running {\n                "Durable task checkpoint failed after child start and termination could not be confirmed; inspect local processes and do not retry automatically"\n            } else {\n                "Durable task checkpoint failed after child start; child was terminated and the command must not be retried automatically"\n            }\n        });\n        if let Some(operation) = result.get("operation_id") {\n            failure["operation_id"] = operation.clone();\n        }\n        job.finish(Status::Failed, failure);\n        ctx.sessions.remove(&session.session_id);\n        return;\n    }\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          sha256sum src-tauri/src/tools/异步命令v1.rs > evidence/candidate-source.sha256
          git rev-parse HEAD > evidence/base-source.txt
      - name: Preserve the original eight-second assertion under repetition
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          test_name='auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor'
          for i in $(seq 1 10); do
            echo "=== candidate targeted attempt $i ===" | tee -a evidence/targeted-summary.txt
            cargo test --locked --offline --manifest-path src-tauri/Cargo.toml "$test_name" -- --exact --nocapture 2>&1 | tee "evidence/targeted-$i.txt"
          done
      - name: Full unchanged test command on candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 | tee evidence/full-suite.txt
          git diff --check
          printf '%s\n' 'DISPOSABLE_CANDIDATE_REVIEW_NEVER_MERGE_NOT_A_RELEASE_GATE' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-fix-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
