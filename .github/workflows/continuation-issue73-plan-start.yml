name: Issue 73 start delegated feature Plan (never merge)

on:
  push:
    branches: ['ci/issue73-plan-start-20260926']
    paths:
      - '.github/workflows/continuation-issue73-plan-start.yml'

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
          fetch-depth: 0
          persist-credentials: false
      - name: Start bounded Ubuntu sandbox feature Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/request.json
          import json, os
          print(json.dumps({
            "project_root": os.getcwd(),
            "description": """Issue #73 / manifest ubuntu-sandbox: add an Ubuntu-only local execution sandbox after LocalAdmission/ExecPolicy approval and before child execution. Fail closed if the required Linux isolation primitive is unavailable. Deny filesystem escape outside the approved workspace and deny network capability by default. Preserve process-tree cancellation, bounded I/O, PTY/non-PTY semantics and existing Windows behavior. Do not implement Hooks, worktrees, snapshots, cloud authority, UI or packaging. Require Ubuntu 24.04 escape/symlink/network/cancellation/process-tree tests, Windows no-change regression, pinned GitNexus impact/detect, exact source hashes, fast-forward/no-force publication, rollback evidence, and keep physical/real-ChatGPT gates deferred.""",
            "spec_layout": "auto"
          }, ensure_ascii=False))
          PY
          ./.mcp-probe-kit/bin/probe exec start_feature --stdin < evidence/request.json > evidence/start-feature.json 2>&1
          cat evidence/start-feature.json
          node - <<'NODE'
          const r=require('./evidence/start-feature.json');
          if(r.isError===true) process.exit(1);
          const s=r.structuredContent||{};
          if(!s.plan && !s.delegatedPlan && !s.plan_id && !s.planId) process.exit(2);
          NODE
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue73-start-feature
          path: evidence/
          retention-days: 14
          if-no-files-found: error
