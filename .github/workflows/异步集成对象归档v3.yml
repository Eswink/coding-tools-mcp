name: 异步集成对象归档v3
on:
  push:
    branches: ['build/异步集成v3']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 精确校验六文件准入补丁并归档对象（不移动引用）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'准入对象v3'
          out.mkdir()
          patch = Path('docs/候选/工作区准入保护v3.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '120bfa35bde309cac6ffc12ed68453004205a85712b43dbded3d3d018b5c6d3c'
          target = 'a2e39d660ab1971eab9193fe906c29130df97a1b'
          patchfile = out/'工作区准入保护v3.patch'
          patchfile.write_bytes(patch)
          subprocess.run(['git','checkout','--detach','e7543627272489973d13029290d1c16d7c76bdfb'],check=True)
          subprocess.run(['git','apply','--index','--check',str(patchfile)],check=True)
          subprocess.run(['git','apply','--index',str(patchfile)],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip() == target
          subprocess.run(['git','diff','--cached','--check'],check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert len(names) == 6 and all(p.startswith('src-tauri/src/') and '..' not in Path(p).parts for p in names)
          entries=[]
          for path in names:
              data=Path(path).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/Eswink/coding-tools-mcp/git/blobs',
                  data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
              assert result['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          (out/'对象清单v3.json').write_text(json.dumps({'tree':target,'entries':entries,'refs_modified':False},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 工作区准入对象v3
          path: ${{ runner.temp }}/准入对象v3/
          retention-days: 7
          if-no-files-found: error
