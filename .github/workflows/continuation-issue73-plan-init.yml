name: Issue 73 initialize delegated Plan checkpoint (never merge)

on:
  push:
    branches: ['ci/issue73-plan-start-20260926']
    paths:
      - '.github/workflows/continuation-issue73-plan-init.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
  PLAN_ID: feature-issue-73-steady-fa65bddc35

jobs:
  init-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild exact Plan and persist first context checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/start-request.json
          import json, os
          print(json.dumps({
            "project_root": os.getcwd(),
            "description": """Issue #73 / manifest ubuntu-sandbox: add an Ubuntu-only local execution sandbox after LocalAdmission/ExecPolicy approval and before child execution. Fail closed if the required Linux isolation primitive is unavailable. Deny filesystem escape outside the approved workspace and deny network capability by default. Preserve process-tree cancellation, bounded I/O, PTY/non-PTY semantics and existing Windows behavior. Do not implement Hooks, worktrees, snapshots, cloud authority, UI or packaging. Require Ubuntu 24.04 escape/symlink/network/cancellation/process-tree tests, Windows no-change regression, pinned GitNexus impact/detect, exact source hashes, fast-forward/no-force publication, rollback evidence, and keep physical/real-ChatGPT gates deferred.""",
            "spec_layout": "auto"
          }, ensure_ascii=False))
          PY
          ./.mcp-probe-kit/bin/probe exec start_feature --stdin < evidence/start-request.json > evidence/start-feature.json 2>&1
          node - <<'NODE' > evidence/heartbeat-request.json
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence/start-feature.json','utf8'));
          if(r.isError===true) process.exit(1);
          const s=r.structuredContent||{};
          const plan=s.metadata?.plan;
          if(!plan || plan.planId!==process.env.PLAN_ID) process.exit(2);
          const payload={
            plan_id: process.env.PLAN_ID,
            project_root: process.cwd(),
            plan,
            completed_step_ids:["context"],
            evidence:[{
              kind:"requirements",
              step_id:"context",
              summary:"AGENTS.md, docs/project-context.md and docs/graph-insights/latest.md/latest.json exist on the exact feature source; init_project_context is not required by the Plan condition.",
              reference:"feature source "+process.env.SOURCE_SHA,
              revision:process.env.SOURCE_SHA
            }],
            last_verified_revision:process.env.SOURCE_SHA
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          plan_path=".mcp-probe-kit/plans/$PLAN_ID.json"
          test -f "$plan_path"
          cat "$plan_path" | tee evidence/plan.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          node - <<'NODE'
          const r=require('./evidence/resume.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='write-spec') process.exit(2);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$plan_path"
          git diff --cached --check
          git commit -m "chore(plan): initialize issue73 sandbox delivery"
          git fetch origin "ci/issue73-plan-start-20260926"
          test "$(git rev-parse "origin/ci/issue73-plan-start-20260926")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue73-plan-start-20260926"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue73-plan-init
          path: evidence/
          retention-days: 14
          if-no-files-found: error
