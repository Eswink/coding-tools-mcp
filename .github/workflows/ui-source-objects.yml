name: UI candidate source objects
on:
  push:
    branches: ['build/ui-refactor-source-v1']
permissions:
  contents: read
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 22f6ed4e5b6db69ab2ac02387252eb73926cd163
          persist-credentials: false
          path: candidate
      - name: Validate reviewed patch and upload unreferenced blobs only
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          head='22f6ed4e5b6db69ab2ac02387252eb73926cd163'
          base_tree='f4c4f36f5b51ccbf3e098e26e716a582d0f6633c'
          target='337fb9633ac5bd70401216a2ab9ae01392222bb2'
          def git(*args): return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==head
          assert git('rev-parse','HEAD^{tree}').decode().strip()==base_tree
          packed=pathlib.Path('../control/docs/ui-transfer-next.xzpart').read_bytes()
          assert len(packed)==3164 and hashlib.sha256(packed).hexdigest()=='12bb877230c7312cbfca990167d3954b7487c4d918fdeddeb82ffea2dfe6a4d8'
          decoder=lzma.LZMADecompressor(); patch=decoder.decompress(packed,max_length=7680)
          assert decoder.eof and not decoder.unused_data and len(patch)==7679
          assert hashlib.sha256(patch).hexdigest()=='8382001dc32cb09290778841eead085bad6ef6f1bb932371667378191c91f304'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          assert git('write-tree').decode().strip()==target
          api='https://api.github.com/repos/Eswink/coding-tools-mcp'
          def request(path,data=None):
              headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'}
              raw=None if data is None else json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request(api+path,data=raw,headers=headers),timeout=30) as response:
                  return json.load(response)
          assert request('/git/ref/heads/feat/ui-refactor-v1')['object']['sha']==head
          paths=[p.decode() for p in git('diff','--cached','--name-only','-z').split(b'\0') if p]
          assert len(paths)==5
          entries=[]
          for path in paths:
              mode,sha,stage=git('ls-files','--stage','--',path).decode().split('\t',1)[0].split()
              assert mode=='100644' and stage=='0'
              raw=git('cat-file','blob',sha)
              blob=request('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert blob['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          evidence=pathlib.Path('../object-evidence');evidence.mkdir()
          (evidence/'source-objects.json').write_text(json.dumps({'base':head,'base_tree':base_tree,'tree':target,'files':entries,'refs_changed':False,'publication':False},indent=2))
          print('Verified local source tree:',target,'uploaded blobs:',len(entries),'No remote tree, refs, commits or releases modified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-candidate-source-objects
          path: object-evidence/
          if-no-files-found: error
          retention-days: 14
