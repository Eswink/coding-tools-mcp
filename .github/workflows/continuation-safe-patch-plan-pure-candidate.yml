name: Safe patch pure candidate plan checkpoint (never merge)

on:
  push:
    branches: ['ci/safe-patch-plan-heartbeat-init-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-plan-pure-candidate.yml'

permissions:
  contents: write

env:
  PLAN_ID: feature-issue-68-safe-patch-steady-fb01dcf53f
  CANDIDATE_SHA: c177357aca6d7f428d558d4994682b183faef39e
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-68-safe-patch-steady-fb01dcf53f.json

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resume and bind Plan to pure production candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          python - <<'PY' > evidence/heartbeat-request.json
          import json, os
          c=os.environ["CANDIDATE_SHA"]
          payload={
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["implement","test"],
            "declared_scope":{
              "files":[
                "src-tauri/src/tools/patch.rs",
                "src-tauri/src/tools/patch_transaction.rs",
                "src-tauri/src/tools/patch_transaction_tests.rs"
              ],
              "issue":68,
              "base_revision":"13d01cd9c478db7ef82fac18428c1f6d5bbaf426"
            },
            "evidence":[
              {
                "kind":"implementation",
                "step_id":"implement",
                "summary":"Canonical production candidate is a single direct child of feature source and contains exactly the three transactional patch files; no helper workflow is part of the commit.",
                "reference":"review/safe-patch-production-candidate-20260924",
                "revision":c
              },
              {
                "kind":"test",
                "step_id":"test",
                "summary":"Exact pure candidate validation run 35958663024: staged GitNexus LOW; Windows 2025 and Ubuntu 24.04 candidate-file Clippy 0 errors; focused transaction tests, full desktop Rust suite (404 passed), and cargo check all passed.",
                "reference":"GitHub Actions run 35958663024; Windows artifact 10791986069 sha256:e908c55fc0908934075bbed923f0b1fff0e84a6688addda7020f0ebb79885c54; Ubuntu artifact 10791742250 sha256:efa0b0fe10869c06c9e7e58be5c7a8f6767d4cbb3b8b1d272901b6c9f8d3d68e; impact artifact 10791751803 sha256:d6e9938a0e9c1e40a357c6e205e2c6825c404fe4e936565f2f2ef8180118a99f",
                "revision":c
              }
            ],
            "runtime_evidence":[
              {
                "kind":"test",
                "summary":"Windows 2025 pure candidate full regression 404 passed; focused patch transaction tests passed; cargo check passed.",
                "reference":"run 35958663024 job 107502285712",
                "revision":c
              },
              {
                "kind":"test",
                "summary":"Ubuntu 24.04 pure candidate full regression 404 passed; focused patch transaction tests passed; cargo check passed.",
                "reference":"run 35958663024 job 107502285808",
                "revision":c
              },
              {
                "kind":"impact",
                "summary":"GitNexus staged detect: 3 files, 2 symbols, LOW. Exact SHA-256 recorded in impact artifact.",
                "reference":"run 35958663024 job 107502285839",
                "revision":c
              }
            ],
            "last_verified_revision":c
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          cat "$PLAN_PATH" | tee evidence/plan-after.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.PLAN_PATH,'utf8'));
          if(p.lastVerifiedRevision!==process.env.CANDIDATE_SHA) process.exit(1);
          if(p.currentStepId!=='review') process.exit(2);
          const scopes=new Set(p.declaredScope?.files||[]);
          for(const f of ['src-tauri/src/tools/patch.rs','src-tauri/src/tools/patch_transaction.rs','src-tauri/src/tools/patch_transaction_tests.rs']) if(!scopes.has(f)) process.exit(3);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): bind safe-patch pure candidate"
          git fetch origin "ci/safe-patch-plan-heartbeat-init-20260924"
          test "$(git rev-parse "origin/ci/safe-patch-plan-heartbeat-init-20260924")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/safe-patch-plan-heartbeat-init-20260924"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-plan-pure-candidate
          path: evidence/
          retention-days: 14
          if-no-files-found: error
