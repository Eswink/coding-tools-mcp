name: Tool runtime foundation
on:
  push:
    branches: ['ci/tool-runtime-r11']
    paths:
      - 'services/local-agent/**'
      - '.github/workflows/tool-runtime-foundation-r11.yml'
permissions:
  contents: read
concurrency:
  group: tool-runtime-foundation-r11
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Additive local tool contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo fmt --manifest-path services/local-agent/Cargo.toml
          cargo generate-lockfile --manifest-path services/local-agent/Cargo.toml
          cargo fmt --check --manifest-path services/local-agent/Cargo.toml
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/tests.txt
          cargo check --locked --manifest-path services/local-agent/Cargo.toml
          git diff --name-only 19fc7ce0b97fb7f02e5f3f195aa034e66c9b8446 HEAD > evidence/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('evidence/changed-files.txt').read_text().splitlines()
          assert paths
          assert all(p.startswith('services/local-agent/') or p=='.github/workflows/tool-runtime-foundation-r11.yml' for p in paths), paths
          PY
          git add -- services/local-agent
          git diff --cached --check
          git write-tree > evidence/verified-tree.txt
          mkdir -p evidence/source
          cp -R services/local-agent/. evidence/source/
          git rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-runtime-foundation-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
