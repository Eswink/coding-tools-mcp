name: Issue 62 implementation Plan checkpoint (never merge)

on:
  push:
    branches: ['ci/issue62-plan-implementation-20260925']
    paths:
      - '.github/workflows/continuation-issue62-plan-implementation.yml'

permissions:
  contents: write

env:
  PLAN_ID: bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b
  PLAN_PATH: .mcp-probe-kit/plans/bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b.json
  PLAN_REF: affd234f63e5292475321de726bb2fe9b8372940
  PLAN_BRANCH: ci/issue62-plan-init-20260924
  CANDIDATE_SHA: 1ceeae929da3d0f0e4afb36a9f92e2ca7b19f975

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4dc9f9d872c134d381cb1eba76999d34231d3ba6
          fetch-depth: 0
          persist-credentials: true
      - name: Resume Plan and persist src8-6 implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .mcp-probe-kit/plans
          git fetch origin "$PLAN_REF"
          git show "$PLAN_REF:$PLAN_PATH" > "$PLAN_PATH"
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          python - <<'PY' > evidence/heartbeat-request.json
          import json, os
          payload={
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["src8-6"],
            "evidence":[{
              "kind":"implementation",
              "step_id":"src8-6",
              "summary":"Implemented the revised #62 repair in a never-merge candidate: Linux exact LISTEN presence remains separate from PID ownership; runtime port waits treat ownerless LISTEN as busy using existing bounded polling; recovery regression awaits the production restart-safe shutdown boundary. CRITICAL mcp/listener.rs is unchanged.",
              "reference":"ci/issue62-ownerless-listen-candidate-20260925",
              "revision":os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision":os.environ["CANDIDATE_SHA"]
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-request.json > evidence/heartbeat.json 2>&1
          cat evidence/heartbeat.json
          cat "$PLAN_PATH" | tee evidence/plan-after.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.PLAN_PATH,'utf8'));
          if(!p.completedStepIds.includes('src8-6')) process.exit(1);
          if(!p.evidence.some(e=>e.stepId==='src8-6' && e.kind==='implementation')) process.exit(2);
          NODE
          git fetch origin "$PLAN_BRANCH"
          test "$(git rev-parse "origin/$PLAN_BRANCH")" = "$PLAN_REF"
          state="$RUNNER_TEMP/plan-state"
          git worktree add --detach "$state" "$PLAN_REF"
          mkdir -p "$state/$(dirname "$PLAN_PATH")"
          cp "$PLAN_PATH" "$state/$PLAN_PATH"
          git -C "$state" config user.name github-actions
          git -C "$state" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$state" add "$PLAN_PATH"
          git -C "$state" diff --cached --check
          git -C "$state" commit -m "chore(plan): checkpoint issue62 implementation"
          git -C "$state" push origin "HEAD:$PLAN_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-plan-implementation
          path: evidence/
          retention-days: 14
          if-no-files-found: error
