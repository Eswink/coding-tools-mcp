name: Exact desktop sandbox source import
on:
  push:
    branches: ['ci/desktop-sandbox-source-import']
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/ci/desktop-sandbox-source-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13a868a7169c698c06eb98ccab9cf689a307db8c
          persist-credentials: false
      - name: Validate nine-path delta and import unreferenced source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          base='13a868a7169c698c06eb98ccab9cf689a307db8c'
          expected='b6e6a83324c559b1291e0be5b65bc61f3a9efb5c'
          allowed={
            'services/local-agent/src/sandbox/linux.rs','services/local-agent/src/sandbox/mod.rs',
            'services/local-agent/tests/linux_read_only.rs','src-tauri/src/harness/state.rs',
            'src-tauri/src/tools/execution_sandbox.rs','src-tauri/src/tools/git.rs',
            'src-tauri/src/tools/git_runner.rs','src-tauri/src/tools/git_runner_tests.rs','src-tauri/src/tools/mod.rs',
          }
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/Eswink/coding-tools-mcp/'+path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                    'Accept':'application/vnd.github+json','Content-Type':'application/json',
                    'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          assert git('rev-parse','HEAD')==base
          encoded=''.join(api('git/blobs/ec21015fde5fe08540df0aa166736cede7f4ae9a')['content'].split())
          # Repair two identified transcription differences in the transfer
          # envelope only. Exact original compressed-object AND patch hashes
          # must match before any source object is imported.
          encoded=encoded.replace('Ed927M9f921','Ed927M9r921').replace('DckevQ5efKfFzpKfF4','DckevQ5efKzpKfF4')
          packed=base64.b64decode(encoded,validate=True)
          obj=hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()
          print('transfer_object',obj, 'bytes',len(packed))
          assert obj=='9d0efae225d2889635bcc8bf47fa419b2babed2b'
          patch=gzip.decompress(packed)
          digest=hashlib.sha256(patch).hexdigest()
          assert len(patch)==25637 and digest=='a22fc559083cfe84afbb31183f4ac1b1ca7edef57bad6749d8ec17dc544ce771'
          subprocess.run(['git','apply','--index','--binary','-'],input=patch,check=True)
          paths=set(git('diff','--cached','--name-only').splitlines())
          assert paths==allowed and git('write-tree')==expected
          entries=[]
          for path in sorted(paths):
              data=pathlib.Path(path).read_bytes()
              blob=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert blob['sha']==git('hash-object',path)
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          assert tree['sha']==expected
          commit=api('git/commits',{'message':'fix(desktop): isolate read-only Git helpers and retain bounded execution (#73)',
                                    'tree':expected,'parents':[base]})
          receipt={'base':base,'tree':expected,'commit':commit['sha'],'patch_sha256':digest,
                   'files':entries,'refs_updated':False,'release_created':False}
          pathlib.Path('evidence/source-import.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-source-import-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
