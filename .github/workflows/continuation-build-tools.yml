name: Isolated continuation build tools (never merge)
on:
  push:
    branches: ['ci/continuation-build-tools-20260923']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6dc6a453df4faefd7743d9ccc667d9bd6366aa62
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Prepare public dependency tools only, without credentials or runner configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/continuation-node"
          cargo fetch --locked --manifest-path services/local-agent/Cargo.toml
          npm install --prefix "$RUNNER_TEMP/continuation-node" --no-audit --no-fund gitnexus@1.6.9 mcp-probe-kit@4.0.1
          toolchain="$(rustc --print sysroot)"
          test -d "$toolchain/bin" && test -d "$toolchain/lib"
          tar -czf evidence/rust-tools.tar.gz -C "$toolchain" bin lib libexec
          tar -czf evidence/cargo-registry.tar.gz -C "$HOME/.cargo" registry
          tar -czf evidence/node-tools.tar.gz -C "$RUNNER_TEMP/continuation-node" node_modules package.json package-lock.json
          rustc --version > evidence/rust-version.txt
          cargo --version > evidence/cargo-version.txt
          node --version > evidence/node-version.txt
          git rev-parse HEAD > evidence/source-commit.txt
          git bundle create evidence/source.bundle HEAD
          (cd evidence && sha256sum *.tar.gz source.bundle > SHA256SUMS)
          # Keep each connector download below its documented 512 MiB limit.
          test "$(stat -c %s evidence/rust-tools.tar.gz)" -lt 520000000
          test "$(stat -c %s evidence/node-tools.tar.gz)" -lt 520000000
          ls -lh evidence/
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-rust-tools
          path: evidence/rust-tools.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-node-tools
          path: evidence/node-tools.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-source-registry-evidence
          path: |
            evidence/cargo-registry.tar.gz
            evidence/source.bundle
            evidence/*.txt
            evidence/SHA256SUMS
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
