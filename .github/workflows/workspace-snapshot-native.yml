name: Explicit workspace snapshot native contract
on:
  push:
    branches: ['ci/workspace-snapshot-native']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Native disposable filesystem contracts
        id: native
        shell: bash
        run: |
          set -o pipefail
          rustc --version --verbose
          cargo --version
          cargo test --manifest-path tests/snapshot-fixture/Cargo.toml --locked -- --nocapture 2>&1 | tee snapshot-native-tests.log
      - name: Exact-source receipt
        if: always()
        shell: bash
        run: |
          python tests/snapshot-fixture/source-receipt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-native-${{ matrix.os }}
          path: |
            snapshot-native-tests.log
            snapshot-native-receipt.json
