name: Round 17C missing-default collection applicator

on:
  push:
    branches: ['fix/linux-startup-platform']
    paths:
      - '.round17d/READY'

permissions:
  contents: write

concurrency:
  group: round17d-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate exact RC4 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .round17d/BASE)" = "b1ddb5b0f5b517972886c4a2960f4abfff0157c1"
          git merge-base --is-ancestor "$(cat .round17d/BASE)" HEAD
          grep -qx 'candidate=0.6.0-rc.4' .round17d/READY
          python3 -m py_compile .round17d/apply.py
          npm version 0.6.0-rc.4 --no-git-tag-version --allow-same-version
          python3 .round17d/apply.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null
          npm ci
          npm run check
          git diff --check
      - name: Commit exact RC4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round17d
          rm -f .github/workflows/round17d-apply.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(linux): initialize missing default credential collection"
          candidate="$(git rev-parse HEAD)"
          python3 scripts/rc_version_gate.py --expect-version 0.6.0-rc.4 --expect-sha "$candidate"
          git push origin HEAD:fix/linux-startup-platform
