name: Round 17C missing-default collection applicator

on:
  push:
    branches: ['fix/linux-startup-platform']
    paths:
      - '.round17d/READY'

permissions:
  contents: write

concurrency:
  group: round17d-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify evidence, apply exact patch, and prepare locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .round17d/BASE)" = "b1ddb5b0f5b517972886c4a2960f4abfff0157c1"
          git merge-base --is-ancestor "$(cat .round17d/BASE)" HEAD
          grep -qx 'candidate=0.6.0-rc.4' .round17d/READY

          git apply --check .round17d/patch.diff
          git apply .round17d/patch.diff

          npm version 0.6.0-rc.4 --no-git-tag-version --allow-same-version

          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/Cargo.lock")
          text = path.read_text(encoding="utf-8")
          marker = '[[package]]\nname = "coding-tools-mcp-desktop"\n'
          start = text.index(marker)
          end = text.index("\n[[package]]", start + len(marker))
          block = text[start:end]
          if 'version = "0.6.0-rc.3"' not in block:
              raise SystemExit("project Cargo.lock version was not rc.3")
          block = block.replace('version = "0.6.0-rc.3"', 'version = "0.6.0-rc.4"', 1)
          if '"dbus-secret-service",' not in block:
              needle = ' "dbus",\n'
              if needle not in block:
                  raise SystemExit("project Cargo.lock dependency list has no dbus entry")
              block = block.replace(needle, needle + ' "dbus-secret-service",\n', 1)
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null
          git diff --check

      - name: Commit exact RC4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .round17d
          rm -f .github/workflows/round17d-apply.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(linux): initialize missing default credential collection"
          candidate="$(git rev-parse HEAD)"
          python3 scripts/rc_version_gate.py \
            --expect-version 0.6.0-rc.4 \
            --expect-sha "$candidate"
          git push origin HEAD:fix/linux-startup-platform
