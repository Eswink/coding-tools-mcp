              '[target.\'cfg(target_os = "linux")\'.dependencies]\ndbus = "0.9"\ndbus-secret-service = { version = "=4.0.3", features = ["crypto-rust"] }',
          )
          replace_once(
              "src-tauri/tauri.conf.json",
              '"version": "0.6.0-rc.3"',
              '"version": "0.6.0-rc.4"',
