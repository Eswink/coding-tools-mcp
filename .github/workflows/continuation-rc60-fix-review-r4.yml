name: Isolated RC60 Windows candidate review r4 (never merge)

on:
  push:
    branches: ['ci/rc60-fix-review-20260923-r4']
    paths: ['.github/workflows/continuation-rc60-fix-review-r4.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply disposable candidate and inspect staged blast radius
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git reset --hard "$BASE_SHA"
          "$graph" impact 'Function:src-tauri/src/tools/异步命令v1.rs:run' --direction upstream | tee evidence/impact.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('evidence/impact.json').read_text(encoding='utf-8'))
          assert d['epistemic']=='exact' and d['risk'] in {'LOW','MEDIUM'}, d
          p=Path('src-tauri/src/tools/异步命令v1.rs')
          s=p.read_text(encoding='utf-8')
          a='''    if ctx.exec_tasks.checkpoint(job).is_err() {\n        job.finish(Status::Failed, json!({"command_ok":false, "termination_reason":"storage_failed_before_spawn"}));\n        return;\n    }\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          b='''    // reserve() already persisted the queued no-replay record. Never put a durable\n    // filesystem checkpoint between the public Running state and actual child spawn.\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          c='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          e='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    // Persist Running only after the real child/session exists. Failure here is fail-closed:\n    // terminate the child, preserve uncertainty, and never invite automatic replay.\n    if ctx.exec_tasks.checkpoint(job).is_err() {\n        session.mark_termination_reason("killed");\n        let waited = tauri::async_runtime::block_on(async {\n            tokio::time::timeout(Duration::from_secs(5), session.kill_and_wait()).await.is_ok()\n        });\n        tauri::async_runtime::block_on(async {\n            session.refresh_status().await;\n            session.wait_for_readers().await;\n        });\n        let process_may_be_running = !waited || !session.has_exited();\n        let mut failure = session.snapshot(0);\n        failure["command_ok"] = json!(false);\n        failure["output_complete"] = json!(session.readers_completed());\n        failure["process_may_be_running"] = json!(process_may_be_running);\n        failure["termination_reason"] = json!("storage_failed_after_spawn");\n        failure["error"] = json!({"code":"EXEC_TASK_CHECKPOINT_FAILED","message":\n            if process_may_be_running {"Durable checkpoint failed after child start and termination is unconfirmed; do not retry automatically"}\n            else {"Durable checkpoint failed after child start; child was terminated and must not be retried automatically"}});\n        if let Some(operation) = result.get("operation_id") { failure["operation_id"] = operation.clone(); }\n        job.finish(Status::Failed, failure);\n        ctx.sessions.remove(&session.session_id);\n        return;\n    }\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,e),encoding='utf-8')
          PY
          git add -- src-tauri/src/tools/异步命令v1.rs
          "$graph" detect-changes --scope staged | tee evidence/detect-changes.txt
          test "$(git -c core.quotePath=false diff --cached --name-only)" = 'src-tauri/src/tools/异步命令v1.rs'
          sha256sum src-tauri/src/tools/异步命令v1.rs | tee evidence/candidate.sha256
          printf '%s\n' 'NEVER_MERGE_HELPER' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc60-r4-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  windows:
    needs: impact
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply identical candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/tools/异步命令v1.rs'); s=p.read_text(encoding='utf-8')
          a='''    if ctx.exec_tasks.checkpoint(job).is_err() {\n        job.finish(Status::Failed, json!({"command_ok":false, "termination_reason":"storage_failed_before_spawn"}));\n        return;\n    }\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          b='''    // reserve() already persisted the queued no-replay record. Never put a durable\n    // filesystem checkpoint between the public Running state and actual child spawn.\n    // Keep ALL policy/baseline/operation logging in the one shared execution dispatcher.\n'''
          c='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          e='''    job.data.lock().expect("job state").session = Some(session.clone());\n    // Noninteractive tasks cannot supply stdin. Close it so read-to-EOF programs do not hang.\n    tauri::async_runtime::block_on(async {\n        session.stdin.lock().await.take();\n        session.mark_stdin_closed();\n    });\n    // Persist Running only after the real child/session exists. Failure here is fail-closed:\n    // terminate the child, preserve uncertainty, and never invite automatic replay.\n    if ctx.exec_tasks.checkpoint(job).is_err() {\n        session.mark_termination_reason("killed");\n        let waited = tauri::async_runtime::block_on(async {\n            tokio::time::timeout(Duration::from_secs(5), session.kill_and_wait()).await.is_ok()\n        });\n        tauri::async_runtime::block_on(async {\n            session.refresh_status().await;\n            session.wait_for_readers().await;\n        });\n        let process_may_be_running = !waited || !session.has_exited();\n        let mut failure = session.snapshot(0);\n        failure["command_ok"] = json!(false);\n        failure["output_complete"] = json!(session.readers_completed());\n        failure["process_may_be_running"] = json!(process_may_be_running);\n        failure["termination_reason"] = json!("storage_failed_after_spawn");\n        failure["error"] = json!({"code":"EXEC_TASK_CHECKPOINT_FAILED","message":\n            if process_may_be_running {"Durable checkpoint failed after child start and termination is unconfirmed; do not retry automatically"}\n            else {"Durable checkpoint failed after child start; child was terminated and must not be retried automatically"}});\n        if let Some(operation) = result.get("operation_id") { failure["operation_id"] = operation.clone(); }\n        job.finish(Status::Failed, failure);\n        ctx.sessions.remove(&session.session_id);\n        return;\n    }\n    let mut checkpoint_at = std::time::Instant::now();\n'''
          assert s.count(a)==1 and s.count(c)==1
          p.write_text(s.replace(a,b).replace(c,e),encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          sha256sum src-tauri/src/tools/异步命令v1.rs | tee evidence/candidate.sha256
          sha256sum src-tauri/src/auth/exclusive_refresh_http_tests.rs | tee evidence/rc60-test.sha256
          grep -F 'worker must really start within original 8s gate' src-tauri/src/auth/exclusive_refresh_http_tests.rs
      - name: Exact RC60 target x10
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          t='auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor'
          for i in $(seq 1 10); do
            cargo test --locked --offline --manifest-path src-tauri/Cargo.toml "$t" -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
            grep -F 'http_revoked_owner_drains_actual_background_process_before_successor ... ok' "evidence/exact-$i.txt"
          done
      - name: No-replay regression
        run: |
          set -euo pipefail
          cargo test --locked --offline --manifest-path src-tauri/Cargo.toml queued_record_is_encrypted_and_restart_never_replays_it -- --nocapture 2>&1 | tee evidence/no-replay.txt
          grep -F 'queued_record_is_encrypted_and_restart_never_replays_it ... ok' evidence/no-replay.txt
      - name: Full RC-equivalent Rust gates
        run: |
          set -euo pipefail
          cargo check --locked --offline --all-targets --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/check.txt
          cargo test --locked --offline --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full-tests.txt
          cargo rustc --locked --offline --lib --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee evidence/warnings.txt
          git diff --check
          git rev-parse HEAD | tee evidence/base-source.txt
          test "$(cat evidence/base-source.txt)" = "$BASE_SHA"
          printf '%s\n' 'DISPOSABLE_CANDIDATE_NEVER_MERGE_NOT_RELEASE_PASS' > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc60-r4-windows
          path: evidence/
          retention-days: 14
          if-no-files-found: error
