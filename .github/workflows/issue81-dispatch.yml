name: Issue 81 production dispatch safety
on:
  push:
    branches: ['test/issue81-admission-linearization', 'feat/issue81-full-bridge']
    paths: ['services/cloud-gateway/**', '.github/workflows/issue81-dispatch.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue81-dispatch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud-gateway
      - name: Actual PostgreSQL dispatch linearization tests
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cluster="$(mktemp -d "$RUNNER_TEMP/ctm-dispatch.XXXXXX")"
          initdb -D "$cluster/data" -A trust -U admission_test --encoding=UTF8 --no-locale >/dev/null
          # Disposable, explicitly loopback-only database; fail on bind conflict.
          port="$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          pg_ctl -D "$cluster/data" -l "$cluster/postgres.log" -o "-h 127.0.0.1 -p $port -k $cluster" -w start >/dev/null
          trap 'pg_ctl -D "$cluster/data" -m fast -w stop >/dev/null' EXIT
          createdb -h 127.0.0.1 -p "$port" -U admission_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://admission_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test dispatch_linearization -- --nocapture 2>&1 | tee evidence/dispatch-linearization.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee evidence/full-gateway.txt
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/clippy.txt
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee evidence/format.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue81-dispatch-postgres-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
