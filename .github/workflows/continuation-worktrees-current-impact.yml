name: Worktree current-source impact review (never merge)

on:
  push:
    branches: ['ci/worktrees-current-impact-20260925']
    paths:
      - '.github/workflows/continuation-worktrees-current-impact.yml'

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f4f93af9ee28aa209bb67643421725fcb22fb7e5
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Review current worktree integration symbols
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f4f93af9ee28aa209bb67643421725fcb22fb7e5'
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          for target in             'Struct:src-tauri/src/harness/state.rs:Harness'             'File:src-tauri/src/harness/mod.rs'
          do
            safe="$(printf '%s' "$target" | tr '/:.' '____')"
            "$graph" context "$target" > "evidence/context-$safe.txt" 2>&1 || true
            "$graph" impact "$target" --direction upstream > "evidence/impact-$safe.txt" 2>&1 || true
            echo "=== $target ==="
            cat "evidence/context-$safe.txt" "evidence/impact-$safe.txt"
          done
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-current-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
