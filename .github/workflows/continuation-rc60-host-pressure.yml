name: RC60 host-pressure diagnostic (never merge)

on:
  push:
    branches: ['ci/rc60-host-pressure-20260923']
    paths:
      - '.github/workflows/continuation-rc60-host-pressure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc60-host-pressure-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 4f925e44c54066b5cf7df57e1133404542d70aec

jobs:
  pressure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Bind immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Record environment and prebuild once
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "source_sha=$SOURCE_SHA"
            echo "number_of_processors=${NUMBER_OF_PROCESSORS:-}"
            if command -v nproc >/dev/null 2>&1; then echo "nproc=$(nproc)"; fi
            python --version
            rustc -vV
          } | tee evidence/environment.txt
          git diff --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/cargo-check.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run 2>&1 | tee evidence/lib-prebuild.txt
      - name: Exact readiness sanity
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor \
            -- --exact --nocapture 2>&1 | tee evidence/exact-sanity.txt
      - name: Measure readiness under bounded host CPU pressure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          out = Path('evidence')
          target = 'auth::exclusive_refresh_http_tests::http_revoked_owner_drains_actual_background_process_before_successor'
          base = ['cargo', 'test', '--locked', '--manifest-path', 'src-tauri/Cargo.toml', '--lib']
          rows = []
          failures = 0

          def burn_processes(count):
              procs = []
              for _ in range(count):
                  procs.append(subprocess.Popen(
                      [sys.executable, '-c', 'while True: pass'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  ))
              if procs:
                  time.sleep(0.75)
              return procs

          def stop_processes(procs):
              for p in procs:
                  if p.poll() is None:
                      p.terminate()
              deadline = time.time() + 3.0
              for p in procs:
                  remain = max(0.0, deadline - time.time())
                  try:
                      p.wait(timeout=remain)
                  except subprocess.TimeoutExpired:
                      p.kill()
              for p in procs:
                  try:
                      p.wait(timeout=1.0)
                  except subprocess.TimeoutExpired:
                      pass

          def run_case(kind, workers, trial):
              global failures
              label = f'{kind}-workers-{workers}-trial-{trial}'
              log_path = out / f'{label}.txt'
              if kind == 'exact':
                  cmd = base + [target, '--', '--exact', '--nocapture']
              else:
                  cmd = base + ['--', '--show-output']
              burners = burn_processes(workers)
              started = time.monotonic()
              try:
                  proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
              finally:
                  stop_processes(burners)
              elapsed_ms = int((time.monotonic() - started) * 1000)
              log_path.write_text(proc.stdout, encoding='utf-8')
              matches = re.findall(r'drain-startup ready after ([0-9]+)ms', proc.stdout)
              readiness = int(matches[-1]) if matches else None
              rows.append({
                  'kind': kind,
                  'workers': workers,
                  'trial': trial,
                  'readiness_ms': readiness if readiness is not None else 'NA',
                  'elapsed_ms': elapsed_ms,
                  'exit_code': proc.returncode,
              })
              print(f'{label}: readiness_ms={readiness} elapsed_ms={elapsed_ms} exit_code={proc.returncode}', flush=True)
              if proc.returncode != 0:
                  failures += 1

          for workers in (0, 1, 2, 3):
              for trial in (1, 2):
                  run_case('exact', workers, trial)
          for workers in (0, 3):
              for trial in (1, 2):
                  run_case('full', workers, trial)

          with (out / 'readiness.csv').open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['kind', 'workers', 'trial', 'readiness_ms', 'elapsed_ms', 'exit_code'])
              writer.writeheader()
              writer.writerows(rows)

          numeric = [int(r['readiness_ms']) for r in rows if r['readiness_ms'] != 'NA']
          max_ready = max(numeric) if numeric else -1
          (out / 'result.txt').write_text(
              f'suite_failures={failures}\nmax_readiness_ms={max_ready}\n',
              encoding='utf-8',
          )
          print((out / 'readiness.csv').read_text(encoding='utf-8'))
          print((out / 'result.txt').read_text(encoding='utf-8'))
          if failures:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-host-pressure-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
