name: Issue 74 Windows port handoff candidate review (never merge)

on:
  push:
    branches: ['ci/issue74-candidate-review-20260926']
    paths:
      - 'src-tauri/src/auth/聊天HTTP回归v1.rs'
      - '.github/workflows/continuation-issue74-candidate-review.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
  PRODUCT_SHA: 80de02f13d696272b4e4a6fb0b0e5b44c899dabc

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify test-only staged delta and production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          test "$(git rev-parse "$PRODUCT_SHA")" = "$PRODUCT_SHA"
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          git checkout "$SOURCE_SHA"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          target='Function:src-tauri/src/auth/聊天HTTP回归v1.rs:offline_new_authorization_is_a_non_oauth_tool_error_and_resumes_cleanly'
          "$graph" context "$target" > evidence/context.txt 2>&1 || true
          "$graph" impact "$target" --direction upstream > evidence/impact.txt 2>&1 || true
          cat evidence/context.txt evidence/impact.txt
          git checkout "$PRODUCT_SHA" -- src-tauri/src/auth/聊天HTTP回归v1.rs
          git add src-tauri/src/auth/聊天HTTP回归v1.rs
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src-tauri/src/auth/聊天HTTP回归v1.rs'
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          git diff --cached > evidence/candidate.patch
          git diff --cached -- src-tauri/src/mcp/listener.rs > evidence/listener-diff.txt
          test ! -s evidence/listener-diff.txt
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          p='src-tauri/src/auth/聊天HTTP回归v1.rs'
          print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$PRODUCT_SHA" > evidence/product-commit.txt
          echo NEVER_MERGE_TEST_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Materialize exact test-only candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          git checkout "$SOURCE_SHA"
          git checkout "$PRODUCT_SHA" -- src-tauri/src/auth/聊天HTTP回归v1.rs
          git diff --check
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src-tauri/src/auth/聊天HTTP回归v1.rs'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Repeat exact regression and full Windows suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          failures=0
          for i in {1..40}; do
            set +e
            cargo test --locked --manifest-path src-tauri/Cargo.toml               auth::chat_http_tests::offline_new_authorization_is_a_non_oauth_tool_error_and_resumes_cleanly               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "exact_failures=$failures" | tee evidence/result.txt
          test "$failures" -eq 0
          cargo test --locked --manifest-path src-tauri/Cargo.toml auth::chat_http_tests -- --nocapture 2>&1 | tee evidence/chat-http.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full.txt
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          p='src-tauri/src/auth/聊天HTTP回归v1.rs'
          print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$PRODUCT_SHA" > evidence/product-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-windows-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Materialize exact test-only candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          git checkout "$SOURCE_SHA"
          git checkout "$PRODUCT_SHA" -- src-tauri/src/auth/聊天HTTP回归v1.rs
          git diff --check
      - name: Install Ubuntu native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify Ubuntu regression remains clean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
          for i in {1..20}; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml               auth::chat_http_tests::offline_new_authorization_is_a_non_oauth_tool_error_and_resumes_cleanly               -- --exact --nocapture 2>&1 | tee "evidence/exact-$i.txt"
          done
          cargo test --locked --manifest-path src-tauri/Cargo.toml auth::chat_http_tests -- --nocapture 2>&1 | tee evidence/chat-http.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/full.txt
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          p='src-tauri/src/auth/聊天HTTP回归v1.rs'
          print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$PRODUCT_SHA" > evidence/product-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-ubuntu
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
