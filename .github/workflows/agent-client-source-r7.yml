name: Agent client exact source verification
on:
  push:
    branches: ['ci/agent-client-source-r7']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct exact source without public deployment
        run: |
          set -euo pipefail
          cp -a .round7-recovery "$RUNNER_TEMP/recovery"
          git checkout --detach 99ed3d061b8c72bde36fcb64b9a29aca6c703a6d
          python3 "$RUNNER_TEMP/recovery/recover.py" reconstruct "$RUNNER_TEMP/recovery"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Independent PostgreSQL, WSS, process and delivery checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p evidence
          cluster="$(mktemp -d "$RUNNER_TEMP/ctm-r7.XXXXXX")"
          port="$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          initdb -D "$cluster/data" -A trust -U gateway_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$cluster/data" -l "$cluster/postgres.log" -o "-h 127.0.0.1 -p $port -k $cluster" -w start >/dev/null
          trap 'pg_ctl -D "$cluster/data" -m fast -w stop >/dev/null' EXIT
          createdb -h 127.0.0.1 -p "$port" -U gateway_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://gateway_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml -- --test-threads=1 2>&1 | tee evidence/all-rust.txt
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --bins --example agent_fixture
          python3 services/cloud-gateway/tests/run_agent_process.py --pg-bin /usr/lib/postgresql/16/bin --bin-dir services/cloud-gateway/target/debug | tee evidence/agent-wss.json
          python3 services/cloud-gateway/tests/run_service_http.py --pg-bin /usr/lib/postgresql/16/bin --binary services/cloud-gateway/target/debug/coding-tools-gateway | tee evidence/service-http.json
          python3 -m unittest discover -s tests/delivery -v 2>&1 | tee evidence/delivery.txt
          node --test tests/delivery/metadata_contract.test.mjs 2>&1 | tee evidence/metadata.txt
          node --test tests/cloud-gateway/*.test.mjs 2>&1 | tee evidence/lab.txt
          node --test tests/offline-safe-ui.test.mjs tests/offline-safe-intent-ui.test.mjs 2>&1 | tee evidence/ui.txt
          python3 scripts/connector_fault_proxy_tests.py 2>&1 | tee evidence/proxy.txt
          python3 -m unittest discover -s tests/cloud-gateway-deployment -v 2>&1 | tee evidence/deployment.txt
          test "$(git rev-parse HEAD^{tree})" = 4dab6678d5444edcf961bb97a6d4970389ce06c0
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-client-source-verified-r7
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  import:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct without executing product source
        run: |
          set -euo pipefail
          cp -a .round7-recovery "$RUNNER_TEMP/recovery"
          git checkout --detach 99ed3d061b8c72bde36fcb64b9a29aca6c703a6d
          python3 "$RUNNER_TEMP/recovery/recover.py" reconstruct "$RUNNER_TEMP/recovery"
      - name: Import hash-verified blobs only, never refs or permission changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/recovery/recover.py" import "$RUNNER_TEMP/receipt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-client-blob-receipt-r7
          path: ${{ runner.temp }}/receipt/
          retention-days: 14
          if-no-files-found: error
