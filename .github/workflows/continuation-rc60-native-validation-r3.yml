name: Isolated RC60 GitNexus unicode diff diagnosis r4 (never merge)

on:
  push:
    branches: ['ci/rc60-native-validation-20260923-r4']
    paths:
      - '.github/workflows/continuation-rc60-native-validation-r3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuation-rc60-unicode-detect-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve helper-only candidate patcher outside checkout
        shell: bash
        run: cp tools/ci/rc60_apply_candidate.py "$RUNNER_TEMP/rc60_apply_candidate.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build pinned graph from untouched production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md .claude/skills/gitnexus
          git diff --exit-code
          "$graph" impact 'Function:src-tauri/src/tools/异步命令v1.rs:run' --direction upstream > evidence/pre-edit-impact.json 2>&1
          node -e "console.log(require(process.argv[1]).version)" "$RUNNER_TEMP/graph/node_modules/gitnexus/package.json" | tee evidence/gitnexus-version.txt
          grep -n "line.startsWith('+++ b/')" "$RUNNER_TEMP/graph/node_modules/gitnexus/dist/storage/git.js" | tee evidence/diff-parser-anchor.txt
          sha256sum "$RUNNER_TEMP/graph/node_modules/gitnexus/dist/storage/git.js" | tee evidence/gitnexus-gitjs.sha256
      - name: Demonstrate quoted-path false-negative then UTF-8-path detection
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python "$RUNNER_TEMP/rc60_apply_candidate.py")"
          test "$sha" = '8320b317d5bba31598b084987e6167ef1af4c0a1346a08af051d2aaf041ff0a7'
          printf '%s  %s\n' "$sha" 'src-tauri/src/tools/异步命令v1.rs' | tee evidence/candidate-source.sha256
          cp 'src-tauri/src/tools/异步命令v1.rs' evidence/candidate-source.rs
          git diff -- src-tauri/src/tools/异步命令v1.rs > evidence/default-unstaged.patch
          git -c core.quotePath=false diff -- src-tauri/src/tools/异步命令v1.rs > evidence/utf8-unstaged.patch
          test -s evidence/default-unstaged.patch
          test -s evidence/utf8-unstaged.patch
          grep -F '+++ "b/src-tauri/src/tools/' evidence/default-unstaged.patch
          grep -F '+++ b/src-tauri/src/tools/异步命令v1.rs' evidence/utf8-unstaged.patch
          git add -- src-tauri/src/tools/异步命令v1.rs
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" detect-changes --scope staged > evidence/detect-default.txt 2>&1
          grep -F 'No changes detected.' evidence/detect-default.txt
          git config --local core.quotePath false
          git diff --cached -U0 -- src-tauri/src/tools/异步命令v1.rs > evidence/utf8-staged.patch
          grep -F '+++ b/src-tauri/src/tools/异步命令v1.rs' evidence/utf8-staged.patch
          "$graph" detect-changes --scope staged > evidence/detect-utf8.txt 2>&1
          cat evidence/pre-edit-impact.json evidence/detect-default.txt evidence/detect-utf8.txt
          ! grep -F 'No changes detected.' evidence/detect-utf8.txt
          grep -F 'src-tauri/src/tools/异步命令v1.rs' evidence/detect-utf8.txt
          grep -F 'run' evidence/detect-utf8.txt
          git diff --cached --check
          git diff --cached --name-only | tee evidence/staged-files.txt
          test "$(cat evidence/staged-files.txt)" = 'src-tauri/src/tools/异步命令v1.rs'
          wc -l src-tauri/src/tools/异步命令v1.rs | tee evidence/source-lines.txt
          git rev-parse HEAD | tee evidence/base-source.txt
          test "$(cat evidence/base-source.txt)" = 'c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b'
          printf '%s\n' 'DIAGNOSTIC_ONLY_NEVER_MERGE_NO_PRODUCTION_SOURCE_PUBLISHED' > evidence/boundary.txt
      - name: Record evidence hashes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence'); root.mkdir(exist_ok=True)
          report={
              'helper_head':os.environ['GITHUB_SHA'],
              'base_source':'c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'boundary':'DIAGNOSTIC_ONLY_NEVER_MERGE',
              'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()},
          }
          (root/'identity.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc60-r4-gitnexus-unicode-diagnosis
          path: evidence/
          retention-days: 14
          if-no-files-found: error
