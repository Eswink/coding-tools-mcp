name: Issue 74 bugfix analysis checkpoints (never merge)

on:
  push:
    branches: ['ci/issue74-plan-init-20260926']
    paths:
      - '.github/workflows/continuation-issue74-analysis.yml'

permissions:
  contents: write

env:
  PLAN_ID: bugfix-issue-74-current-feature-6fe8f8a3f1d-f6abaefb07
  PLAN_PATH: .mcp-probe-kit/plans/bugfix-issue-74-current-feature-6fe8f8a3f1d-f6abaefb07.json
  SOURCE_SHA: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install mcp-probe fallback and resume Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node -e "const r=require('./evidence/resume-before.json'); if(r.isError===true||r.structuredContent?.nextStepId!=='context') process.exit(1)"
      - name: Execute context step and heartbeat
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec init_project_context --json "{\"project_root\":\"$PWD\",\"docs_dir\":\"docs\"}" > evidence/context.json 2>&1
          cat evidence/context.json
          python - <<'PY' > evidence/hb-context.json
          import json, os
          print(json.dumps({
            "plan_id": os.environ["PLAN_ID"],
            "project_root": os.getcwd(),
            "completed_step_ids":["context"],
            "evidence":[{
              "kind":"other",
              "step_id":"context",
              "summary":"init_project_context executed; AGENTS/project-context and graph-insights are available for issue #74.",
              "reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "revision":os.environ["SOURCE_SHA"]
            }],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/hb-context.json > evidence/hb-context-out.json 2>&1
          cat evidence/hb-context-out.json
      - name: Record SRC-1 observable gap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/hb-src1.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","src8-1"],
            "evidence":[{
              "kind":"requirements",
              "step_id":"src8-1",
              "summary":"Ideal: an auth regression test starts an isolated MCP listener deterministically before exercising offline authorization. Actual: the test releases an OS-assigned ephemeral-port reservation and later asks spawn_listener to rebind that numeric port. On Windows RC run 36154924658 job 108137017396, the handoff port 64506 was reoccupied before spawn and bind failed WSAEADDRINUSE 10048, so auth assertions never ran.",
              "reference":"Issue #74; RC run 36154924658 job 108137017396; src-tauri/src/auth/聊天HTTP回归v1.rs",
              "revision":os.environ["SOURCE_SHA"]
            }],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/hb-src1.json > evidence/hb-src1-out.json 2>&1
          cat evidence/hb-src1-out.json
      - name: Execute SRC-2 code insight and heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/code-insight-request.json
          import json, os
          print(json.dumps({
            "mode":"auto",
            "query":"Issue #74 Windows RC failure: offline_new_authorization_is_a_non_oauth_tool_error_and_resumes_cleanly reserves 127.0.0.1:0, drops it, then spawn_listener_with_origin_and_execution_gate rebinds the numeric port and hit WSAEADDRINUSE 10048 on port 64506. Trace the test setup, listener bind path, callers, and safest deterministic test fixture boundary. Do not propose weakening auth/origin or production conflict behavior.",
            "project_root":os.getcwd()
          }, ensure_ascii=False))
          PY
          set +e
          ./.mcp-probe-kit/bin/probe exec code_insight --stdin < evidence/code-insight-request.json > evidence/code-insight.json 2>&1
          insight_code=$?
          set -e
          cat evidence/code-insight.json
          echo "code_insight_exit=$insight_code" > evidence/code-insight-result.txt
          test "$insight_code" -eq 0
          python - <<'PY' > evidence/hb-src2.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","src8-1","src8-2"],
            "evidence":[{
              "kind":"other",
              "step_id":"src8-2",
              "summary":"code_insight executed for the reserve-drop-rebind listener path. The bug boundary is test setup/port handoff into spawn_listener; the listener's production bind conflict remains fail-closed and must not be weakened.",
              "reference":f"GitHub Actions run {os.environ['GITHUB_RUN_ID']} evidence/code-insight.json",
              "revision":os.environ["SOURCE_SHA"]
            }],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/hb-src2.json > evidence/hb-src2-out.json 2>&1
          cat evidence/hb-src2-out.json
      - name: Record SRC-3 SMART acceptance and persist Plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/hb-src3.json
          import json, os
          print(json.dumps({
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","src8-1","src8-2","src8-3"],
            "evidence":[{
              "kind":"requirements",
              "step_id":"src8-3",
              "summary":"Acceptance: reproduce or falsify the reserve-drop-rebind race on Windows; keep production bind conflicts strict; make the test fixture deterministic without arbitrary sleeps; preserve offline CHAT_AUTHORIZATION_UNAVAILABLE permission semantics, no OAuth challenge, no pending record/event, clean resume, and bounded listener shutdown; pass repeated exact Windows target, full Windows/Ubuntu suites, staged GitNexus detect and published RC.",
              "reference":"Issue #74 acceptance contract",
              "revision":os.environ["SOURCE_SHA"]
            }],
            "last_verified_revision":os.environ["SOURCE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/hb-src3.json > evidence/hb-src3-out.json 2>&1
          cat evidence/hb-src3-out.json
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-after.json 2>&1
          cat evidence/resume-after.json
          node -e "const r=require('./evidence/resume-after.json'); if(r.isError===true||r.structuredContent?.nextStepId!=='src8-4') process.exit(1)"
          cp "$PLAN_PATH" evidence/plan-after.json
          git restore -- AGENTS.md CLAUDE.md docs/graph-insights/latest.md docs/graph-insights/latest.json docs/project-context.md docs/project-context 2>/dev/null || true
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): analyze issue74 port handoff"
          git fetch origin "ci/issue74-plan-init-20260926"
          test "$(git rev-parse "origin/ci/issue74-plan-init-20260926")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue74-plan-init-20260926"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue74-analysis
          path: evidence/
          retention-days: 14
          if-no-files-found: error
