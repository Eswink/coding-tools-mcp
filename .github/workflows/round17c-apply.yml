name: Round 17C exact patch applicator

on:
  push:
    branches: ['fix/linux-startup-platform']
    paths:
      - '.round17c/READY'

permissions:
  contents: write
  actions: write

concurrency:
  group: round17c-exact-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: 0599d509fe13a8e57390f441c88f7eda93cae1b3
      TARGET_BRANCH: fix/linux-startup-platform
      RC_VERSION: 0.6.0-rc.3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - name: Verify staged handoff and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          unexpected=$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ev '^(\.round17c/|\.github/workflows/(round17c-apply|linux-rc-packages|windows-rc-packages)\.yml)$' || true)
          test -z "$unexpected" || { echo "unexpected staged paths:"; printf '%s\n' "$unexpected"; exit 1; }
          test -f .round17c/READY
          cat .round17c/chunk-*.patchpart > "$RUNNER_TEMP/round17c-product.patch"
          git apply --check "$RUNNER_TEMP/round17c-product.patch"
          git apply "$RUNNER_TEMP/round17c-product.patch"
          rm -rf .round17c
          python3 -m py_compile scripts/linux_startup_candidate.py
          python3 -m json.tool docs/specs/linux-startup-platform/state.json >/dev/null
          git diff --check
      - name: Commit exact RC3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(linux): recover secure storage on split session bus'
          python3 scripts/rc_version_gate.py --root . --expect-version "$RC_VERSION"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Dispatch exact-source acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          for workflow in linux-startup-baseline.yml linux-rc-packages.yml windows-rc-packages.yml; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -f "ref=$TARGET_BRANCH"
          done
