name: Safe patch delegated plan closure (never merge)

on:
  push:
    branches: ['ci/safe-patch-plan-close-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-plan-close.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
  CANDIDATE_SHA: 784ef80374dc9ee896cd12a457d4bd3ce0365a80
  PLAN_REF: 05dc6f13dac2dfc49ece30291778c0179d570444
  PLAN_BRANCH: ci/safe-patch-plan-heartbeat-init-20260924
  PLAN_ID: feature-issue-68-safe-patch-steady-fb01dcf53f
  PLAN_PATH: .mcp-probe-kit/plans/feature-issue-68-safe-patch-steady-fb01dcf53f.json

jobs:
  close-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact candidate, persisted Plan, and spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .mcp-probe-kit/plans docs/specs/issue-68-safe-patch
          git fetch origin "$PLAN_REF" "$CANDIDATE_SHA"
          git checkout "$CANDIDATE_SHA" --             src-tauri/src/tools/patch.rs             src-tauri/src/tools/patch_transaction.rs             src-tauri/src/tools/patch_transaction_tests.rs
          git show "$PLAN_REF:$PLAN_PATH" > "$PLAN_PATH"
          for name in requirements.md design.md tasks.md; do
            git show "$PLAN_REF:docs/specs/issue-68-safe-patch/$name" > "docs/specs/issue-68-safe-patch/$name"
          done
          git diff --cached --check "$SOURCE_SHA"
          git diff --cached --name-only "$SOURCE_SHA" | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          git diff --cached "$SOURCE_SHA" --             src-tauri/src/tools/patch.rs             src-tauri/src/tools/patch_transaction.rs             src-tauri/src/tools/patch_transaction_tests.rs > evidence/candidate.patch
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse "$CANDIDATE_SHA" > evidence/candidate-commit.txt
      - name: Install mcp-probe and hide helper-only files from review scope
        shell: bash
        run: |
          set -euo pipefail
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          {
            echo '/.mcp-probe-kit/'
            echo '/.cursor/rules/mcp-probe-kit.mdc'
            echo '/docs/specs/issue-68-safe-patch/'
            echo '/evidence/'
          } >> .git/info/exclude
          git status --short | tee evidence/status-before-review.txt
          test "$(git diff --cached --name-only "$SOURCE_SHA" | wc -l)" -eq 3
      - name: Resume real Plan at review step
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          node - <<'NODE'
          const r=require('./evidence/resume.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='review') process.exit(2);
          if(r.structuredContent?.mustContinue!==true) process.exit(3);
          NODE
      - name: Run Plan-aware code review and reject high findings
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec code_review --json "{\"project_root\":\"$PWD\",\"focus\":\"all\"}" > evidence/code-review.json 2>&1
          cat evidence/code-review.json
          node - <<'NODE'
          const r=require('./evidence/code-review.json');
          if(r.isError===true) process.exit(1);
          const all=[];
          function walk(v){
            if(!v) return;
            if(Array.isArray(v)){ for(const x of v) walk(x); return; }
            if(typeof v==='object'){
              if(typeof v.severity==='string' && typeof v.message==='string') all.push(v);
              for(const x of Object.values(v)) walk(x);
            }
          }
          walk(r.structuredContent);
          const high=all.filter(f=>['high','critical'].includes(String(f.severity).toLowerCase()));
          console.log(JSON.stringify({findingCount:all.length,high},null,2));
          if(high.length) process.exit(2);
          NODE
      - name: Heartbeat review evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/heartbeat-review-request.json
          import json, os
          print(json.dumps({
            "plan_id": os.environ["PLAN_ID"],
            "project_root": os.getcwd(),
            "completed_step_ids": ["review"],
            "evidence": [{
              "kind": "review",
              "step_id": "review",
              "summary": "Plan-aware mcp-probe code_review completed after persisted test evidence; no HIGH/CRITICAL finding remains.",
              "reference": f"GitHub Actions run {os.environ['GITHUB_RUN_ID']}",
              "revision": os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision": os.environ["CANDIDATE_SHA"]
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-review-request.json > evidence/heartbeat-review.json 2>&1
          cat evidence/heartbeat-review.json
          node - <<'NODE'
          const r=require('./evidence/heartbeat-review.json');
          if(r.isError===true) process.exit(1);
          NODE
          cat "$PLAN_PATH" | tee evidence/plan-after-review.json
      - name: Converge exact delegated Plan
        shell: bash
        run: |
          set -euo pipefail
          ./.mcp-probe-kit/bin/probe exec converge --json "{\"plan_id\":\"$PLAN_ID\",\"project_root\":\"$PWD\",\"feature_name\":\"issue-68-safe-patch\",\"docs_dir\":\"docs\"}" > evidence/converge.json 2>&1
          cat evidence/converge.json
          node - <<'NODE'
          const r=require('./evidence/converge.json');
          if(r.isError===true || r.structuredContent?.passed!==true) process.exit(1);
          NODE
          cat "$PLAN_PATH" | tee evidence/final-plan.json
      - name: Persist converged Plan checkpoint without overwriting another executor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PLAN_BRANCH"
          test "$(git rev-parse "origin/$PLAN_BRANCH")" = "$PLAN_REF"
          state="$RUNNER_TEMP/plan-state"
          git worktree add --detach "$state" "$PLAN_REF"
          mkdir -p "$state/$(dirname "$PLAN_PATH")"
          cp "$PLAN_PATH" "$state/$PLAN_PATH"
          git -C "$state" config user.name github-actions
          git -C "$state" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$state" add "$PLAN_PATH"
          git -C "$state" diff --cached --check
          git -C "$state" commit -m "chore(plan): converge safe-patch delivery"
          git -C "$state" push origin "HEAD:$PLAN_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-plan-closure
          path: evidence/
          retention-days: 14
          if-no-files-found: error
