name: Safe patch heartbeat field inspection (never merge)

on:
  push:
    branches: ['ci/safe-patch-heartbeat-fields-20260924']
    paths: ['.github/workflows/continuation-safe-patch-heartbeat-fields.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13d01cd9c478db7ef82fac18428c1f6d5bbaf426
          persist-credentials: false
      - name: Inspect mcp-probe plan heartbeat schema source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/probe" --no-audit --no-fund mcp-probe-kit@4.0.1 >/dev/null
          root="$RUNNER_TEMP/probe/node_modules/mcp-probe-kit"
          grep -R -n -E 'completed_step_ids|unresolved_items|runtime_evidence|acceptance_results|plan_heartbeat' "$root" \
            --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' \
            > evidence/matches.txt || true
          cat evidence/matches.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-heartbeat-fields
          path: evidence/
          retention-days: 14
          if-no-files-found: error
