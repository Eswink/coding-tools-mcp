name: Safe patch plan implement advance (never merge)

on:
  push:
    branches: ['ci/safe-patch-plan-heartbeat-init-20260924']
    paths:
      - '.github/workflows/continuation-safe-patch-plan-implement.yml'

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/safe-patch-plan-heartbeat-init-20260924
          persist-credentials: false
          fetch-depth: 0
      - name: Bind candidate implementation and heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"feature-issue-68-safe-patch-steady-fb01dcf53f\"}" > evidence/resume.json 2>&1
          git fetch origin 784ef80374dc9ee896cd12a457d4bd3ce0365a80
          git checkout 784ef80374dc9ee896cd12a457d4bd3ce0365a80 -- src-tauri/src/tools/patch.rs src-tauri/src/tools/patch_transaction.rs src-tauri/src/tools/patch_transaction_tests.rs
          git diff --cached --name-only HEAD | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          git diff --cached --check HEAD
          printf '%s\n' 'candidate=784ef80374dc9ee896cd12a457d4bd3ce0365a80' > evidence/implementation.txt
          git diff --cached --stat HEAD | tee -a evidence/implementation.txt
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --json "{\"plan_id\":\"feature-issue-68-safe-patch-steady-fb01dcf53f\",\"project_root\":\"$PWD\",\"completed_step_ids\":[\"context\",\"write-spec\",\"check-spec\",\"estimate\",\"implement\"]}" > evidence/heartbeat.json 2>&1
          cat evidence/resume.json evidence/implementation.txt evidence/heartbeat.json
          cat .mcp-probe-kit/plans/feature-issue-68-safe-patch-steady-fb01dcf53f.json | tee evidence/plan-state.json
          node -e "const s=require('./evidence/plan-state.json'); if(!s.completedStepIds.includes('implement')) process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: safe-patch-plan-implement
          path: evidence/
          retention-days: 14
          if-no-files-found: error
