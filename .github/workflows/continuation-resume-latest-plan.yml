name: Resume latest delegated Plan (never merge)

on:
  push:
    branches: ['ci/resume-latest-plan-20260926']
    paths:
      - '.github/workflows/continuation-resume-latest-plan.yml'

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6fe8f8a3f1dc55dc1e2f9704fa65586a8a1d2ecd
          fetch-depth: 0
          persist-credentials: false
      - name: Resume latest active or blocked Plan only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\"}" > evidence/resume.json 2>&1
          cat evidence/resume.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resume-latest-plan
          path: evidence/
          retention-days: 7
          if-no-files-found: error
