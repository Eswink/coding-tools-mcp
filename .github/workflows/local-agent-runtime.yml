name: Local Agent tool runtime

on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime']
    paths:
      - 'services/local-agent/**'
      - '.github/workflows/local-agent-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/local-agent/**'
      - '.github/workflows/local-agent-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-agent-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Verify shared Tool Runtime
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo fmt --check --manifest-path services/local-agent/Cargo.toml
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/tests.txt
          cargo check --locked --manifest-path services/local-agent/Cargo.toml
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          rustc --version > evidence/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-agent-runtime-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
