name: Local Agent tool runtime

on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime', 'fix/windows-owned-job-completion']
    paths:
      - 'services/local-agent/**'
      - '.github/workflows/local-agent-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/local-agent/**'
      - '.github/workflows/local-agent-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-agent-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Record exact source before validation
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          rustc --version > evidence/toolchain.txt
          cargo test --locked --manifest-path services/local-agent/Cargo.toml -- --list 2>&1 | tee evidence/test-inventory.txt
      - name: Verify shared Tool Runtime
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo fmt --check --manifest-path services/local-agent/Cargo.toml
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/tests.txt
          cargo check --locked --manifest-path services/local-agent/Cargo.toml
          python - <<'PYCODE'
          import json, pathlib, re
          inventory = pathlib.Path('evidence/test-inventory.txt').read_text(encoding='utf-8')
          log = pathlib.Path('evidence/tests.txt').read_text(encoding='utf-8')
          expected = len(re.findall(r'^.+: test$', inventory, re.M))
          rows = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out', log)
          passed = sum(int(row[0]) for row in rows)
          assert expected > 0 and passed == expected, (expected, passed)
          assert rows and all(all(int(value) == 0 for value in row[1:]) for row in rows), rows
          pathlib.Path('evidence/counts.json').write_text(json.dumps(dict(listed=expected, passed=passed, nonpass=0)), encoding='utf-8')
          PYCODE
      - name: Verify native Windows owned-Job proofs
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path services/local-agent/Cargo.toml --test windows_job_completion -- --nocapture 2>&1 | tee evidence/windows-job-completion.txt
          python - <<'PYCODE'
          import pathlib, re
          log = pathlib.Path('evidence/windows-job-completion.txt').read_text(encoding='utf-8')
          rows = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out', log)
          assert len(rows) == 1 and int(rows[0][0]) == 8 and all(int(value) == 0 for value in rows[0][1:]), rows
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-agent-runtime-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
