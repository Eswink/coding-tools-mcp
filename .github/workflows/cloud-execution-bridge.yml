name: Cloud execution bridge native gates

on:
  push:
    branches: ['feat/cloud-gateway-agent-runtime', 'feat/issue-81-cloud-execution-bridge']
    paths:
      - 'services/cloud-gateway/**'
      - 'services/cloud-agent/**'
      - 'services/local-agent/**'
      - 'src-tauri/**'
      - 'tools/delivery/**'
      - 'tests/delivery/**'
      - 'docs/specs/cloud-execution-bridge/**'
      - '.github/workflows/cloud-execution-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/cloud-gateway/**'
      - 'services/cloud-agent/**'
      - 'services/local-agent/**'
      - 'src-tauri/**'
      - 'tools/delivery/**'
      - 'tests/delivery/**'
      - 'docs/specs/cloud-execution-bridge/**'
      - '.github/workflows/cloud-execution-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cloud-execution-bridge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  PYTHONUTF8: '1'

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud-gateway
      - name: Portable source, binding and full-plan contracts
        id: native
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt
          rustc --version > evidence/toolchain.txt
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo fmt --check --manifest-path services/cloud-agent/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-agent/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/agent-clippy.txt
          cargo test --locked --manifest-path services/cloud-agent/Cargo.toml 2>&1 | tee evidence/agent-full.txt
          grep -F '88 passed; 0 failed; 0 ignored' evidence/agent-full.txt
          cargo rustc --locked --manifest-path services/cloud-agent/Cargo.toml --lib -- -D warnings
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings 2>&1 | tee evidence/clippy.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib execution::tests 2>&1 | tee evidence/execution-unit.txt
          grep -F '13 passed; 0 failed; 0 ignored' evidence/execution-unit.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib --test service_contracts 2>&1 | tee evidence/portable.txt
          cargo rustc --locked --manifest-path services/cloud-gateway/Cargo.toml --lib -- -D warnings
          python -m unittest discover -s tests/delivery 2>&1 | tee evidence/delivery-python.txt
          node --test tests/delivery/*.test.mjs 2>&1 | tee evidence/delivery-js.txt
          node --test tests/cloud-gateway/*.test.mjs 2>&1 | tee evidence/cloud-contracts.txt
          git diff --exit-code HEAD --
      - name: Preserve status without masking failures
        if: always()
        env:
          NATIVE_RESULT: ${{ steps.native.outcome }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('evidence')
          (root/'result.json').write_text(json.dumps({
            'source_sha':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
            'runner_os':os.environ['RUNNER_OS'], 'passed':os.environ['NATIVE_RESULT']=='success',
            'scope':'portable gateway and full-plan contracts; not native desktop integration',
            'postgres_executed':False,
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.txt')}
          },indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-execution-portable-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: disposable-ci-fixture
          POSTGRES_DB: coding_tools_identity_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U mcp_test -d coding_tools_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/cloud-gateway
      - name: Real PostgreSQL and authenticated transport regressions
        id: native
        env:
          TEST_DATABASE_URL: postgresql://mcp_test:disposable-ci-fixture@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/coding_tools_identity_test
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test admission_linearization 2>&1 | tee evidence/linearization.txt
          grep -F '3 passed; 0 failed; 0 ignored' evidence/linearization.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test execution_postgres 2>&1 | tee evidence/execution-postgres.txt
          grep -F '13 passed; 0 failed; 0 ignored' evidence/execution-postgres.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test managed_agent_wss -- --test-threads=1 2>&1 | tee evidence/managed-agent-wss.txt
          grep -F '5 passed; 0 failed; 0 ignored' evidence/managed-agent-wss.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee evidence/full-gateway.txt
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
          export PATH="/usr/bin:$PATH"
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --example native_desktop_fixture
          export CTM_NATIVE_GATEWAY_FIXTURE_BIN="$GITHUB_WORKSPACE/services/cloud-gateway/target/debug/examples/native_desktop_fixture"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features cloud-agent-integration-tests --lib tools::cloud_host::live::wss_tests -- --nocapture --test-threads=1 2>&1 | tee evidence/native-wss.txt
          grep -F '9 passed; 0 failed; 0 ignored' evidence/native-wss.txt
          git diff --exit-code HEAD --
      - name: Preserve real database evidence
        if: always()
        env:
          NATIVE_RESULT: ${{ steps.native.outcome }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('evidence')
          (root/'result.json').write_text(json.dumps({
            'source_sha':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
            'runner_os':os.environ['RUNNER_OS'], 'passed':os.environ['NATIVE_RESULT']=='success',
            'scope':'real PG/WSS and native authorizer backend; not GUI approval or physical host proof',
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.txt')}
          },indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-execution-postgres-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  desktop-native:
    name: Native desktop drain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native prerequisites and system runtime
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
          # The sandbox grants system runtime reads, not /opt hosted caches.
          echo /usr/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Complete native regression and cancellation-safe drain
        id: native
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee evidence/desktop-check.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/desktop-full.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tools::native_drain::tests 2>&1 | tee evidence/native-drain.txt
          cargo rustc --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings 2>&1 | tee evidence/desktop-production.txt
          git diff --exit-code HEAD --
      - name: Keep native results and original failures
        if: always()
        env:
          NATIVE_RESULT: ${{ steps.native.outcome }}
        run: |
          mkdir -p evidence
          python - <<'PYCODE'
          import hashlib,json,os,pathlib
          root=pathlib.Path('evidence')
          (root/'result.json').write_text(json.dumps({
            'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'platform':os.environ['RUNNER_OS'],'passed':os.environ['NATIVE_RESULT']=='success',
            'scope':'native backend; no native GUI clicks or physical workstation claim',
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.txt')}
          },indent=2),encoding='utf-8')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-execution-native-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
