name: Tool discovery delegated feature Plan init (never merge)

on:
  push:
    branches: ['ci/tool-discovery-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-tool-discovery-plan-init.yml'

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Start feature and persist initial delegated Plan
        shell: bash
        env:
          FEATURE_DESCRIPTION: "Issue #72 deferred tool discovery evaluation. Build the smallest bounded discovery increment on the existing local-agent ToolRegistry. Preserve Direct/Deferred/Hidden separation; expose only deterministic, bounded metadata for Deferred tools; Hidden tools must never appear; discovery must not invoke any executor, mint or bypass LocalAdmission, expand capabilities, or mutate registry state. Keep names/descriptions/schemas within existing ToolSpec limits and avoid host-global paths or secrets in output/debug. Add focused ordering/visibility/bounds/no-execution tests and Windows 2025 + Ubuntu 24.04 validation. Run pinned GitNexus impact/context before edits and staged detect before publication. Do not implement sandboxing, worktrees, snapshots, Hooks, UI, packaging, cloud authority or automatic deferred execution in this issue."
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/start-request.json
          import json, os
          print(json.dumps({
            "project_root": os.getcwd(),
            "description": os.environ["FEATURE_DESCRIPTION"],
            "spec_layout": "auto"
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec start_feature --stdin < evidence/start-request.json > evidence/start-feature.json 2>&1
          cat evidence/start-feature.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence/start-feature.json','utf8'));
          if(r.isError===true) process.exit(1);
          function findPlan(v){
            if(!v || typeof v!=='object') return null;
            if(typeof v.planId==='string' && Array.isArray(v.steps)) return v;
            for(const x of Object.values(v)){ const p=findPlan(x); if(p) return p; }
            return null;
          }
          const plan=findPlan(r.structuredContent);
          if(!plan) { console.error('Delegated Plan not found'); process.exit(2); }
          fs.writeFileSync('evidence/plan.json', JSON.stringify(plan,null,2));
          fs.writeFileSync('evidence/plan-id.txt', plan.planId+'\n');
          fs.writeFileSync('evidence/heartbeat-input.json', JSON.stringify({
            plan_id:plan.planId,
            project_root:process.cwd(),
            plan
          }));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-input.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          plan_id="$(cat evidence/plan-id.txt)"
          plan_path=".mcp-probe-kit/plans/$plan_id.json"
          test -f "$plan_path"
          cp "$plan_path" evidence/plan-state.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('evidence/plan-state.json','utf8'));
          if(!p.planId || p.status!=='active') process.exit(1);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$plan_path"
          git diff --cached --check
          git commit -m "chore(plan): initialize deferred tool discovery"
          git fetch origin "ci/tool-discovery-plan-init-20260925"
          test "$(git rev-parse "origin/ci/tool-discovery-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/tool-discovery-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-plan-init
          path: evidence/
          retention-days: 14
          if-no-files-found: error
