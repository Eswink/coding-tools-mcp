name: OAuth discovery regression
on:
  push:
    branches: ['fix/oauth-discovery-runtime']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git archive --format=zip HEAD -o evidence/source.zip
          sha256sum evidence/source.zip > evidence/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oauth-repair-source
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Real HTTP discovery regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/check.txt
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee evidence/tests.txt
          for repetition in 1 2 3; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::configuration::tests -- --test-threads=8 2>&1 | tee "evidence/lifecycle-${repetition}.txt"
          done
          cargo rustc --locked --lib --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee evidence/production-warnings.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-discovery-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: All frontend regressions from fresh TypeScript output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          node scripts/前端完整回归v4.mjs 2>&1 | tee evidence/frontend.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-frontend-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
      - name: Export bounded offline reviewer compilers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reviewer-tools
          tar czf reviewer-tools/compilers.tar.gz node_modules/typescript node_modules/svelte
          sha256sum reviewer-tools/compilers.tar.gz > reviewer-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: oauth-reviewer-compilers
          path: reviewer-tools/
          if-no-files-found: error
          retention-days: 7
