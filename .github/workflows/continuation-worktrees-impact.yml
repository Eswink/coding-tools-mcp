name: Worktrees pre-edit impact review (never merge)

on:
  push:
    branches: ['ci/worktrees-impact-20260925']
    paths:
      - '.github/workflows/continuation-worktrees-impact.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: 4dc9f9d872c134d381cb1eba76999d34231d3ba6

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect Harness and ToolContext blast radius before adding worktree module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          for target in             'Struct:src-tauri/src/harness/state.rs:Harness'             'Struct:src-tauri/src/tools/context.rs:ToolContext'             'File:src-tauri/src/harness/mod.rs'
          do
            safe="$(printf '%s' "$target" | tr '/:.' '____')"
            "$graph" context "$target" > "evidence/context-$safe.txt" 2>&1 || true
            "$graph" impact "$target" --direction upstream > "evidence/impact-$safe.txt" 2>&1 || true
            printf '\n=== %s ===\n' "$target"
            cat "evidence/context-$safe.txt" "evidence/impact-$safe.txt"
          done
          git rev-parse HEAD > evidence/source-commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worktrees-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
