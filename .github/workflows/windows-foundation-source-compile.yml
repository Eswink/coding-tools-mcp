name: Windows foundation source-only compiler probe
on:
  push:
    branches: [probe/windows-foundation-compile-20261009-19bb2920]
permissions:
  contents: read
concurrency:
  group: windows-foundation-source-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler:
    if: github.repository == 'Eswink/coding-tools-mcp' && github.event_name == 'push' && github.ref == 'refs/heads/probe/windows-foundation-compile-20261009-19bb2920'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            mode: rust
          - os: ubuntu-24.04
            mode: go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed Python guard interpreter
        id: foundation-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Regenerate schema-2 source manifest for this commit and diff
        if: matrix.mode == 'go'
        shell: bash
        env:
          FOUNDATION_PYTHON_EXECUTABLE: ${{ steps.foundation-python.outputs.python-path }}
        run: |
          set -euo pipefail
          # Fixed inputs: c60f9667 (base), 47adc2a1 (exact73), 155eafad (full43) on backup/rc070-workspace-checkpoints-20261009;
          # frozen tree 19bb2920 on backup/rc070-frozen-19bb2920-20261011.
          for s in c60f9667fa8431e27fabbc497c19b4abfef5b965 47adc2a11135e692b8de15534debacf9a1cc1948 155eafad649380669130241167e61b37e1f9359a 47659171601299a9a16fcb6d5426ac2d5550baf7; do
            git fetch --no-tags --quiet https://github.com/Eswink/coding-tools-mcp.git "$s"
          done
          "$FOUNDATION_PYTHON_EXECUTABLE" scripts/gen_windows_foundation_source_manifest.py --repo . --target-tree "$GITHUB_SHA" > "$RUNNER_TEMP/regenerated-manifest.json"
          diff -u scripts/windows_foundation_source_manifest.json "$RUNNER_TEMP/regenerated-manifest.json"
          "$FOUNDATION_PYTHON_EXECUTABLE" scripts/windows_foundation_source_guard.py verify-layer --manifest scripts/windows_foundation_source_manifest.json --manager . --receipt "$RUNNER_TEMP/layer-receipt.json"
          "$FOUNDATION_PYTHON_EXECUTABLE" scripts/windows_foundation_manifest_v2_tests.py
      - name: Fixed Windows Rust compiler
        if: matrix.mode == 'rust'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Fixed Linux Go compiler
        if: matrix.mode == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.13'
          check-latest: false
          cache: false
      - name: Restore exact frozen source then actual compiler and named data tests
        shell: pwsh
        env:
          FOUNDATION_PYTHON_EXECUTABLE: ${{ steps.foundation-python.outputs.python-path }}
        run: ./scripts/windows_foundation_source_compile.ps1 -Mode '${{ matrix.mode }}' -PythonExecutable $env:FOUNDATION_PYTHON_EXECUTABLE
      - name: Independently deny incomplete or false compiler receipts
        if: always()
        shell: pwsh
        env:
          FOUNDATION_PYTHON_EXECUTABLE: ${{ steps.foundation-python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Python = $env:FOUNDATION_PYTHON_EXECUTABLE
          if ([string]::IsNullOrWhiteSpace($Python) -or -not [System.IO.Path]::IsPathRooted($Python) -or
              $Python -match '[\\/]Microsoft[\\/]WindowsApps[\\/]' -or
              -not (Test-Path -LiteralPath $Python -PathType Leaf)) { throw 'Pinned setup-python payload absent; no PATH fallback.' }
          $Output = Join-Path $env:RUNNER_TEMP 'windows-foundation-probe'
          & $Python ./scripts/windows_foundation_union_overlay.py verify-result --mode '${{ matrix.mode }}' --compiler-result (Join-Path $Output 'compiler-result.json') --manifest ./scripts/windows_foundation_source_manifest.json --manager $env:GITHUB_WORKSPACE --destination (Join-Path $env:RUNNER_TEMP 'windows-foundation-sut-union1967') --receipt (Join-Path $Output 'terminal-consumer-result.json')
          if ($LASTEXITCODE -ne 0) { throw 'Independent actual compiler receipt consumer denied.' }
      - name: Preserve actual result and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-foundation-source-compile-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-foundation-probe
          if-no-files-found: error
          retention-days: 7
