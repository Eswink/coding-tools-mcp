name: Issue 62 Plan SRC-8 and converge (never merge)

on:
  push:
    branches: ['ci/issue62-plan-init-20260924']
    paths:
      - '.github/workflows/continuation-issue62-plan-src8-converge.yml'

permissions:
  contents: write

env:
  PLAN_ID: bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b
  PLAN_PATH: .mcp-probe-kit/plans/bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b.json
  CANDIDATE_SHA: 5d41565b60dc4f5b213c8c98236d3d5385a50fac

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare memory candidate, converge, and persist Plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          ./.mcp-probe-kit/bin/probe exec resume_plan --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/resume-before.json 2>&1
          cat evidence/resume-before.json
          node - <<'NODE'
          const r=require('./evidence/resume-before.json');
          if(r.isError===true || r.structuredContent?.found!==true) process.exit(1);
          if(r.structuredContent?.nextStepId!=='src8-8') process.exit(2);
          NODE
          python - <<'PY' > evidence/heartbeat.json
          import json, os
          candidate={
            "type":"bugfix",
            "tags":["bugfix","root-cause","linux","listener-lifecycle"],
            "summary":"Linux same-port restart can outlive PID ownership because an ownerless LISTEN socket remains visible briefly after shutdown.",
            "content":"【现象】A completed listener task could still fail an immediate same-port restart on Linux with EADDRINUSE.\n【根因】The existing port observer equated find_pid_listening_on_port(None) with a free port, but Linux can retain the exact LISTEN entry for a short ownerless interval after process/socket ownership is no longer resolvable.\n【修复】Keep PID ownership semantics unchanged, add an exact Linux LISTEN-presence primitive, and make the existing bounded runtime shutdown wait treat ownerless LISTEN as still busy. Callers that require immediate same-port reuse await the established restart-safe runtime boundary.\n【验证】Never-merge run 36098896792: staged GitNexus MEDIUM/non-false-clean; exact regression 20/20 on Windows and 20/20 on Ubuntu; complete desktop Rust suites 2/2 Windows and 6/6 Ubuntu, 404/404 each. Earlier close-lag evidence measured 15-36 ms ownerless LISTEN tails.\n【来源参考】platform/linux/net.rs; runtime/port.rs; recovery transport regression.",
            "evidence":[
              "close-lag run 35951904056 reproduced 15-36 ms exact loopback LISTEN tails after JoinHandle completion",
              "architecture design run 36005201070 revised the repair away from CRITICAL listener.rs",
              "candidate validation run 36098896792 passed repeated exact and full Windows/Ubuntu regressions"
            ],
            "applicability":"Applies when a Linux restart contract requires deterministic same-port reuse after graceful listener shutdown. Do not generalize to foreign-process listeners, Windows semantics, or use this as justification for fixed sleeps, blind rebind retries, or SO_REUSEPORT."
          }
          payload={
            "plan_id":os.environ["PLAN_ID"],
            "project_root":os.getcwd(),
            "completed_step_ids":["context","src8-1","src8-2","src8-3","src8-4","src8-5","src8-6","src8-7","src8-8"],
            "memory_candidates":[candidate],
            "evidence":[{
              "kind":"memory",
              "step_id":"src8-8",
              "summary":"Prepared a reusable bugfix/root-cause memory candidate for Linux ownerless LISTEN shutdown tails; formal memory write remains gated on converge.",
              "reference":"Issue #62 Plan SRC-8 candidate",
              "revision":os.environ["CANDIDATE_SHA"]
            }],
            "last_verified_revision":os.environ["CANDIDATE_SHA"]
          }
          print(json.dumps(payload,separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          cp "$PLAN_PATH" evidence/plan-before-converge.json
          ./.mcp-probe-kit/bin/probe exec converge --json "{\"project_root\":\"$PWD\",\"plan_id\":\"$PLAN_ID\"}" > evidence/converge.json 2>&1
          cat evidence/converge.json
          node - <<'NODE'
          const r=require('./evidence/converge.json');
          if(r.isError===true || r.structuredContent?.passed!==true) process.exit(1);
          NODE
          cp "$PLAN_PATH" evidence/plan-after-converge.json
          python - <<'PY' > evidence/memorize.json
          import json
          print(json.dumps({
            "name":"linux-ownerless-listen-restart-boundary",
            "type":"bugfix",
            "description":"Deterministic same-port restart must distinguish PID ownership from exact Linux LISTEN presence during shutdown.",
            "summary":"Treat short ownerless Linux LISTEN tails as busy within the existing bounded shutdown wait before same-port reuse.",
            "content":"【现象】A listener task can complete while the exact loopback LISTEN entry remains briefly visible, causing immediate same-port EADDRINUSE.\n【根因】PID-owner lookup returning none is not equivalent to no LISTEN entry on Linux.\n【修复】Keep owner lookup unchanged; add exact LISTEN-presence observation and classify ownerless LISTEN as busy in the existing bounded runtime shutdown wait.\n【验证】Repeated exact and full Windows/Ubuntu candidate regressions passed after the repair; prior diagnostics measured 15-36 ms tails.\n【来源参考】platform/linux/net.rs; runtime/port.rs; recovery transport regression.",
            "usage":"Use for Linux service/listener shutdown contracts where immediate deterministic same-port reuse is required.",
            "applicability":"Not for foreign-process ownership, Windows-only behavior, fixed sleeps, blind rebind retry loops, or SO_REUSEPORT.",
            "evidence":[
              "run 35951904056 close-lag reproduction",
              "architecture design run 36005201070",
              "candidate validation run 36098896792"
            ],
            "confidence":0.96,
            "tags":["bugfix","root-cause","linux","listener-lifecycle"]
          },separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec memorize_asset --stdin < evidence/memorize.json > evidence/memorize-output.json 2>&1
          cat evidence/memorize-output.json
          node - <<'NODE'
          const p=require('./.mcp-probe-kit/plans/bugfix-issue-62-on-ubuntu-after-mcp-listene-eda04c324b.json');
          if(p.status!=='converged') process.exit(1);
          if(!p.completedStepIds.includes('src8-8')) process.exit(2);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PLAN_PATH"
          git diff --cached --check
          git commit -m "chore(plan): converge issue62 root-cause repair"
          git fetch origin "ci/issue62-plan-init-20260924"
          test "$(git rev-parse "origin/ci/issue62-plan-init-20260924")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/issue62-plan-init-20260924"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue62-plan-src8-converge
          path: evidence/
          retention-days: 14
          if-no-files-found: error
