name: Offline-safe Round 5 Windows warning impact

on:
  push:
    branches:
      - acceptance/offline-safe-round5
    paths:
      - '.github/workflows/offline-safe-round5-windows-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh GitNexus index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx -y gitnexus@latest analyze | tee evidence/analyze.txt
          git reset --hard "$GITHUB_SHA"
          npx -y gitnexus@latest status | tee evidence/status.txt
      - name: Impact allowed command merge
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact merge_default_allowed_commands --file src-tauri/src/tools/policy.rs --kind Function --direction upstream | tee evidence/impact-policy-allowed-commands.txt
      - name: Impact default collection helper
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact should_initialize_default_collection --file src-tauri/src/commands/app_info.rs --kind Function --direction upstream | tee evidence/impact-default-collection-helper.txt
      - name: Impact startup failure reason enum
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact StartupFailureReason --file src-tauri/src/error.rs --direction upstream | tee evidence/impact-startup-failure-reason.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-safe-round5-windows-warning-impact
          path: evidence/
          if-no-files-found: error
          retention-days: 30
