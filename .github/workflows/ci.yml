name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            dbus \
            gnome-keyring
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: cargo build
        working-directory: src-tauri
        run: cargo build
      - name: Refusal stays fail-closed without a Secret Service
        working-directory: src-tauri
        # Outside any session bus the native ledger is unreadable; tool calls must be refused.
        run: |
          set -uo pipefail
          empty="$(mktemp -d)"; chmod 700 "$empty"
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_RUNTIME_DIR="$empty"
          # No session bus means no Secret Service and no keyring fallback.
          if busctl --user list >/dev/null 2>&1; then echo "unexpected user session bus"; exit 1; fi
          if command -v secret-tool >/dev/null && secret-tool search --all probe x >/dev/null 2>&1; then echo "unexpected Secret Service"; exit 1; fi
          # Own disposable data dir: the refused run leaves partial ledger residue that must not reach other steps.
          export XDG_DATA_HOME="$(mktemp -d)"
          status=0
          cargo test --test call_tool_contract -- --exact list_files_accepts_glob_alias > "$RUNNER_TEMP/refusal.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/refusal.log"
          test "$status" -ne 0
          grep -q 'NATIVE_ROOT_UNAVAILABLE' "$RUNNER_TEMP/refusal.log"
          grep -q 'not proven quiescent' "$RUNNER_TEMP/refusal.log"
      - name: cargo test
        working-directory: src-tauri
        # Non-test library builds read the native ledger through the OS Secret Service.
        # Provide a disposable, unlocked session keyring; production refusal is unchanged.
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "ci-disposable-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            export XDG_DATA_HOME="$(mktemp -d)"
            cargo test
          '

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
