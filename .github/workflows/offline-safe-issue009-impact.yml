name: Offline-safe ISSUE-009 authorization impact gate

on:
  push:
    branches:
      - hardening/offline-auth-noise
    paths:
      - '.github/workflows/offline-safe-issue009-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build GitNexus index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx -y gitnexus@latest analyze | tee evidence/analyze.txt
          git reset --hard "$GITHUB_SHA"
          npx -y gitnexus@latest status | tee evidence/status.txt
      - name: Impact chat-domain intercept
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact intercept --file src-tauri/src/tools/聊天运行域v1.rs --kind Function --direction upstream | tee evidence/impact-chat-intercept.txt
      - name: Impact chat-domain denied
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact denied --file src-tauri/src/tools/聊天运行域v1.rs --kind Function --direction upstream | tee evidence/impact-chat-denied.txt
      - name: Impact authorizer status
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact status --file src-tauri/src/auth/聊天授权v1.rs --kind Function --direction upstream | tee evidence/impact-authorizer-status.txt
      - name: Impact authorizer request
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact request --file src-tauri/src/auth/聊天授权v1.rs --kind Function --direction upstream | tee evidence/impact-authorizer-request.txt
      - name: Impact execution-gate snapshot
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact snapshot --file src-tauri/src/runtime/execution_gate.rs --kind Function --direction upstream | tee evidence/impact-execution-snapshot.txt
      - name: Query authorization notification flow
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest query "request_chat_authorization ChatAuthorizer pending event notification execution gate offline" | tee evidence/query-auth-notification.txt
      - name: Record exact call sites
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '--- request_chat_authorization ---'
            git grep -n 'request_chat_authorization' -- 'src-tauri/src/**' || true
            echo '--- service.request ---'
            git grep -n 'service.request' -- 'src-tauri/src/**' || true
            echo '--- execution_gate.snapshot ---'
            git grep -n 'execution_gate.*snapshot\|execution_gate.snapshot' -- 'src-tauri/src/**' || true
            echo '--- pending event ---'
            git grep -n '"pending"' -- 'src-tauri/src/auth/**' 'src-tauri/src/commands/**' || true
          } | tee evidence/source-call-sites.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-safe-issue009-impact
          path: evidence/
          if-no-files-found: error
          retention-days: 30
