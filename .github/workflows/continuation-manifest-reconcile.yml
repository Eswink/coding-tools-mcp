name: Isolated delivery manifest current-source verification (never merge)

on:
  push:
    branches: ['ci/manifest-receipt-reconcile-20260923']

permissions:
  contents: read

concurrency:
  group: continuation-manifest-current-source-20260923
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Re-read immutable feature source and verify delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          expected=c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin refs/heads/feat/cloud-gateway-agent-runtime:refs/remotes/origin/feat/cloud-gateway-agent-runtime
          test "$(git rev-parse refs/remotes/origin/feat/cloud-gateway-agent-runtime)" = "$expected"
          python -m unittest discover -s tests/delivery -v 2>&1 | tee evidence/scheduler-tests.txt
          node --test tests/delivery/metadata_contract.test.mjs 2>&1 | tee evidence/metadata-tests.txt
          python tools/delivery/dispatch.py --manifest tools/delivery/manifest.json --repo-root . --output evidence/dispatch.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.load(open('evidence/dispatch.json',encoding='utf-8'))
          assert data['revision']=='c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b'
          assert data['states']['issue-dispatch']=='verified'
          assert data['states']['native-pty']=='planned'
          assert data['release_allowed'] is False
          assert data['release_eligible_for_review'] is False
          packets=data['packets']
          assert len(packets)==1, packets
          packet=packets[0]
          assert packet['id']=='native-pty'
          assert packet['issue']==59 and packet['action']=='queue_issue'
          assert packet['execution_started'] is False and packet['authority']=='engineering_only'
          manifest=json.load(open('tools/delivery/manifest.json',encoding='utf-8'))
          tasks={t['id']:t for t in manifest['tasks']}
          evidence=tasks['issue-dispatch']['evidence']
          assert evidence['revision']=='b59d550294b6e0f7734299102fb80f8fb17eecd0'
          assert evidence['run_id']==35776835893
          assert tasks['native-pty']['issue']==59
          expected_hashes={
            'tools/delivery/dispatch.py':'ee56ad164f79349d61579fe83fe3af966b22110dc2ab7b06ba20ff28504fe966',
            'tests/delivery/test_dispatch.py':'fd442d78efa619bb41db41878254e230bf20aa45d671fd49fc5e7141173529d4',
            '.github/workflows/cloud-delivery.yml':'245b4765b07486f0b6f3dd7942dffa5bd3e30c4e33bdbba5c8eb7733f682e2c2',
            'tests/delivery/metadata_contract.test.mjs':'a80375a68a211dd956f836c6e668acd69fa39cd682448e2ece472758bb8f5d08',
          }
          actual={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in expected_hashes}
          assert actual==expected_hashes
          receipt={
            'source':'c22e08dc0bb2d2c80714b7efb2c3e90e1e7b808b',
            'manifest_sha256':hashlib.sha256(Path('tools/delivery/manifest.json').read_bytes()).hexdigest(),
            'source_hashes':actual,
            'packet':packet,
            'release_allowed':data['release_allowed'],
            'release_eligible_for_review':data['release_eligible_for_review'],
          }
          Path('evidence/current-source-receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git diff --exit-code
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
      - name: Pinned graph clean-source verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.9
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/graph-analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md
          "$graph" detect-changes --scope all > evidence/graph-changes.txt 2>&1
          cat evidence/graph-changes.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: continuation-manifest-current-source-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
