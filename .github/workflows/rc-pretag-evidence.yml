name: Nonpublishing pre-tag FINAL evidence

on:
  push:
    branches:
      - release/rc-pretag-*

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Collect pre-tag FINAL evidence (release remains blocked)
    if: >-
      github.repository == 'Eswink/coding-tools-mcp' &&
      github.repository_id == '1360355522' &&
      github.event_name == 'push' && !github.event.deleted &&
      startsWith(github.ref, 'refs/heads/release/rc-pretag-') &&
      github.workflow_sha == github.sha && github.run_id > 0 && github.run_attempt > 0
    runs-on: ubuntu-24.04
    # Outer platform cancellation only, not a whole-CLI or cleanup guarantee.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect source-bound observation without approval
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python -B -I -S scripts/rc_pretag_collect.py
      - name: Retain only the closed sanitized observation
        if: ${{ success() && !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-pretag-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 7
