name: Cloud gateway reviewed source recovery
on:
  push:
    branches: ['ci/cloud-gateway-source-recovery-r3']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-gateway-source-recovery-r3
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/ci/cloud-gateway-source-recovery-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the two reviewed commits and verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cp -a .source-recovery "$RUNNER_TEMP/recovery"
          mkdir -p "$RUNNER_TEMP/evidence"
          git checkout --detach ba9c379f08da37f2a05bb96c377a95f432da969e
          python "$RUNNER_TEMP/recovery/recover.py" reconstruct "$RUNNER_TEMP/recovery" | tee "$RUNNER_TEMP/evidence/reconstructed.json"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only source verification with disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          cluster="$(mktemp -d "$RUNNER_TEMP/ctm-recovery.XXXXXX")"
          port="$(python -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          initdb -D "$cluster/data" -A trust -U gateway_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$cluster/data" -l "$cluster/postgres.log" -o "-h 127.0.0.1 -p $port -k $cluster" -w start >/dev/null
          trap 'pg_ctl -D "$cluster/data" -m fast -w stop >/dev/null' EXIT
          export TEST_DATABASE_URL="postgresql://gateway_test@127.0.0.1:$port/coding_tools_identity_test"
          createdb -h 127.0.0.1 -p "$port" -U gateway_test coding_tools_identity_test
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/evidence/rust-tests.txt"
          cargo build --locked --manifest-path services/cloud-gateway/Cargo.toml --example restart_probe --example browser_restart_probe
          python services/cloud-gateway/tests/run_restart_test.py --pg-bin /usr/lib/postgresql/16/bin --probe services/cloud-gateway/target/debug/examples/restart_probe | tee "$RUNNER_TEMP/evidence/restart.json"
          python services/cloud-gateway/tests/run_restart_test.py --pg-bin /usr/lib/postgresql/16/bin --probe services/cloud-gateway/target/debug/examples/browser_restart_probe | tee "$RUNNER_TEMP/evidence/browser-restart.json"
          python -m unittest discover -s tests/cloud-gateway-deployment -v 2>&1 | tee "$RUNNER_TEMP/evidence/deployment-tests.txt"
          node --test tests/cloud-gateway/*.test.mjs | tee "$RUNNER_TEMP/evidence/lab.tap"
          node --test tests/offline-safe-ui.test.mjs tests/offline-safe-intent-ui.test.mjs | tee "$RUNNER_TEMP/evidence/ui.tap"
          python scripts/connector_fault_proxy_tests.py 2>&1 | tee "$RUNNER_TEMP/evidence/proxy.txt"
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/evidence/source-tree.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-gateway-source-recovery-checks
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  import:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct exact reviewed source again without executing it
        shell: bash
        run: |
          set -euo pipefail
          cp -a .source-recovery "$RUNNER_TEMP/recovery"
          git checkout --detach ba9c379f08da37f2a05bb96c377a95f432da969e
          python "$RUNNER_TEMP/recovery/recover.py" reconstruct "$RUNNER_TEMP/recovery"
      - name: Import verified Git objects only; NEVER move a branch reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/recovery/recover.py" import "$RUNNER_TEMP/recovery" --output "$RUNNER_TEMP/import-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-gateway-source-import-receipt
          path: ${{ runner.temp }}/import-result.json
          retention-days: 14
          if-no-files-found: error
