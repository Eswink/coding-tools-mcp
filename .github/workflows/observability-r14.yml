name: Gateway observability verification

on:
  push:
    branches: ['ci/observability-r14']
    paths:
      - 'services/cloud-gateway/**'
      - '.github/workflows/observability-r14.yml'

permissions:
  contents: write

concurrency:
  group: observability-r14
  cancel-in-progress: true

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Verify aggregate-only observability
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo fmt --manifest-path services/cloud-gateway/Cargo.toml
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --lib 2>&1 | tee evidence/lib-tests.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_service_contracts 2>&1 | tee evidence/mcp-service.txt
          cargo check --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets
          git diff --check 660a29a265b60e0401f4061558bda2a261f91c80 HEAD
          git diff --name-only 660a29a265b60e0401f4061558bda2a261f91c80 HEAD > evidence/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('evidence/changed-files.txt').read_text(encoding='utf-8').splitlines()
          allowed=(
              'services/cloud-gateway/src/observability.rs',
              'services/cloud-gateway/src/lib.rs',
              'services/cloud-gateway/src/mcp/http.rs',
              'services/cloud-gateway/src/mcp/mod.rs',
              'services/cloud-gateway/src/service/runtime.rs',
              'services/cloud-gateway/src/service/mcp_runtime.rs',
              'services/cloud-gateway/tests/mcp_postgres.rs',
              '.github/workflows/observability-r14.yml',
          )
          assert set(paths) <= set(allowed), paths
          PY
          git add -- services/cloud-gateway
          git diff --cached --check
          git write-tree > evidence/verified-tree.txt
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Import verified observability source blobs only
        if: matrix.os == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo='Eswink/coding-tools-mcp'
          token=os.environ['GH_TOKEN']
          paths=[
              pathlib.Path('services/cloud-gateway/src/observability.rs'),
              pathlib.Path('services/cloud-gateway/src/lib.rs'),
              pathlib.Path('services/cloud-gateway/src/mcp/http.rs'),
              pathlib.Path('services/cloud-gateway/src/mcp/mod.rs'),
              pathlib.Path('services/cloud-gateway/src/service/runtime.rs'),
              pathlib.Path('services/cloud-gateway/src/service/mcp_runtime.rs'),
              pathlib.Path('services/cloud-gateway/tests/mcp_postgres.rs'),
          ]
          rows=[]
          for p in paths:
              raw=p.read_bytes()
              expected=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),
                  headers={
                      'Authorization':'Bearer '+token,
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'Content-Type':'application/json',
                  },
                  method='POST')
              with urllib.request.urlopen(req,timeout=60) as response:
                  got=json.load(response)
              assert got['sha']==expected,(str(p),expected,got.get('sha'))
              rows.append({'path':str(p),'sha':expected,'bytes':len(raw)})
          pathlib.Path('evidence/blob-receipt.json').write_text(
              json.dumps(rows,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observability-r14-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: PostgreSQL MCP and service regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          mkdir -p evidence "$RUNNER_TEMP/pg-observability"
          port="$(python3 - <<'PY'
          import socket
          s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()
          PY
          )"
          initdb -D "$RUNNER_TEMP/pg-observability/data" -A trust -U obs_test --encoding=UTF8 --no-locale >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pg-observability/data" -l "$RUNNER_TEMP/pg-observability/postgres.log" -o "-h 127.0.0.1 -p $port -k $RUNNER_TEMP/pg-observability" -w start >/dev/null
          trap 'pg_ctl -D "$RUNNER_TEMP/pg-observability/data" -m fast -w stop >/dev/null || true' EXIT
          createdb -h 127.0.0.1 -p "$port" -U obs_test coding_tools_identity_test
          export TEST_DATABASE_URL="postgresql://obs_test@127.0.0.1:$port/coding_tools_identity_test"
          cargo fmt --manifest-path services/cloud-gateway/Cargo.toml
          cargo fmt --check --manifest-path services/cloud-gateway/Cargo.toml
          cargo clippy --locked --manifest-path services/cloud-gateway/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test mcp_postgres -- --test-threads=1 2>&1 | tee evidence/mcp-postgres.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test admission_postgres -- --test-threads=1 2>&1 | tee evidence/admission.txt
          cargo test --locked --manifest-path services/cloud-gateway/Cargo.toml --test channel_postgres -- --test-threads=1 2>&1 | tee evidence/channel.txt
          git add -- services/cloud-gateway
          git write-tree > evidence/verified-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observability-r14-postgres
          path: evidence/
          retention-days: 14
          if-no-files-found: error
