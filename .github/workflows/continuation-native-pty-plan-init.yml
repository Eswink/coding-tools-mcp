name: Native PTY delegated feature Plan init (never merge)

on:
  push:
    branches: ['ci/native-pty-plan-init-20260925']
    paths:
      - '.github/workflows/continuation-native-pty-plan-init.yml'

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Start feature and persist initial delegated Plan
        shell: bash
        env:
          FEATURE_DESCRIPTION: >-
            Issue 59 Windows ConPTY and Ubuntu PTY. Add the first bounded native
            pseudo-terminal execution layer on top of verified exec-unification
            without widening local execution authority. Preserve existing
            admission, capability, exec-policy, process-tree, cancel and no-replay
            semantics. Use Windows ConPTY on Windows and a real PTY primitive on
            Ubuntu/Linux. Keep bounded terminal IO, resize, close, cancel and
            process-tree cleanup explicit. Do not implement sandboxing, Hooks,
            snapshots, cloud authority, UI or packaging in this issue. Reuse
            existing process manager/session abstractions where possible instead
            of duplicating execution ownership. Require pre-edit GitNexus
            context/impact, HIGH or CRITICAL review before edits, staged detect
            non-false-clean, Windows 2025 and Ubuntu 24.04 real PTY lifecycle,
            Unicode, resize, cancel and process-tree tests, exact source hashes,
            fast-forward/no-force-push publication and rollback evidence.
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx --yes mcp-probe-kit@4.0.1 install-agent --project-root . > evidence/install.txt 2>&1
          python - <<'PY' > evidence/start-request.json
          import json, os
          print(json.dumps({
            "project_root": os.getcwd(),
            "description": os.environ["FEATURE_DESCRIPTION"],
            "spec_layout": "auto"
          }, separators=(",",":")))
          PY
          ./.mcp-probe-kit/bin/probe exec start_feature --stdin < evidence/start-request.json > evidence/start-feature.json 2>&1
          cat evidence/start-feature.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence/start-feature.json','utf8'));
          if(r.isError===true) process.exit(1);
          function findPlan(v){
            if(!v || typeof v!=='object') return null;
            if(typeof v.planId==='string' && Array.isArray(v.steps)) return v;
            for(const x of Object.values(v)){ const p=findPlan(x); if(p) return p; }
            return null;
          }
          const plan=findPlan(r.structuredContent);
          if(!plan) { console.error('Delegated Plan not found'); process.exit(2); }
          fs.writeFileSync('evidence/plan.json', JSON.stringify(plan,null,2));
          fs.writeFileSync('evidence/plan-id.txt', plan.planId+'\n');
          fs.writeFileSync('evidence/heartbeat-input.json', JSON.stringify({
            plan_id:plan.planId,
            project_root:process.cwd(),
            plan
          }));
          NODE
          ./.mcp-probe-kit/bin/probe exec plan_heartbeat --stdin < evidence/heartbeat-input.json > evidence/heartbeat-output.json 2>&1
          cat evidence/heartbeat-output.json
          plan_id="$(cat evidence/plan-id.txt)"
          plan_path=".mcp-probe-kit/plans/$plan_id.json"
          test -f "$plan_path"
          cp "$plan_path" evidence/plan-state.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('evidence/plan-state.json','utf8'));
          if(!p.planId || p.status!=='active') process.exit(1);
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$plan_path"
          git diff --cached --check
          git commit -m "chore(plan): initialize native PTY delivery"
          git fetch origin "ci/native-pty-plan-init-20260925"
          test "$(git rev-parse "origin/ci/native-pty-plan-init-20260925")" = "$GITHUB_SHA"
          git push origin "HEAD:ci/native-pty-plan-init-20260925"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-pty-plan-init
          path: evidence/
          retention-days: 14
          if-no-files-found: error
