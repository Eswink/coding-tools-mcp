name: Linux authenticated lifecycle engineering validation

on:
  push:
    branches: ['test/linux-auth-negatives-20261001']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  runner-contracts:
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/test/linux-auth-negatives-20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact source before setup
        id: source
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt
          test "$(cat evidence/source-sha.txt)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - name: Original classifier and lifecycle runner contracts
        id: contracts
        if: always() && steps.source.outcome == 'success' && steps.python.outcome == 'success'
        run: |
          set -euo pipefail
          status=0
          python -m unittest discover -s tests/delivery -p 'test_probe_classifier.py' -v > evidence/golden-classifier.txt 2>&1 || status=1
          python -m unittest discover -s tests/delivery -p 'test_linux_lifecycle_probe.py' -v > evidence/lifecycle-runner.txt 2>&1 || status=1
          cat evidence/golden-classifier.txt evidence/lifecycle-runner.txt
          exit "$status"
      - name: Required contract outcomes and source integrity
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source=%s\ncontracts=%s\n' "$SOURCE_RESULT" "$CONTRACT_RESULT" > evidence/step-outcomes.txt
          git diff --exit-code HEAD -- > evidence/tracked-clean.txt
          test "$SOURCE_RESULT" = success
          test "$CONTRACT_RESULT" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-lifecycle-contracts-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  native:
    if: github.repository == 'Eswink/coding-tools-mcp' && github.ref == 'refs/heads/test/linux-auth-negatives-20261001'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact source before native setup
        id: source
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt
          test "$(cat evidence/source-sha.txt)" = "$GITHUB_SHA"
          uname -a > evidence/kernel-version.txt
          printf 'run_id=%s\nrun_attempt=%s\nos=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageOS" > evidence/context.txt
          printf '%s\n' 'Synthetic-authenticated A/D HTTP and E direct dispatcher engineering evidence; not full RC or real ChatGPT acceptance.' > evidence/scope.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - name: Retain harness interpreter without changing sandbox child PATH
        run: printf 'HOST_PYTHON=%s\n' "$(command -v python3)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        id: rust
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Native Linux development libraries
        id: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev dbus-x11 gnome-keyring
      - name: Genuine desktop and kernel test compilation
        id: compile
        if: always() && steps.source.outcome == 'success' && steps.python.outcome == 'success' && steps.rust.outcome == 'success' && steps.dependencies.outcome == 'success'
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          cargo --version > evidence/cargo-version.txt
          rustc --version > evidence/rustc-version.txt
          rustfmt --edition 2021 --check tests/cloud-gateway/linux_sandbox_lifecycle.rs
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test exec_input_contract --no-run 2>&1 | tee evidence/desktop-compile.txt
          cargo test --locked --manifest-path services/local-agent/Cargo.toml --test linux_sandbox --no-run 2>&1 | tee evidence/kernel-compile.txt
      - name: All eleven unchanged authenticated golden probes
        id: golden
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          "$HOST_PYTHON" tests/cloud-gateway/sandbox-dispatch/run_probe.py --evidence evidence/sandbox-dispatch
      - name: Four HTTP cases and one direct primary dispatcher case
        id: lifecycle
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          "$HOST_PYTHON" tests/cloud-gateway/sandbox-lifecycle/run_probe.py --evidence evidence/sandbox-lifecycle
      - name: Fourteen actual kernel sandbox tests
        id: kernel
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          cargo test --locked --manifest-path services/local-agent/Cargo.toml --test linux_sandbox 2>&1 | tee evidence/kernel-tests.txt
          "$HOST_PYTHON" - <<'PY'
          import pathlib, re
          text = pathlib.Path('evidence/kernel-tests.txt').read_text()
          summaries = re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', text)
          assert summaries == [('ok', '14', '0', '0', '0', '0')], summaries
          PY
      - name: Six unchanged child stdin and deadline contracts
        id: stdin
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          # This integration binary links the real native credential provider.
          # Keep its host ledger and Secret Service in one disposable session.
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          fixture_root="$(mktemp -d "$RUNNER_TEMP/linux-lifecycle-stdin.XXXXXX")"
          trap 'rm -rf -- "$fixture_root"' EXIT
          export HOME="$fixture_root/home"
          export XDG_RUNTIME_DIR="$fixture_root/runtime" XDG_DATA_HOME="$fixture_root/data"
          export XDG_CONFIG_HOME="$fixture_root/config" XDG_STATE_HOME="$fixture_root/state"
          export XDG_CACHE_HOME="$fixture_root/cache"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          chmod 700 "$HOME" "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          unset DBUS_SESSION_BUS_ADDRESS GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "isolated-rc-ci-fixture" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --manifest-path src-tauri/Cargo.toml --test exec_input_contract 2>&1 | tee evidence/exec-input.txt
          '
          "$HOST_PYTHON" - <<'PY'
          import pathlib, re
          text = pathlib.Path('evidence/exec-input.txt').read_text()
          summaries = re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', text)
          assert summaries == [('ok', '6', '0', '0', '0', '0')], summaries
          PY
      - name: Preserve all outcomes and reject leftover test injection
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          GOLDEN_RESULT: ${{ steps.golden.outcome }}
          LIFECYCLE_RESULT: ${{ steps.lifecycle.outcome }}
          KERNEL_RESULT: ${{ steps.kernel.outcome }}
          STDIN_RESULT: ${{ steps.stdin.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source=%s\ncompile=%s\ngolden=%s\nlifecycle=%s\nkernel=%s\nstdin=%s\n' "$SOURCE_RESULT" "$COMPILE_RESULT" "$GOLDEN_RESULT" "$LIFECYCLE_RESULT" "$KERNEL_RESULT" "$STDIN_RESULT" > evidence/step-outcomes.txt
          git diff --exit-code HEAD -- > evidence/tracked-clean.txt
          test ! -e src-tauri/src/auth/sandbox_dispatch_probe.rs
          test ! -e src-tauri/src/auth/sandbox_lifecycle_probe.rs
          printf '%s\n' 'aed13ff4af30cbb0dbf693ad250991e375f61f005106295528fa16af2d6ab032  tests/cloud-gateway/ubuntu_sandbox_dispatch.rs' '6d6288fb2a5f119f734a268a80e540f0b75faefa85df7a32ebe7b47417f54b22  tests/cloud-gateway/sandbox-dispatch/run_probe.py' | sha256sum --check | tee evidence/golden-integrity.txt
          for result in "$SOURCE_RESULT" "$COMPILE_RESULT" "$GOLDEN_RESULT" "$LIFECYCLE_RESULT" "$KERNEL_RESULT" "$STDIN_RESULT"; do
            test "$result" = success
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-authenticated-lifecycle-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
