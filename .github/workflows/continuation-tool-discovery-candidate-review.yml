name: Tool discovery candidate review (never merge)
on:
  push:
    branches: ['ci/tool-discovery-candidate-review-20260925']
    paths:
      - 'services/local-agent/src/registry.rs'
      - 'services/local-agent/src/registry_tests.rs'
      - 'services/local-agent/src/lib.rs'
      - '.github/workflows/continuation-tool-discovery-candidate-review.yml'
permissions:
  contents: read
env:
  SOURCE_SHA: f4f93af9ee28aa209bb67643421725fcb22fb7e5
jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact staged scope and impact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          git grep -n 'deferred_specs' "$SOURCE_SHA" -- . > evidence/deferred-text-search.txt || true
          cat evidence/deferred-text-search.txt
          git reset "$SOURCE_SHA"
          npm install --prefix "$RUNNER_TEMP/graph" --no-audit --no-fund gitnexus@1.6.12
          graph="$RUNNER_TEMP/graph/node_modules/.bin/gitnexus"
          "$graph" analyze --workers 1 > evidence/analyze.txt 2>&1
          git restore -- AGENTS.md CLAUDE.md || true
          git add services/local-agent/src/registry.rs services/local-agent/src/registry_tests.rs services/local-agent/src/lib.rs
          git diff --cached --check
          git diff --cached --name-only | tee evidence/changed-paths.txt
          test "$(wc -l < evidence/changed-paths.txt)" -eq 3
          "$graph" detect-changes --scope staged > evidence/detect.txt 2>&1
          cat evidence/detect.txt
          ! grep -q 'No changes detected' evidence/detect.txt
          wc -l services/local-agent/src/registry.rs services/local-agent/src/registry_tests.rs services/local-agent/src/lib.rs | tee evidence/line-counts.txt
          test "$(wc -l < services/local-agent/src/registry.rs)" -lt 500
          test "$(wc -l < services/local-agent/src/registry_tests.rs)" -lt 500
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'services/local-agent/src/registry.rs',
              'services/local-agent/src/registry_tests.rs',
              'services/local-agent/src/lib.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse "$SOURCE_SHA" > evidence/source-commit.txt
          git rev-parse HEAD > evidence/candidate-commit.txt
          echo NEVER_MERGE_HELPER_ONLY > evidence/boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-impact
          path: evidence/
          retention-days: 14
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/local-agent
      - name: Verify deferred discovery candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          mkdir -p evidence
          cargo fmt --check --manifest-path services/local-agent/Cargo.toml
          cargo clippy --locked --manifest-path services/local-agent/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path services/local-agent/Cargo.toml registry -- --nocapture 2>&1 | tee evidence/focused.txt
          cargo test --locked --manifest-path services/local-agent/Cargo.toml 2>&1 | tee evidence/full.txt
          cargo check --locked --manifest-path services/local-agent/Cargo.toml
          git diff --check "$SOURCE_SHA"...HEAD
          python - <<'PY' | tee evidence/source-hashes.txt
          import hashlib
          for p in [
              'services/local-agent/src/registry.rs',
              'services/local-agent/src/registry_tests.rs',
              'services/local-agent/src/lib.rs',
          ]:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
          git rev-parse HEAD > evidence/candidate-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-discovery-${{ matrix.os }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
