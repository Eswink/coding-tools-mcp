name: Offline-safe Round 3 GitNexus impact gate

on:
  push:
    branches:
      - feat/offline-safe-execution-gate
    paths:
      - '.github/workflows/offline-safe-round3-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh GitNexus index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          npx -y gitnexus@latest analyze --skip-embeddings --skip-agents-md --skip-skills | tee evidence/analyze.txt
          npx -y gitnexus@latest status | tee evidence/status.txt
      - name: Query affected execution flows
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest query "MCP runtime listener stop tunnel remote tool authorization dispatch" | tee evidence/query-runtime-dispatch.txt
      - name: Impact RuntimeSupervisor start
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact start --file src-tauri/src/runtime/supervisor.rs --direction upstream | tee evidence/impact-runtime-start.txt
      - name: Impact RuntimeSupervisor status
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact status --file src-tauri/src/runtime/supervisor.rs --direction upstream | tee evidence/impact-runtime-status.txt
      - name: Impact ToolContext background snapshot
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact background_snapshot --file src-tauri/src/tools/context.rs --direction upstream | tee evidence/impact-background-snapshot.txt
      - name: Impact chat-domain intercept
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact intercept --file src-tauri/src/tools/聊天运行域v1.rs --direction upstream | tee evidence/impact-chat-intercept.txt
      - name: Impact RuntimeStatusDto
        shell: bash
        run: |
          set -euo pipefail
          npx -y gitnexus@latest impact RuntimeStatusDto --file src-tauri/src/workspace/model.rs --direction upstream | tee evidence/impact-runtime-status-dto.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-safe-round3-gitnexus-impact
          path: evidence/
          if-no-files-found: error
          retention-days: 30
